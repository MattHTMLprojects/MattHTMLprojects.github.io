<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Retro Twitch Projection TV</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: auto;

      font-family: Arial, Helvetica, sans-serif;
      color: #eeeeee;

      background:
        radial-gradient(
          circle at 50% 30%,
          #62594f 0%,
          #39322c 36%,
          #1b1815 70%,
          #0e0d0c 100%
        );
    }


    /* =========================================================
       ROOM
       ========================================================= */

    .room {
      width: 100%;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 60px 30px 100px;

      background:
        repeating-linear-gradient(
          90deg,
          rgba(255,255,255,0.012) 0px,
          rgba(255,255,255,0.012) 2px,
          transparent 2px,
          transparent 120px
        );
    }


    /* =========================================================
       TELEVISION CABINET
       ========================================================= */

    .tv {
      position: relative;

      width: 760px;

      padding:
        22px
        28px
        20px;

      border:
        3px solid #070707;

      border-radius:
        14px 14px 5px 5px;

      background:
        linear-gradient(
          145deg,
          #3d3d3d 0%,
          #181818 22%,
          #292929 55%,
          #101010 100%
        );

      box-shadow:
        0 35px 50px rgba(0,0,0,0.70),
        inset 2px 2px 3px rgba(255,255,255,0.12),
        inset -4px -3px 12px rgba(0,0,0,0.80);
    }


    /* Cabinet base */

    .tv::after {
      content: "";

      position: absolute;

      left: 36px;
      right: 36px;

      bottom: -22px;

      height: 24px;

      z-index: -1;

      background:
        linear-gradient(
          #171717,
          #070707
        );

      border-radius:
        0 0 6px 6px;

      box-shadow:
        0 8px 15px rgba(0,0,0,0.60);
    }


    /* =========================================================
       TOP BRANDING
       ========================================================= */

    .top-panel {
      height: 44px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding:
        0 14px;

      border:
        1px solid #050505;

      border-radius:
        5px;

      background:
        linear-gradient(
          #2d2d2d,
          #111111
        );

      box-shadow:
        inset 0 1px rgba(255,255,255,0.08);
    }


    .brand {
      color: #a970ff;

      font-size: 22px;
      font-weight: 900;

      letter-spacing: 3px;

      text-shadow:
        0 0 7px rgba(169,112,255,0.45);
    }


    .model {
      color: #989898;

      font-size: 9px;

      letter-spacing: 1.6px;
    }


    /* =========================================================
       SCREEN AREA
       ========================================================= */

    .screen-section {
      display: flex;
      justify-content: center;

      margin-top: 18px;
    }


    .screen-bezel {
      padding:
        24px 27px 15px;

      border:
        3px solid #050505;

      border-radius:
        20px 20px 14px 14px;

      background:
        linear-gradient(
          145deg,
          #050505,
          #252525 48%,
          #090909
        );

      box-shadow:
        inset 0 0 16px #000000,
        inset 2px 2px 4px rgba(255,255,255,0.08),
        0 6px 14px rgba(0,0,0,0.80);
    }


    /*
       The Twitch screen is deliberately fixed at 400 x 300.
    */

    .screen {
      position: relative;

      width: 400px;
      height: 300px;

      overflow: hidden;

      border:
        3px solid #050505;

      border-radius:
        7px;

      background:
        #000000;

      box-shadow:
        0 0 22px rgba(50,30,80,0.18),
        inset 0 0 16px #000000;
    }


    /*
       REAL TWITCH PLAYER
    */

    #twitch-player {
      display: block;

      width: 400px;
      height: 300px;

      border: 0;

      background:
        #000000;
    }


    /*
       Subtle glass effect.

       pointer-events:none is important because this decorative
       layer must not prevent interaction with Twitch.
    */

    .glass {
      position: absolute;

      inset: 0;

      pointer-events: none;

      border-radius:
        5px;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,0.06),
          transparent 18%,
          transparent 78%,
          rgba(145,120,200,0.025)
        );

      box-shadow:
        inset 0 0 15px rgba(0,0,0,0.45);
    }


    /* Power-off screen */

    .standby-screen {
      position: absolute;

      inset: 0;

      z-index: 5;

      display: none;

      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          ellipse at center,
          #1a1a1a,
          #030303 72%
        );

      color:
        #555555;

      font-family:
        "Courier New",
        monospace;

      font-size: 14px;

      letter-spacing: 4px;

      user-select: none;
    }


    .standby-screen.visible {
      display: flex;
    }


    .screen-label {
      margin-top: 10px;

      text-align: center;

      color: #777777;

      font-size: 8px;

      letter-spacing: 3px;
    }


    /* =========================================================
       LOWER CABINET
       ========================================================= */

    .lower-section {
      display: grid;

      grid-template-columns:
        1fr
        190px
        1fr;

      gap: 17px;

      margin-top: 19px;
    }


    /* =========================================================
       SPEAKERS
       ========================================================= */

    .speaker {
      position: relative;

      min-height: 155px;

      overflow: hidden;

      border:
        3px solid #090909;

      border-radius:
        5px;

      background-color:
        #111111;

      background-image:
        radial-gradient(
          #050505 1.2px,
          transparent 1.2px
        );

      background-size:
        5px 5px;

      box-shadow:
        inset 0 0 22px #000000,
        0 3px 5px rgba(0,0,0,0.75);
    }


    .speaker::before {
      content: "";

      position: absolute;

      width: 114px;
      height: 114px;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      border:
        2px solid rgba(100,100,100,0.22);

      border-radius:
        50%;

      box-shadow:
        inset 0 0 25px rgba(0,0,0,0.85),
        0 0 10px rgba(125,125,125,0.10);
    }


    .speaker::after {
      content: "";

      position: absolute;

      width: 34px;
      height: 34px;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      border-radius:
        50%;

      background:
        rgba(0,0,0,0.80);

      box-shadow:
        0 0 5px rgba(90,90,90,0.45);
    }


    /* =========================================================
       CONTROL PANEL
       ========================================================= */

    .controls {
      min-height: 155px;

      padding: 12px;

      border:
        2px solid #060606;

      border-radius:
        5px;

      background:
        linear-gradient(
          #1b1b1b,
          #080808
        );

      box-shadow:
        inset 0 1px rgba(255,255,255,0.06);
    }


    .controls-title {
      margin-bottom: 9px;

      text-align: center;

      color:
        #888888;

      font-size:
        8px;

      letter-spacing:
        2px;
    }


    /* Vintage green channel display */

    .display {
      height: 31px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-bottom: 13px;

      overflow: hidden;

      border:
        2px inset #111111;

      background:
        #07110d;

      color:
        #68f0ac;

      font-family:
        "Courier New",
        monospace;

      font-size:
        10px;

      white-space: nowrap;

      text-shadow:
        0 0 7px rgba(80,255,150,0.75);
    }


    /* =========================================================
       BUTTONS
       ========================================================= */

    .button-row {
      display: flex;

      justify-content: center;

      gap: 8px;

      margin-bottom: 9px;
    }


    button {
      min-width: 65px;
      height: 32px;

      padding:
        0 9px;

      cursor: pointer;

      border:
        1px solid #050505;

      border-top:
        1px solid #626262;

      border-radius:
        3px;

      color:
        #dddddd;

      background:
        linear-gradient(
          #414141,
          #171717
        );

      box-shadow:
        0 3px 0 #050505,
        inset 0 1px rgba(255,255,255,0.12);

      font-size:
        9px;

      font-weight:
        bold;

      letter-spacing:
        0.5px;
    }


    button:hover {
      background:
        linear-gradient(
          #565656,
          #252525
        );
    }


    button:active {
      transform:
        translateY(2px);

      box-shadow:
        0 1px 0 #050505;
    }


    .power-button {
      border:
        1px solid #270707;

      background:
        linear-gradient(
          #7a3838,
          #301010
        );
    }


    .power-button:hover {
      background:
        linear-gradient(
          #974545,
          #421313
        );
    }


    /* =========================================================
       STATUS LED
       ========================================================= */

    .status {
      display: flex;

      align-items: center;
      justify-content: center;

      gap: 8px;

      margin-top: 11px;
    }


    .led {
      width: 9px;
      height: 9px;

      border:
        1px solid #050505;

      border-radius:
        50%;

      background:
        #532121;

      box-shadow:
        inset 0 0 2px #000000;
    }


    .led.on {
      background:
        #ff4141;

      box-shadow:
        0 0 8px rgba(255,50,50,0.80);
    }


    .status-label {
      color:
        #777777;

      font-size:
        7px;

      letter-spacing:
        1px;
    }


    /* =========================================================
       BOTTOM STRIP
       ========================================================= */

    .bottom-strip {
      display: flex;

      align-items: center;
      justify-content: space-between;

      margin-top: 15px;

      padding:
        9px 5px 3px;

      border-top:
        1px solid #393939;

      color:
        #666666;

      font-size:
        8px;

      letter-spacing:
        1.5px;
    }


    .twitch-badge {
      padding:
        4px 10px;

      border-radius:
        2px;

      color:
        white;

      background:
        #6441a5;

      font-size:
        10px;

      font-weight:
        bold;

      letter-spacing:
        1px;

      box-shadow:
        inset 0 1px rgba(255,255,255,0.16);
    }


    /* =========================================================
       TV FEET
       ========================================================= */

    .foot {
      position: absolute;

      bottom: -33px;

      width: 62px;
      height: 13px;

      border-radius:
        0 0 4px 4px;

      background:
        linear-gradient(
          #151515,
          #050505
        );
    }


    .foot.left {
      left:
        75px;
    }


    .foot.right {
      right:
        75px;
    }


    /* =========================================================
       CAPTION
       ========================================================= */

    .caption {
      position: absolute;

      left: 0;
      right: 0;

      bottom: -76px;

      text-align: center;

      color:
        rgba(255,255,255,0.32);

      font-size:
        10px;

      letter-spacing:
        2px;
    }


    /* =========================================================
       SMALLER BROWSER WINDOWS
       ========================================================= */

    @media (max-width: 820px) {

      body {
        align-items:
          flex-start;
      }

      .room {
        justify-content:
          flex-start;

        padding-left:
          20px;

        padding-right:
          20px;
      }
    }

  </style>
</head>


<body>

  <main class="room">

    <section class="tv">

      <!-- =====================================================
           BRANDING PANEL
           ===================================================== -->

      <div class="top-panel">

        <div class="brand">
          TWITCH
        </div>

        <div class="model">
          RP-247 DIGITAL PROJECTION RECEIVER
        </div>

      </div>


      <!-- =====================================================
           SCREEN
           ===================================================== -->

      <div class="screen-section">

        <div class="screen-bezel">

          <div class="screen">


            <!-- =================================================
                 REAL TWITCH PLAYER

                 Channel:
                 theburntpeanut_247

                 GitHub Pages parent:
                 matthtmlprojects.github.io

                 Player dimensions:
                 400 x 300
                 ================================================= -->

            <iframe
              id="twitch-player"
              src="https://player.twitch.tv/?channel=theburntpeanut_247&parent=matthtmlprojects.github.io&autoplay=false"
              height="300"
              width="400"
              allowfullscreen>
            </iframe>


            <!-- Decorative screen glass -->

            <div class="glass"></div>


            <!-- Visible when TV is switched off -->

            <div
              class="standby-screen"
              id="standby-screen">

              STANDBY

            </div>

          </div>


          <div class="screen-label">
            400 × 300 DIGITAL PROJECTION DISPLAY
          </div>

        </div>

      </div>


      <!-- =====================================================
           LOWER SECTION
           ===================================================== -->

      <div class="lower-section">


        <!-- LEFT SPEAKER -->

        <div
          class="speaker"
          aria-label="Left speaker">
        </div>


        <!-- CONTROL PANEL -->

        <div class="controls">

          <div class="controls-title">
            DIGITAL CONTROL
          </div>


          <div
            class="display"
            id="display">

            THEBURNTPEANUT_247

          </div>


          <div class="button-row">

            <button
              type="button"
              class="power-button"
              id="power-button">

              POWER

            </button>


            <button
              type="button"
              id="channel-button">

              CHANNEL

            </button>

          </div>


          <div class="button-row">

            <button
              type="button"
              id="live-button">

              LIVE

            </button>

          </div>


          <div class="status">

            <div
              class="led on"
              id="power-led">
            </div>


            <span class="status-label">
              POWER
            </span>

          </div>

        </div>


        <!-- RIGHT SPEAKER -->

        <div
          class="speaker"
          aria-label="Right speaker">
        </div>


      </div>


      <!-- =====================================================
           LOWER BRANDING
           ===================================================== -->

      <div class="bottom-strip">

        <span>
          DIGITAL PROJECTION SYSTEM
        </span>


        <span class="twitch-badge">
          twitch
        </span>


        <span>
          STEREO
        </span>

      </div>


      <!-- FEET -->

      <div class="foot left"></div>

      <div class="foot right"></div>


      <!-- CAPTION -->

      <div class="caption">
        RETRO TWITCH PROJECTION RECEIVER
      </div>

    </section>

  </main>


  <script>

    /* =========================================================
       CONFIGURATION
       ========================================================= */

    const TWITCH_CHANNEL =
      "theburntpeanut_247";

    const TWITCH_PARENT =
      "matthtmlprojects.github.io";


    /* =========================================================
       TWITCH URL GENERATOR
       ========================================================= */

    function createTwitchURL(autoplay) {

      return (
        "https://player.twitch.tv/" +
        "?channel=" +
        encodeURIComponent(TWITCH_CHANNEL) +
        "&parent=" +
        encodeURIComponent(TWITCH_PARENT) +
        "&autoplay=" +
        autoplay
      );

    }


    /* =========================================================
       ELEMENT REFERENCES
       ========================================================= */

    const player =
      document.getElementById("twitch-player");

    const powerButton =
      document.getElementById("power-button");

    const channelButton =
      document.getElementById("channel-button");

    const liveButton =
      document.getElementById("live-button");

    const standbyScreen =
      document.getElementById("standby-screen");

    const powerLED =
      document.getElementById("power-led");

    const display =
      document.getElementById("display");


    /* =========================================================
       TELEVISION STATE
       ========================================================= */

    let televisionOn = true;


    /* =========================================================
       POWER BUTTON
       ========================================================= */

    powerButton.addEventListener(
      "click",
      function() {

        televisionOn =
          !televisionOn;


        /* TV ON */

        if (televisionOn) {

          standbyScreen.classList.remove(
            "visible"
          );

          powerLED.classList.add(
            "on"
          );

          display.textContent =
            "THEBURNTPEANUT_247";


          /*
            Re-create the Twitch player.
          */

          player.src =
            createTwitchURL(false);

        }


        /* TV OFF */

        else {

          /*
            Stop ank";


          standbyScreen.classList.add(
            "visible"
          );


          powerLED.classList.remove(
            "on"
          );


          display.textContent =
            "STANDBY";

        }

      }
    );


    /* =========================================================
       CHANNEL BUTTON

       Version 1 has one station, so CHANNEL simply performs
       a vintage-style retune/reload.
       ========================================================= */

    channelButton.addEventListener(
      "click",
      function() {

        if (!televisionOn) {
          return;
        }


        display.textContent =
          "TUNING...";


        player.src =
          createTwitchURL(false);


        window.setTimeout(
          function() {

            if (televisionOn) {

              display.textContent =
                "THEBURNTPEANUT_247";

            }

          },
          900
        );

      }
    );


    /* =========================================================
       LIVE BUTTON

       Reload Twitch requesting autoplay.

       The browser and Twitch can still apply their own
       autoplay restrictions.
       ========================================================= */

    liveButton.addEventListener(
      "click",
      function() {

        if (!televisionOn) {
          return;
        }


        display.textContent =
          "LIVE";


        player.src =
          createTwitchURL(true);


        window.setTimeout(
          function() {

            if (televisionOn) {

              display.textContent =
                "THEBURNTPEANUT_247";

            }

          },
          1200
        );

      }
    );


  </script>

</body>
</html>
