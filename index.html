<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Retro Twitch Projection TV</title>

  <style>
    :root {
      --twitch-purple: #9147ff;
      --display-green: #6dffae;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      color: #eee;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: auto;

      background:
        radial-gradient(
          circle at 50% 18%,
          #756650 0%,
          #554837 25%,
          #30281f 55%,
          #17130f 100%
        );
    }

    /* =========================================
       ROOM
       ========================================= */

    .room {
      position: relative;

      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: flex-start;

      padding: 55px 30px 130px;

      overflow: hidden;
    }

    .wall-texture {
      position: absolute;
      inset: 0 0 30% 0;

      pointer-events: none;

      background:
        repeating-linear-gradient(
          90deg,
          rgba(255,255,255,.012) 0,
          rgba(255,255,255,.012) 2px,
          transparent 2px,
          transparent 115px
        );
    }

    .floor {
      position: absolute;

      left: 0;
      right: 0;
      bottom: 0;

      height: 31%;

      background:
        linear-gradient(
          rgba(0,0,0,.12),
          rgba(0,0,0,.38)
        ),
        repeating-linear-gradient(
          90deg,
          #473527 0,
          #473527 145px,
          #3e2c20 146px,
          #3e2c20 151px,
          #493629 152px,
          #493629 294px
        );

      border-top: 9px solid #21170f;

      box-shadow:
        inset 0 18px 32px rgba(0,0,0,.35);
    }

    /* =========================================
       ENTERTAINMENT CENTER WRAPPER
       ========================================= */

    .entertainment-center {
      position: relative;
      z-index: 2;

      width: min(1540px, 96vw);

      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* =========================================
       TELEVISION
       ========================================= */

    .tv {
      position: relative;
      z-index: 5;

      width: 100%;

      padding: 25px 34px 29px;

      border: 4px solid #050505;
      border-radius: 19px 19px 7px 7px;

      background:
        linear-gradient(
          145deg,
          #454545 0%,
          #181818 17%,
          #303030 52%,
          #141414 82%,
          #080808 100%
        );

      box-shadow:
        0 42px 55px rgba(0,0,0,.72),
        inset 3px 3px 4px rgba(255,255,255,.12),
        inset -5px -5px 15px rgba(0,0,0,.85);
    }

    /* =========================================
       TV HEADER
       ========================================= */

    .tv-header {
      height: 55px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 0 18px;

      border: 1px solid #030303;
      border-radius: 7px;

      background:
        linear-gradient(
          #303030,
          #0f0f0f
        );

      box-shadow:
        inset 0 1px rgba(255,255,255,.1);
    }

    .brand {
      color: var(--twitch-purple);

      font-size: clamp(24px, 3vw, 34px);
      font-weight: 900;
      letter-spacing: 5px;

      text-shadow:
        0 0 9px rgba(145,71,255,.55);
    }

    .model {
      color: #9c9c9c;

      font-size: 10px;
      letter-spacing: 2px;
    }

    /* =========================================
       1280 x 720 SCREEN
       ========================================= */

    .screen-bezel {
      margin-top: 20px;

      padding: 28px 30px 16px;

      border: 4px solid #030303;
      border-radius: 24px 24px 16px 16px;

      background:
        linear-gradient(
          145deg,
          #030303,
          #262626 48%,
          #070707
        );

      box-shadow:
        inset 0 0 22px #000,
        inset 3px 3px 5px rgba(255,255,255,.07),
        0 7px 16px rgba(0,0,0,.8);
    }

    .screen {
      position: relative;

      width: 1280px;
      max-width: 100%;

      aspect-ratio: 16 / 9;

      margin: 0 auto;

      overflow: hidden;

      border: 4px solid #020202;
      border-radius: 9px;

      background: #000;

      box-shadow:
        0 0 30px rgba(100,60,150,.18),
        inset 0 0 22px #000;
    }

    /*
       This is the actual Twitch player.

       Screen dimensions are controlled by the parent
       .screen element and remain 16:9.
    */

    #twitch-player {
      display: block;

      width: 100%;
      height: 100%;

      border: 0;

      background: #000;
    }

    .screen-glass {
      position: absolute;
      inset: 0;

      z-index: 2;

      pointer-events: none;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,.045),
          transparent 18%,
          transparent 81%,
          rgba(145,71,255,.018)
        );

      box-shadow:
        inset 0 0 17px rgba(0,0,0,.42);
    }

    /* =========================================
       STANDBY SCREEN
       ========================================= */

    .standby {
      position: absolute;
      inset: 0;

      z-index: 5;

      display: none;

      justify-content: center;
      align-items: center;

      color: #535353;

      font-family: "Courier New", monospace;
      font-size: clamp(16px, 2vw, 27px);
      letter-spacing: 7px;

      background:
        radial-gradient(
          ellipse at center,
          #1c1c1c,
          #030303 72%,
          #000
        );

      user-select: none;
    }

    .standby.visible {
      display: flex;
    }

    .screen-label {
      margin-top: 11px;

      text-align: center;

      color: #747474;

      font-size: 9px;
      letter-spacing: 4px;
    }

    /* =========================================
       LOWER TV
       ========================================= */

    .lower-tv {
      display: grid;

      grid-template-columns:
        1fr
        minmax(260px, 330px)
        1fr;

      gap: 20px;

      margin-top: 21px;
    }

    /* =========================================
       SPEAKERS
       ========================================= */

    .speaker {
      position: relative;

      min-height: 235px;

      border: 4px solid #070707;
      border-radius: 7px;

      overflow: hidden;

      background-color: #111;

      background-image:
        radial-gradient(
          #050505 1.5px,
          transparent 1.5px
        );

      background-size: 6px 6px;

      box-shadow:
        inset 0 0 26px #000,
        0 4px 7px rgba(0,0,0,.75);
    }

    .speaker::before {
      content: "";

      position: absolute;

      width: 170px;
      height: 170px;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      border:
        3px solid rgba(100,100,100,.2);

      border-radius:
        50%;

      box-shadow:
        inset 0 0 35px rgba(0,0,0,.9),
        0 0 12px rgba(150,150,150,.08);
    }

    .speaker::after {
      content: "";

      position: absolute;

      width: 52px;
      height: 52px;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      border-radius:
        50%;

      background:
        rgba(0,0,0,.82);

      box-shadow:
        0 0 7px rgba(90,90,90,.4);
    }

    /* =========================================
       DIGITAL CONTROL
       ========================================= */

    .controls {
      min-height: 235px;

      padding: 17px;

      border: 3px solid #050505;
      border-radius: 7px;

      background:
        linear-gradient(
          #202020,
          #080808
        );

      box-shadow:
        inset 0 1px rgba(255,255,255,.06);
    }

    .controls-title {
      margin-bottom: 12px;

      text-align: center;

      color: #909090;

      font-size: 9px;
      letter-spacing: 3px;
    }

    /*
       Current-channel display
    */

    .channel-display {
      height: 42px;

      display: flex;
      justify-content: center;
      align-items: center;

      margin-bottom: 10px;

      overflow: hidden;

      border: 3px inset #111;

      color: var(--display-green);
      background: #07110d;

      font-family: "Courier New", monospace;
      font-size: 11px;

      white-space: nowrap;

      text-shadow:
        0 0 8px rgba(80,255,150,.78);
    }

    /*
       New channel tuner
    */

    .channel-search {
      width: 100%;
      height: 39px;

      margin-bottom: 14px;

      padding: 0 10px;

      border: 2px inset #111;
      border-radius: 2px;

      outline: none;

      color: var(--display-green);
      background: #07110d;

      font-family: "Courier New", monospace;
      font-size: 11px;

      text-align: center;

      box-shadow:
        inset 0 0 7px rgba(0,0,0,.9);

      text-shadow:
        0 0 6px rgba(80,255,150,.5);
    }

    .channel-search::placeholder {
      color: #40745a;
      opacity: 1;
    }

    .channel-search:focus {
      border-color: #34634b;

      box-shadow:
        inset 0 0 7px rgba(0,0,0,.9),
        0 0 7px rgba(80,255,150,.25);
    }

    /* =========================================
       BUTTONS
       ========================================= */

    .button-row {
      display: flex;
      justify-content: center;

      gap: 13px;
    }

    button {
      min-width: 105px;
      height: 43px;

      cursor: pointer;

      border: 1px solid #030303;
      border-top: 1px solid #6a6a6a;
      border-radius: 4px;

      color: #ddd;

      background:
        linear-gradient(
          #474747,
          #171717
        );

      box-shadow:
        0 4px 0 #030303,
        inset 0 1px rgba(255,255,255,.14);

      font-size: 10px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    button:hover {
      background:
        linear-gradient(
          #5b5b5b,
          #262626
        );
    }

    button:active {
      transform:
        translateY(3px);

      box-shadow:
        0 1px 0 #030303;
    }

    .power-button {
      background:
        linear-gradient(
          #783838,
          #301010
        );
    }

    .power-button:hover {
      background:
        linear-gradient(
          #974545,
          #421313
        );
    }

    /* =========================================
       STATUS
       ========================================= */

    .status {
      display: flex;

      justify-content: center;
      align-items: center;

      gap: 10px;

      margin-top: 21px;
    }

    .led {
      width: 11px;
      height: 11px;

      border-radius: 50%;

      background: #572222;

      border: 1px solid #050505;
    }

    .led.on {
      background: #ff4141;

      box-shadow:
        0 0 10px rgba(255,55,55,.85);
    }

    .status-text {
      color: #777;

      font-size: 8px;
      letter-spacing: 2px;
    }

    /* =========================================
       BOTTOM TV STRIP
       ========================================= */

    .bottom-strip {
      display: flex;

      justify-content: space-between;
      align-items: center;

      margin-top: 18px;

      padding: 12px 7px 2px;

      border-top: 1px solid #414141;

      color: #707070;

      font-size: 9px;
      letter-spacing: 2px;
    }

    .twitch-badge {
      padding: 6px 14px;

      border-radius: 3px;

      color: #fff;
      background: #6441a5;

      font-size: 12px;
      font-weight: bold;
    }

    /* =========================================
       ENTERTAINMENT CABINET
       ========================================= */

    .media-stand {
      position: relative;
      z-index: 3;

      width: 91%;
      min-height: 250px;

      display: grid;

      grid-template-columns:
        1fr
        1.25fr
        1fr;

      gap: 10px;

      padding: 18px 20px 21px;

      border: 4px solid #170e09;
      border-top: 8px solid #291a10;

      background:
        linear-gradient(
          90deg,
          #392317,
          #513420 48%,
          #3a2417
        );

      box-shadow:
        0 30px 35px rgba(0,0,0,.60),
        inset 0 2px rgba(255,255,255,.08);
    }

    .shelf {
      position: relative;

      min-height: 205px;

      padding: 15px;

      border: 5px solid #29180f;

      background:
        linear-gradient(
          145deg,
          #17120f,
          #0b0908
        );

      box-shadow:
        inset 0 0 26px rgba(0,0,0,.85);
    }

    /* =========================================
       VHS TAPES
       ========================================= */

    .vhs-row {
      position: absolute;

      left: 12%;
      right: 12%;
      bottom: 18px;

      display: flex;
      justify-content: center;
      align-items: flex-end;

      gap: 4px;
    }

    .vhs {
      width: 30px;
      height: 135px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 2px solid #111;
      border-radius: 2px;

      color: #eee6ca;

      background:
        linear-gradient(
          90deg,
          #191919,
          #3e352e,
          #181818
        );

      box-shadow:
        3px 4px 5px rgba(0,0,0,.5);

      font-family:
        "Courier New",
        monospace;

      font-size: 7px;
      font-weight: bold;

      writing-mode: vertical-rl;

      letter-spacing: 1px;
    }

    .vhs.red {
      border-top: 7px solid #9c3c3c;
    }

    .vhs.blue {
      border-top: 7px solid #43629b;
    }

    .vhs.gold {
      border-top: 7px solid #9d7b32;
    }

    .vhs.green {
      border-top: 7px solid #4d784f;
    }

    .vhs.purple {
      border-top: 7px solid #76518d;
    }

    .vhs.white {
      border-top: 7px solid #c2bda9;
    }

    /* =========================================
       VCR
       ========================================= */

    .vcr {
      position: absolute;

      left: 50%;
      top: 50%;

      width: 88%;
      height: 86px;

      transform:
        translate(-50%, -50%);

      border: 3px solid #050505;
      border-radius: 4px;

      background:
        linear-gradient(
          #333,
          #111
        );

      box-shadow:
        0 7px 10px rgba(0,0,0,.65);
    }

    .vcr-slot {
      position: absolute;

      left: 14%;
      top: 26px;

      width: 53%;
      height: 14px;

      border: 2px solid #050505;

      background: #020202;

      box-shadow:
        inset 0 2px 4px #000;
    }

    .vcr-display {
      position: absolute;

      right: 9%;
      top: 24px;

      width: 55px;
      height: 21px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #7affb7;

      background: #04100a;

      border: 1px solid #111;

      font-family:
        "Courier New",
        monospace;

      font-size: 9px;

      text-shadow:
        0 0 5px #62ffa8;
    }

    .vcr-label {
      position: absolute;

      left: 14%;
      bottom: 10px;

      color: #777;

      font-size: 7px;
      letter-spacing: 2px;
    }

    /* =========================================
       GAME CONSOLE
       ========================================= */

    .console {
      position: absolute;

      left: 50%;
      top: 40%;

      width: 78%;
      height: 68px;

      transform:
        translate(-50%, -50%);

      border: 3px solid #161616;
      border-radius: 22px 22px 8px 8px;

      background:
        linear-gradient(
          #b0aba2,
          #77726c
        );

      box-shadow:
        0 8px 10px rgba(0,0,0,.55),
        inset 0 1px rgba(255,255,255,.28);
    }

    .console-slot {
      position: absolute;

      left: 22%;
      right: 22%;
      top: 18px;

      height: 12px;

      border-radius: 4px;

      background: #353535;

      box-shadow:
        inset 0 2px 3px #111;
    }

    .console-power {
      position: absolute;

      left: 10%;
      bottom: 13px;

      width: 10px;
      height: 10px;

      border-radius: 50%;

      background: #b54444;

      box-shadow:
        0 0 5px rgba(255,70,70,.7);
    }

    .console-label {
      position: absolute;

      right: 10%;
      bottom: 11px;

      color: #383838;

      font-size: 7px;
      font-weight: bold;
      letter-spacing: 1.5px;
    }

    /* =========================================
       GAME CONTROLLER
       ========================================= */

    .controller {
      position: absolute;

      left: 50%;
      bottom: 10px;

      width: 150px;
      height: 70px;

      transform:
        translateX(-50%)
        rotate(-4deg);

      border: 3px solid #1b1b1b;
      border-radius: 35px 35px 46px 46px;

      background:
        linear-gradient(
          #aaa59d,
          #69645f
        );

      box-shadow:
        0 7px 9px rgba(0,0,0,.5);
    }

    .dpad-h,
    .dpad-v {
      position: absolute;

      background: #252525;

      border-radius: 3px;
    }

    .dpad-h {
      left: 21px;
      top: 30px;

      width: 41px;
      height: 14px;
    }

    .dpad-v {
      left: 35px;
      top: 17px;

      width: 14px;
      height: 41px;
    }

    .game-button {
      position: absolute;

      width: 17px;
      height: 17px;

      border-radius: 50%;

      background: #a93752;

      box-shadow:
        inset 0 1px rgba(255,255,255,.2);
    }

    .game-button.one {
      right: 25px;
      top: 22px;
    }

    .game-button.two {
      right: 46px;
      top: 39px;
    }

    /* =========================================
       RESPONSIVE
       ========================================= */

    @media (max-width: 1050px) {

      .room {
        padding-left: 18px;
        padding-right: 18px;
      }

      .model {
        display: none;
      }

      .lower-tv {
        grid-template-columns:
          1fr
          230px
          1fr;
      }

      .speaker {
        min-height: 205px;
      }

      .speaker::before {
        width: 130px;
        height: 130px;
      }

      .media-stand {
        width: 96%;
      }
    }

    @media (max-width: 720px) {

      .room {
        justify-content: flex-start;
      }

      .entertainment-center {
        width: 700px;
      }

      .media-stand {
        min-width: 650px;
      }
    }

  </style>
</head>


<body>

  <main class="room">

    <div class="wall-texture"></div>

    <div class="floor"></div>


    <div class="entertainment-center">


      <!-- =====================================
           PROJECTION TELEVISION
           ===================================== -->

      <section class="tv">


        <!-- TV HEADER -->

        <div class="tv-header">

          <div class="brand">
            TWITCH
          </div>

          <div class="model">
            RP-720 WIDESCREEN DIGITAL PROJECTION RECEIVER
          </div>

        </div>


        <!-- ===================================
             TWITCH SCREEN
             =================================== -->

        <div class="screen-bezel">

          <div class="screen">


            <!--
              Twitch player.

              Default channel:
              theburntpeanut_247

              GitHub Pages parent:
              matthtmlprojects.github.io
            -->

            <iframe
              id="twitch-player"

              src="https://player.twitch.tv/?channel=theburntpeanut_247&parent=matthtmlprojects.github.io&autoplay=false"

              allowfullscreen>

            </iframe>


            <div class="screen-glass"></div>


            <div
              id="standby-screen"
              class="standby">

              STANDBY

            </div>

          </div>


          <div class="screen-label">
            1280 × 720 WIDESCREEN DIGITAL PROJECTION DISPLAY
          </div>

        </div>


        <!-- ===================================
             LOWER TV
             =================================== -->

        <div class="lower-tv">


          <!-- LEFT SPEAKER -->

          <div class="speaker"></div>


          <!-- =================================
               DIGITAL CONTROL
               ================================= -->

          <div class="controls">

            <div class="controls-title">
              DIGITAL CONTROL
            </div>


            <!-- Current station -->

            <div
              id="channel-display"
              class="channel-display">

              THEBURNTPEANUT_247

            </div>


            <!--
              NEW CHANNEL TUNER

              Accepts:
              monstercat

              OR a Twitch URL
            -->

            <input
              id="channel-search"
              class="channel-search"
              type="text"

              placeholder="ENTER TWITCH CHANNEL"

              autocomplete="off"
              spellcheck="false"
            >


            <div class="button-row">

              <button
                id="power-button"
                class="power-button"
                type="button">

                POWER

              </button>


              <button
                id="channel-button"
                type="button">

                CHANNEL

              </button>

            </div>


            <div class="status">

              <div
                id="power-led"
                class="led on">
              </div>


              <span class="status-text">
                POWER
              </span>

            </div>

          </div>


          <!-- RIGHT SPEAKER -->

          <div class="speaker"></div>

        </div>


        <!-- TV FOOTER -->

        <div class="bottom-strip">

          <span>
            55-INCH-STYLE PROJECTION SYSTEM
          </span>


          <span class="twitch-badge">
            twitch
          </span>


          <span>
            DIGITAL STEREO
          </span>

        </div>

      </section>


      <!-- =====================================
           90s ENTERTAINMENT CABINET
           ===================================== -->

      <section class="media-stand">


        <!-- VHS SHELF -->

        <div class="shelf">

          <div class="vhs-row">

            <div class="vhs red">
              NIGHT SHIFT
            </div>

            <div class="vhs blue">
              SPACE RUN
            </div>

            <div class="vhs gold">
              ROAD TRIP
            </div>

            <div class="vhs green">
              ARCADE
            </div>

            <div class="vhs purple">
              VIDEO MIX
            </div>

            <div class="vhs white">
              MOVIE 96
            </div>

          </div>

        </div>


        <!-- VCR SHELF -->

        <div class="shelf">

          <div class="vcr">

            <div class="vcr-slot"></div>


            <div class="vcr-display">
              12:00
            </div>


            <div class="vcr-label">
              Hi-Fi STEREO VHS
            </div>

          </div>

        </div>


        <!-- GAME CONSOLE SHELF -->

        <div class="shelf">

          <div class="console">

            <div class="console-slot"></div>

            <div class="console-power"></div>

            <div class="console-label">
              16-BIT
            </div>

          </div>


          <div class="controller">

            <div class="dpad-h"></div>

            <div class="dpad-v"></div>

            <div class="game-button one"></div>

            <div class="game-button two"></div>

          </div>

        </div>

      </section>

    </div>

  </main>


  <script>

    /* =========================================
       CONFIGURATION
       ========================================= */

    const TWITCH_PARENT =
      "matthtmlprojects.github.io";


    /*
      Default Twitch station.
    */

    let currentChannel =
      "theburntpeanut_247";


    /*
      TV begins switched on.
    */

    let televisionOn =
      true;


    /* =========================================
       ELEMENT REFERENCES
       ========================================= */

    const player =
      document.getElementById(
        "twitch-player"
      );


    const powerButton =
      document.getElementById(
        "power-button"
      );


    const channelButton =
      document.getElementById(
        "channel-button"
      );


    const channelSearch =
      document.getElementById(
        "channel-search"
      );


    const standbyScreen =
      document.getElementById(
        "standby-screen"
      );


    const powerLED =
      document.getElementById(
        "power-led"
      );


    const channelDisplay =
      document.getElementById(
        "channel-display"
      );


    /* =========================================
       TWITCH URL GENERATOR
       ========================================= */

    function buildTwitchURL(channel) {

      return (
        "https://player.twitch.tv/" +

        "?channel=" +
        encodeURIComponent(channel) +

        "&parent=" +
        encodeURIComponent(TWITCH_PARENT) +

        "&autoplay=false"
      );

    }


    /* =========================================
       CLEAN TYPED CHANNEL
       ========================================= */

    function cleanChannelName(value) {

      let channel =
        value.trim();


      /*
        Allows the user to paste:

        https://www.twitch.tv/channelname

        rather than requiring only the username.
      */

      channel =
        channel.replace(
          /^https?:\/\/(www\.)?twitch\.tv\//i,
          ""
        );


      /*
        Remove query strings, paths, or trailing
        slashes that may follow the channel name.
      */

      channel =
        channel.split(/[/?#]/)[0];


      return channel.trim();

    }


    /* =========================================
       TUNE TO CHANNEL
       ========================================= */

    function tuneChannel() {

      if (!televisionOn) {

        return;

      }


      const requestedChannel =
        cleanChannelName(
          channelSearch.value
        );


      /*
        Don't do anything if the field is empty.
      */

      if (!requestedChannel) {

        channelDisplay.textContent =
          "ENTER CHANNEL";

        return;

      }


      /*
        Store the newly selected channel.
      */

      currentChannel =
        requestedChannel;


      /*
        Give the control panel an old-TV-style
        tuning message.
      */

      channelDisplay.textContent =
        "TUNING...";


      /*
        Send the new channel to the existing
        Twitch iframe.

        The TV and iframe dimensions do not change.
      */

      player.src =
        buildTwitchURL(
          currentChannel
        );


      /*
        Clear the tuner field so it is ready
        for another channel.
      */

      channelSearch.value =
        "";


      /*
   ow.setTimeout(

        function () {

          if (televisionOn) {

            channelDisplay.textContent =
              currentChannel.toUpperCase();

          }

        },

        900

      );

    }


    /* =========================================
       CHANNEL BUTTON
       ========================================= */

    channelButton.addEventListener(

      "click",

      tuneChannel

    );


    /* =========================================
       PRESS ENTER TO CHANGE CHANNEL
       ========================================= */

    channelSearch.addEventListener(

      "keydown",

      function (event) {

        if (event.key === "Enter") {

          tuneChannel();

        }

      }

    );


    /* =========================================
       POWER BUTTON
       ========================================= */

    powerButton.addEventListener(

      "click",

      function () {


        televisionOn =
          !televisionOn;


        /* -------------------------
           POWER ON
           ------------------------- */

        if (televisionOn) {


          standbyScreen.classList.remove(
            "visible"
          );


          powerLED.classList.add(
            "on"
          );


          channelDisplay.textContent =
            currentChannel.toUpperCase();


          /*
            Restore wherever the user was
            previously tuned.
          */

          player.src =
            buildTwitchURL(
              currentChannel
            );

        }


        /* -------------------------
           POWER OFF
           ------------------------- */

        else {


          /*
            about:blank unloads the stream.
          */

          player.src =
            "about:blank";


          standbyScreen.classList.add(
            "visible"
          );


          powerLED.classList.remove(
            "on"
          );


          channelDisplay.textContent =
            "STANDBY";

        }

      }

    );

  </script>

</body>
</html>
