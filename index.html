<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>The Nostalgic Desktop by Matt</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
}

body {
  overflow: hidden;

  background: #333;
  color: #fff;

  font-family:
    Tahoma,
    "Segoe UI",
    Arial,
    sans-serif;
}

button,
a {
  font: inherit;
}


/* ================================================
   WALLPAPER
================================================ */

#wallpaperLayer {
  position: fixed;
  inset: 0;
  z-index: 0;

  overflow: hidden;

  background: #666666;
}

#wallpaperLayer svg {
  display: block;

  width: 100%;
  height: 100%;
}


/* ================================================
   PERMANENT CONTROLS
================================================ */

#paintButton,
#resetButton,
#notebookButton,
#speechButton {
  position: fixed;
  z-index: 100000;

  width: 52px;
  height: 42px;

  border: 0;
  border-radius: 10px;

  color: #fff;

  cursor: pointer;

  box-shadow:
    0 5px 15px rgba(0, 0, 0, 0.35);

  transition:
    background 0.15s,
    transform 0.15s;
}

#resetButton {
  left: 24px;
  top: 22px;

  background: #EBEBEB;

  font-size: 23px;
  font-weight: bold;
}

#notebookButton {
  left: 24px;
  top: 126px;

  background: #9E9E9E;

  font-size: 22px;
}

#notebookButton:hover {
  background: #7D7D7D;

  transform: scale(1.06);
}

#notebookButton:active {
  transform: scale(0.95);
}


#paintButton {
  left: 24px;
  top: 74px;

  background: #EBEBEB;

  font-size: 21px;
}

#resetButton:hover {
  background: #99D3FF;
  transform: scale(1.06);
}

#paintButton:hover,
#paintButton.open {
  background: #99D3FF;
  transform: scale(1.06);
}

#speechButton {
  position: fixed;

  left: 24px;
  bottom: 24px;

  z-index: 100000;

  width: 52px;
  height: 42px;

  border: 0;
  border-radius: 10px;

  background: #3D3D3D;
  color: white;

  font-size: 24px;

  cursor: pointer;

  box-shadow:
    0 5px 15px
    rgba(0, 0, 0, 0.35);

  transition:
    background 0.15s,
    transform 0.15s;
}

#speechButton:hover {
  background: #f1cd4f;

  transform: scale(1.06);
}

#speechButton:active {
  transform: scale(0.95);
}

#resetButton:active,
#paintButton:active {
  transform: scale(0.95);
}


/* ================================================
   BACKGROUND PANEL
================================================ */

#backgroundPanel {
  position: fixed;
  z-index: 99999;

  left: 88px;
  top: 74px;

  display: flex;
  align-items: center;
  gap: 8px;

  max-width: calc(100vw - 105px);
  padding: 8px;

  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 12px;

  background: rgba(31, 31, 31, 0.94);

  box-shadow:
    0 8px 24px rgba(0, 0, 0, 0.45);

  overflow-x: auto;

  opacity: 0;
  visibility: hidden;

  transform: translateX(-12px);

  pointer-events: none;

  transition:
    opacity 0.18s,
    transform 0.18s,
    visibility 0.18s;
}

#backgroundPanel.open {
  opacity: 1;
  visibility: visible;

  transform: translateX(0);

  pointer-events: auto;
}

.wallpaperChoice {
  position: relative;

  flex: 0 0 auto;

  width: 76px;
  height: 48px;
  padding: 0;

  border: 2px solid #555;
  border-radius: 7px;

  background: #333;

  overflow: hidden;

  cursor: pointer;

  transition:
    border-color 0.15s,
    transform 0.15s,
    box-shadow 0.15s;
}

.wallpaperChoice:hover {
  border-color: #00a4ef;

  transform: scale(1.06);

  box-shadow:
    0 0 10px rgba(0, 164, 239, 0.45);
}

.wallpaperChoice.selected {
  border-color: #fff;

  box-shadow:
    0 0 0 2px #00a4ef;
}

.wallpaperChoice svg {
  display: block;

  width: 100%;
  height: 100%;
}

.defaultWallpaper::after {
  content: "Default";

  position: absolute;
  inset: 0;

  display: grid;
  place-items: center;

  color: #ddd;

  font-size: 10px;
  font-weight: bold;
}


/* ================================================
   DESKTOP ICON GRID
================================================ */

#desktopIcons {
  position: fixed;
  z-index: 20;

  left: 112px;
  top: 22px;
  right: 22px;
  bottom: 22px;

  /* Icons will now position themselves */
  display: block;

  overflow: hidden;

  pointer-events: none;
}

.desktop-icon {
  position: absolute;

  width: 92px;
  height: 102px;
  padding: 5px;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;

  border: 1px solid transparent;
  border-radius: 5px;

  background: transparent;
  color: #fff;

  text-decoration: none;

  cursor: pointer;
  pointer-events: auto;

  user-select: none;
  -webkit-user-select: none;
  -webkit-user-drag: none;

  touch-action: none;

  outline: none;
}

.desktop-icon.dragging {
  position: absolute;

  z-index: 50000;

  pointer-events: none;

  opacity: 0.92;

  transform: scale(1.08);

  background:
    rgba(25, 83, 169, 0.58);

  border-color:
    rgba(255, 255, 255, 0.78);

  box-shadow:
    0 8px 20px
    rgba(0, 0, 0, 0.38);

  transition: none;
}

.desktop-icon.drop-target {
  background:
    rgba(25, 83, 169, 0.30);

  border-color:
    rgba(255, 255, 255, 0.44);
}

.desktop-icon:hover,
.desktop-icon:focus-visible,
.desktop-icon.selected {
  border-color:
    rgba(255, 255, 255, 0.62);

  background:
    rgba(25, 83, 169, 0.42);
}

.desktop-icon:active {
  background:
    rgba(19, 66, 145, 0.64);
}

.icon-art {
  width: 52px;
  height: 52px;

  display: grid;
  place-items: center;

  font-size: 40px;
  line-height: 1;

  pointer-events: none;

  filter:
    drop-shadow(
      2px 3px 2px rgba(0, 0, 0, 0.52)
    );

  transition:
    transform 130ms ease,
    filter 130ms ease;
}

.desktop-icon:hover .icon-art {
  transform:
    translateY(-2px)
    scale(1.05);

  filter:
    drop-shadow(
      2px 4px 3px rgba(0, 0, 0, 0.56)
    )
    brightness(1.08);
}

.icon-label {
  max-width: 100%;

  margin-top: 4px;
  padding: 1px 3px;

  color: #fff;

  font-size: 11px;
  line-height: 1.1;
  text-align: center;

  pointer-events: none;

  text-shadow:
    1px 1px 2px #000,
    -1px -1px 2px rgba(0, 0, 0, 0.78);
}

.desktop-icon.selected .icon-label {
  background: #1556ac;
}


/* ================================================
   RECYCLE BIN NOTIFICATION
================================================ */

#iconNotification {
  position: fixed;
  z-index: 100001;

  left: 50%;
  bottom: 25px;

  width:
    min(
      330px,
      calc(100vw - 30px)
    );

  padding: 10px 14px;

  display: none;

  transform: translateX(-50%);

  color: #143c63;

  border: 1px solid #1765af;
  border-radius: 7px;

  background:
    linear-gradient(
      #fff,
      #dceeff
    );

  box-shadow:
    0 5px 16px rgba(0, 0, 0, 0.44);

  font-size: 12px;
  line-height: 1.4;
}

#iconNotification.show {
  display: block;

  animation:
    noticeIn 0.25s ease-out;
}

@keyframes noticeIn {
  from {
    opacity: 0;

    transform:
      translate(-50%, 10px);
  }

  to {
    opacity: 1;

    transform:
      translate(-50%, 0);
  }
}


/* ================================================
   SPIRAL NOTEBOOK WINDOW
================================================ */

.notebookWindow {
  position: fixed;

  left: 50%;
  top: 50%;

  width: 440px;
  height: 520px;

  max-width: calc(100vw - 20px);
  max-height: calc(100vh - 20px);

  transform: translate(-50%, -50%);

  z-index: 50000;

  filter:
    drop-shadow(
      0 14px 24px
      rgba(0, 0, 0, 0.48)
    );
}


/* ================================================
   NOTEBOOK COVER / PAPER
================================================ */

.notebook {
  position: relative;

  width: 100%;
  height: 100%;

  overflow: hidden;

  border-radius:
    8px 13px 13px 8px;

  background:
    repeating-linear-gradient(
      to bottom,
      #fffdf2 0px,
      #fffdf2 30px,
      #999FF5 31px,
      #fffdf2 32px
    );

  border:
    1px solid #c9c2a7;

  box-shadow:
    inset 14px 0 18px
    rgba(0, 0, 0, 0.07);
}


/* Red notebook margin */

.notebook::before {
  content: "";

  position: absolute;

  left: 62px;
  top: 0;
  bottom: 0;

  width: 1px;

  background:
    rgba(220, 83, 83, 0.55);

  pointer-events: none;
}


/* ================================================
   SPIRAL BINDING
================================================ */

.notebookSpiral {
  position: absolute;

  left: -13px;
  top: 16px;
  bottom: 16px;

  width: 35px;

  z-index: 5;

  display: flex;
  flex-direction: column;
  justify-content: space-around;

  pointer-events: none;
}

.notebookRing {
  width: 31px;
  height: 17px;

  border:
    4px solid #42474b;

  border-right-color:
    #9ba1a5;

  border-radius: 50%;

  background: transparent;

  box-shadow:
    1px 2px 2px
    rgba(0, 0, 0, 0.28);
}


/* ================================================
   NOTEBOOK DRAG AREA
================================================ */

.notebookHeader {
  position: absolute;

  left: 24px;
  top: 0;
  right: 0;

  height: 45px;

  z-index: 6;

  display: flex;
  align-items: center;
  justify-content: flex-end;

  padding: 6px 8px;

  cursor: grab;

  touch-action: none;
  user-select: none;
}

.notebookHeader:active {
  cursor: grabbing;
}


/* ================================================
   CLOSE BUTTON
================================================ */

.notebookClose {
  width: 31px;
  height: 31px;

  padding: 0;

  display: grid;
  place-items: center;

  border:
    1px solid rgba(70, 70, 70, 0.28);

  border-radius: 7px;

  background:
    rgba(245, 245, 235, 0.88);

  color: #555;

  font-size: 17px;

  cursor: pointer;
}

.notebookClose:hover {
  background: #d9534f;
  color: white;

  border-color: #d9534f;
}


/* ================================================
   NOTEBOOK CONTENT
================================================ */

.notebookPage {
  position: absolute;

  left: 76px;
  top: 68px;
  right: 25px;
  bottom: 54px;

  z-index: 3;
}

.notebookTitle {
  margin: 0 0 10px;

  color: #424242;

  font-size: 20px;
  font-weight: 700;
}

.notebookText {
  width: 100%;
  height: calc(100% - 40px);

  padding: 3px 5px;

  resize: none;

  border: none;
  outline: none;

  background: transparent;

  color: #333;

  font-family:
    "Segoe Print",
    "Comic Sans MS",
    cursive;

  font-size: 17px;
  line-height: 32px;
}


/* ================================================
   PAGE CONTROLS
================================================ */

.notebookNavigation {
  position: absolute;

  left: 76px;
  right: 22px;
  bottom: 12px;

  z-index: 6;

  display: flex;
  align-items: center;
  justify-content: center;

  gap: 13px;
}

.notebookNavigation button {
  width: 34px;
  height: 28px;

  padding: 0;

  border:
    1px solid #aaa;

  border-radius: 6px;

  background:
    rgba(255, 255, 255, 0.82);

  color: #444;

  cursor: pointer;
}

.notebookNavigation button:hover {
  background: #dbeeff;
}

.notebookPageNumber {
  min-width: 78px;

  color: #666;

  font-size: 11px;
  font-weight: bold;

  text-align: center;
}

/* ================================================
   TEXT TO SPEECH WINDOW
================================================ */

.speechWindow {
  position: fixed;

  left: 50%;
  top: 50%;

  width: 390px;
  min-height: 490px;

  max-width: calc(100vw - 20px);
  max-height: calc(100vh - 20px);

  transform: translate(-50%, -50%);

  z-index: 60000;

  overflow: hidden;

  border:
    2px solid rgba(255, 255, 255, 0.2);

  border-radius: 15px;

  background:
    linear-gradient(
      145deg,
      #182536,
      #101720
    );

  color: white;

  box-shadow:
    0 18px 45px
    rgba(0, 0, 0, 0.58);
}


/* ================================================
   SPEECH WINDOW HEADER
================================================ */

.speechHeader {
  height: 48px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 7px 9px 7px 15px;

  border-bottom:
    1px solid rgba(255, 255, 255, 0.13);

  background:
    rgba(0, 0, 0, 0.18);

  cursor: grab;

  touch-action: none;
  user-select: none;
}

.speechHeader:active {
  cursor: grabbing;
}

.speechHeaderTitle {
  color: #f3d969;

  font-size: 14px;
  font-weight: bold;

  letter-spacing: 0.5px;
}

.speechClose {
  width: 32px;
  height: 32px;

  padding: 0;

  display: grid;
  place-items: center;

  border:
    1px solid rgba(255, 255, 255, 0.22);

  border-radius: 7px;

  background:
    rgba(255, 255, 255, 0.08);

  color: white;

  font-size: 16px;

  cursor: pointer;
}

.speechClose:hover {
  border-color: #d9534f;

  background: #d9534f;
}


/* ================================================
   SPEECH CHARACTER
================================================ */

.speechFaceArea {
  position: relative;

  height: 152px;

  display: grid;
  place-items: center;
}

.speechFace {
  position: relative;

  width: 125px;
  height: 125px;

  display: grid;
  place-items: center;

  font-size: 100px;
  line-height: 1;

  filter:
    drop-shadow(
      0 9px 10px
      rgba(0, 0, 0, 0.38)
    );

  user-select: none;
}

.speechMouth {
  position: absolute;

  left: 55%;
  top: 62%;

  width: 65px;
  height: 30px;

  border-radius: 50%;

  background: #1C1C1C;

  transform:
    translate(-50%, -50%)
    scaleX(0.65)
    scaleY(0.85);

  transform-origin: center;

  opacity: 0;

  pointer-events: none;
}

.speechFace.talking
.speechMouth {
  opacity: 1;
}

.speechMouth.syllable {
  animation:
    talkingMouth 0.10s
    steps(2, end);
}

@keyframes talkingMouth {
  0% {
    transform:
      translate(-50%, -50%)
      scaleX(0.55)
      scaleY(0.40);
  }

  20% {
    transform:
      translate(-50%, -50%)
      scaleX(1.75)
      scaleY(1.05);
  }

  45% {
    transform:
      translate(-50%, -50%)
      scaleX(0.85)
      scaleY(0.65);
  }

  65% {
    transform:
      translate(-50%, -50%)
      scaleX(1.65)
      scaleY(1.10);
  }

  82% {
    transform:
      translate(-50%, -50%)
      scaleX(0.95)
      scaleY(0.70);
  }

  100% {
    transform:
      translate(-50%, -50%)
      scaleX(0.55)
      scaleY(0.40);
  }
}

/* ================================================
   SPEECH CONTROLS
================================================ */

.speechContent {
  padding: 0 20px 20px;
}

.speechField {
  margin-bottom: 13px;
}

.speechField label {
  display: block;

  margin-bottom: 5px;

  color: #ccd8e1;

  font-size: 12px;
  font-weight: bold;
}

.speechField select,
.speechField textarea {
  width: 100%;

  border:
    1px solid rgba(255, 255, 255, 0.2);

  border-radius: 7px;

  background: #202c37;
  color: white;

  font: inherit;
}

.speechField select {
  height: 38px;

  padding: 0 9px;
}

.speechField textarea {
  height: 96px;

  padding: 10px;

  resize: none;

  line-height: 1.4;
}

.speechField select:focus,
.speechField textarea:focus {
  outline:
    2px solid #e5b92f;

  outline-offset: 1px;
}

.speechActions {
  display: flex;
  gap: 9px;
}

.speechAction {
  flex: 1;

  min-height: 40px;

  border:
    1px solid rgba(255, 255, 255, 0.2);

  border-radius: 8px;

  color: white;

  cursor: pointer;
}

.speechSpeak {
  background: #2d7f4b;
}

.speechSpeak:hover {
  background: #3d9c5f;
}

.speechStop {
  background: #7d3434;
}

.speechStop:hover {
  background: #a14545;
}

.speechStatus {
  min-height: 17px;

  margin: 12px 0 0;

  color: #becbd3;

  font-size: 11px;
  text-align: center;
}


/* ================================================
   SMALL SCREEN SPEECH WINDOW
================================================ */

@media (max-width: 700px) {
  .speechWindow {
    width:
      min(
        390px,
        calc(100vw - 20px)
      );

    min-height: 460px;
  }
}

/* ================================================
   SMALL SCREENS
================================================ */

@media (max-width: 700px) {
  #resetButton {
    left: 12px;
    top: 12px;
  }

  #paintButton {
    left: 12px;
    top: 62px;
  }

#notebookButton {
  left: 12px;
  top: 112px;
}

  #backgroundPanel {
    left: 74px;
    top: 62px;

    max-width:
      calc(100vw - 86px);
  }

  .wallpaperChoice {
    width: 64px;
    height: 42px;
  }

#speechButton {
  left: 12px;
  bottom: 12px;
}

  #desktopIcons {
    left: 12px;
    top: 166px;
    right: 12px;
    bottom: 12px;
  }

  .icon-art {
    width: 45px;
    height: 45px;

    font-size: 35px;
  }

  .icon-label {
    font-size: 9px;
  }

.notebookWindow {
  width:
    min(
      440px,
      calc(100vw - 20px)
    );

  height:
    min(
      520px,
      calc(100vh - 20px)
    );
}

}
</style>
</head>

<body>

<!-- ================================================
     WALLPAPER
================================================ -->

<div id="wallpaperLayer"></div>


<!-- ================================================
     PERMANENT CONTROLS
================================================ -->

<button
  id="resetButton"
  type="button"
  title="Reset desktop"
>
  🔄
</button>

<button
  id="paintButton"
  type="button"
  title="Choose background"
  aria-expanded="false"
>
  🎨
</button>

<button
  id="notebookButton"
  type="button"
  title="Open notebook"
  aria-label="Open notebook"
>
  📓
</button>

<button
  id="speechButton"
  type="button"
  title="Open text to speech"
  aria-label="Open text to speech"
>
  😎
</button>


<!-- ================================================
     BACKGROUND PANEL
================================================ -->

<div
  id="backgroundPanel"
  aria-label="Background choices"
>
  <button
    class="wallpaperChoice defaultWallpaper selected"
    type="button"
    data-wallpaper="default"
    title="Default gray"
    aria-label="Default gray background"
  ></button>


  <button
    class="wallpaperChoice"
    type="button"
    data-wallpaper="classic"
    title="Classic geometric"
    aria-label="Classic geometric background"
  >
    <svg
      viewBox="0 0 160 100"
      aria-hidden="true"
    >
      <rect
        width="160"
        height="100"
        fill="#087f86"
      />

      <path
        d="M0 76L52 38L92 64L160 20V100H0Z"
        fill="#003f52"
      />

      <path
        d="M0 89L61 58L107 82L160 50V100H0Z"
        fill="#12a9a0"
        opacity=".6"
      />
    </svg>
  </button>


  <button
    class="wallpaperChoice"
    type="button"
    data-wallpaper="meadow"
    title="Meadow and sky"
    aria-label="Meadow and sky background"
  >
    <svg
      viewBox="0 0 160 100"
      aria-hidden="true"
    >
      <rect
        width="160"
        height="65"
        fill="#68c6fa"
      />

      <rect
        y="65"
        width="160"
        height="35"
        fill="#4fa82c"
      />

      <ellipse
        cx="45"
        cy="25"
        rx="30"
        ry="9"
        fill="#fff"
        opacity=".8"
      />

      <path
        d="M0 90Q70 55 160 80V100H0Z"
        fill="#2c7d27"
      />
    </svg>
  </button>


  <button
    class="wallpaperChoice"
    type="button"
    data-wallpaper="ribbons"
    title="Luminous ribbons"
    aria-label="Luminous ribbons background"
  >
    <svg
      viewBox="0 0 160 100"
      aria-hidden="true"
    >
      <rect
        width="160"
        height="100"
        fill="#081532"
      />

      <path
        d="M-20 83C28 20 65 11 181 64"
        fill="none"
        stroke="#596cff"
        stroke-width="18"
      />

      <path
        d="M-18 98C48 44 87 45 177 12"
        fill="none"
        stroke="#5ee9ff"
        stroke-width="7"
      />
    </svg>
  </button>


  <button
    class="wallpaperChoice"
    type="button"
    data-wallpaper="blueLight"
    title="Blue light"
    aria-label="Blue light background"
  >
    <svg
      viewBox="0 0 160 100"
      aria-hidden="true"
    >
      <rect
        width="160"
        height="100"
        fill="#001329"
      />

      <rect
        x="65"
        y="18"
        width="56"
        height="64"
        fill="#087fd7"
      />

      <path
        d="M93 18V82M65 50H121"
        stroke="#b6edff"
        stroke-width="2"
      />
    </svg>
  </button>


  <button
    class="wallpaperChoice"
    type="button"
    data-wallpaper="bloom"
    title="Folded bloom"
    aria-label="Folded bloom background"

/* ================================================
   DESKTOP GRID POSITIONING
================================================ */

function getGridSize() {

  const rect =
    desktop.getBoundingClientRect();

  return {
    columns: Math.max(
      1,
      Math.floor(
        rect.width /
        GRID_CELL_WIDTH
      )
    ),

    rows: Math.max(
      1,
      Math.floor(
        rect.height /
        GRID_CELL_HEIGHT
      )
    )
  };

}


function positionIcon(
  icon,
  col,
  row
) {

  icon.dataset.gridCol =
    String(col);

  icon.dataset.gridRow =
    String(row);


  icon.style.left =
    col *
    GRID_CELL_WIDTH +
    "px";

  icon.style.top =
    row *
    GRID_CELL_HEIGHT +
    "px";

}


function positionAllIcons() {

  icons.forEach(function(icon) {

    const defaultPosition =
      DEFAULT_ICON_POSITIONS[
        icon.id
      ] || {
        col: 0,
        row: 0
      };


    positionIcon(
      icon,
      defaultPosition.col,
      defaultPosition.row
    );

  });

}

function findIconAtCell(
  col,
  row,
  ignoredIcon = null
) {

  return icons.find(
    function(icon) {

      if(icon === ignoredIcon) {
        return false;
      }


      return (
        Number(
          icon.dataset.gridCol
        ) === col &&

        Number(
          icon.dataset.gridRow
        ) === row
      );

    }
  ) || null;

}

function getCellFromPointer(
  pointerX,
  pointerY
) {

  const desktopRect =
    desktop.getBoundingClientRect();

  const gridSize =
    getGridSize();


  let col =
    Math.floor(
      (
        pointerX -
        desktopRect.left
      ) /
      GRID_CELL_WIDTH
    );


  let row =
    Math.floor(
      (
        pointerY -
        desktopRect.top
      ) /
      GRID_CELL_HEIGHT
    );


  col =
    Math.max(
      0,
      Math.min(
        gridSize.columns - 1,
        col
      )
    );


  row =
    Math.max(
      0,
      Math.min(
        gridSize.rows - 1,
        row
      )
    );


  return {
    col,
    row
  };

}

const icons =

const recycle =

const notice =

let noticeTimer = null;


/* --------------------------------
   DRAG STATE
-------------------------------- */

let draggedIcon = null;

let dragPointerId = null;

let dragStartX = 0;
let dragStartY = 0;

let dragOffsetX = 0;
let dragOffsetY = 0;

let dragStarted = false;

let targetCell = null;

const ICON_DRAG_THRESHOLD = 6;


/* ================================================
   SELECTION
================================================ */

function clearSelection() {

  icons.forEach(function(icon) {
    icon.classList.remove(
      "selected"
    );
  });

}


function selectIcon(icon) {

  clearSelection();

  icon.classList.add(
    "selected"
  );

}


/* ================================================
   RECYCLE BIN
================================================ */

function showRecycleNotice() {

  clearTimeout(
    noticeTimer
  );

  notice.classList.add(
    "show"
  );

  noticeTimer =
    setTimeout(
      function() {

        notice.classList.remove(
          "show"
        );

      },
      3000
    );

}



function updateTargetCell(
  pointerX,
  pointerY
) {

  targetCell =
    getCellFromPointer(
      pointerX,
      pointerY
    );

}


/* ================================================
   BEGIN POINTER
================================================ */

function beginIconPointer(
  event,
  icon
) {

  if(
    event.pointerType === "mouse" &&
    event.button !== 0
  ) {
    return;
  }


  draggedIcon =
    icon;

  dragPointerId =
    event.pointerId;

  dragStartX =
    event.clientX;

  dragStartY =
    event.clientY;


  const rect =
    icon.getBoundingClientRect();


  dragOffsetX =
    event.clientX -
    rect.left;

  dragOffsetY =
    event.clientY -
    rect.top;


  dragStarted =
    false;


  selectIcon(
    icon
  );

icon.dataset.originalCol =
  icon.dataset.gridCol;

icon.dataset.originalRow =
  icon.dataset.gridRow;

  icon.setPointerCapture(
    event.pointerId
  );

}


/* ================================================
   START ACTUAL DRAG
================================================ */

function startIconDrag(
  pointerX,
  pointerY
) {

  if(
    !draggedIcon ||
    dragStarted
  ) {
    return;
  }


  dragStarted =
    true;


  const rect =
    draggedIcon
      .getBoundingClientRect();


  /*
    Preserve its current visual size
    when switching from grid placement
    to fixed positioning.
  */

  draggedIcon.style.width =
    rect.width + "px";

  draggedIcon.style.height =
    rect.height + "px";


  draggedIcon.classList.add(
    "dragging"
  );


  moveDraggedIcon(
    pointerX,
    pointerY
  );

}


/* ================================================
   MOVE DRAGGED ICON
================================================ */

function moveDraggedIcon(
  pointerX,
  pointerY
) {
  if(
    !draggedIcon ||
    !dragStarted
  ) {
    return;
  }

  const desktopRect =
    desktop.getBoundingClientRect();

  let left =
    pointerX -
    desktopRect.left -
    dragOffsetX;

  let top =
    pointerY -
    desktopRect.top -
    dragOffsetY;

  const maximumLeft =
    Math.max(
      0,
      desktopRect.width -
      draggedIcon.offsetWidth
    );

  const maximumTop =
    Math.max(
      0,
      desktopRect.height -
      draggedIcon.offsetHeight
    );

  left =
    Math.max(
      0,
      Math.min(
        maximumLeft,
        left
      )
    );

  top =
    Math.max(
      0,
      Math.min(
        maximumTop,
        top
      )
    );

  draggedIcon.style.left =
    left + "px";

  draggedIcon.style.top =
    top + "px";

  updateTargetCell(
    pointerX,
    pointerY
  );
}

/* ================================================
   POINTER MOVE
================================================ */

function moveIconPointer(
  event
) {

  if(
    !draggedIcon ||
    event.pointerId !==
    dragPointerId
  ) {
    return;
  }


  const movement =
    Math.hypot(
      event.clientX -
      dragStartX,

      event.clientY -
      dragStartY
    );


  if(
    !dragStarted &&
    movement >=
    ICON_DRAG_THRESHOLD
  ) {

    startIconDrag(
      event.clientX,
      event.clientY
    );

  }


  if(dragStarted) {

    event.preventDefault();

    moveDraggedIcon(
      event.clientX,
      event.clientY
    );

  }

}


/* ================================================
   FINISH DRAG
================================================ */

function finishIconPointer(
  event
) {
  if(
    !draggedIcon ||
    event.pointerId !== dragPointerId
  ) {
    return;
  }

  const icon = draggedIcon;

  if(dragStarted) {
    if(targetCell) {
      const occupiedIcon =
        findIconAtCell(
          targetCell.col,
          targetCell.row,
          icon
        );

      /*
        Move only when the destination
        grid cell is empty.
      */

      if(!occupiedIcon) {
        positionIcon(
          icon,
          targetCell.col,
          targetCell.row
        );
      }
      else {
        /*
          Return to the original cell if
          another icon occupies the target.
        */

        positionIcon(
          icon,
          Number(
            icon.dataset.originalCol
          ),
          Number(
            icon.dataset.originalRow
          )
        );
      }
    }
    else {
      /*
        Return to the original cell if
        no valid target was found.
      */

      positionIcon(
        icon,
        Number(
          icon.dataset.originalCol
        ),
        Number(
          icon.dataset.originalRow
        )
      );
    }

    icon.classList.remove(
      "dragging"
    );

    /*
      Restore the normal icon dimensions.
      Keep left and top because those hold
      the snapped grid position.
    */

    icon.style.width = "";
    icon.style.height = "";

    /*
      Prevent the link from opening at the
      end of a drag.
    */

    icon.dataset.justDragged =
      "true";

    setTimeout(
      function() {
        delete icon.dataset.justDragged;
      },
      0
    );
  }

  try {
    if(
      icon.hasPointerCapture(
        event.pointerId
      )
    ) {
      icon.releasePointerCapture(
        event.pointerId
      );
    }
  }
  catch(error) {
    /* Nothing needed */
  }

  draggedIcon = null;
  dragPointerId = null;
  dragStarted = false;
  targetCell = null;
}

/* ================================================
   ATTACH ICON CONTROLS
================================================ */

icons.forEach(function(icon) {

  icon.addEventListener(
    "pointerdown",
    function(event) {

      beginIconPointer(
        event,
        icon
      );

    }
  );


  icon.addEventListener(
    "pointermove",
    moveIconPointer
  );


  icon.addEventListener(
    "pointerup",
    finishIconPointer
  );


  icon.addEventListener(
    "pointercancel",
    finishIconPointer
  );


  icon.addEventListener(
    "click",
    function(event) {

      /*
        Dragging must never launch
        the project's link.

      if(
        icon.dataset

        event.preventDefault();
        return;

      }


      selectIcon(

      );

        showRecycleNotice();

      }

    }
  );

});

/* --------------------------------
   NOTEBOOK DRAG STATE
-------------------------------- */

let notebookDragging = false;

let notebookPointerId = null;

let notebookStartX = 0;
let notebookStartY = 0;

let notebookStartLeft = 0;
let notebookStartTop = 0;


/* ================================================
   CREATE NOTEBOOK
================================================ */

function openNotebook() {

  /*

  }

        <button
          class="notebookNext"
          type="button"
          title="Next page"
        >
          ▶
        </button>

      </div>

    </div>
  `;


  document.body.appendChild(
    notebookWindow
  );


  const header =
    notebookWindow.querySelector(
      ".notebookHeader"
    );

  const closeButton =
    notebookWindow.querySelector(
      ".notebookClose"
    );

  const previousButton =
    notebookWindow.querySelector(
      ".notebookPrevious"
    );

  const nextButton =
    notebookWindow.querySelector(
      ".notebookNext"
    );

  const textArea =
    notebookWindow.querySelector(
      ".notebookText"
    );


  /* ================================================
     CLOSE NOTEBOOK
  ================================================ */

  closeButton.addEventListener(
    "click",
    function(event) {

      event.stopPropagation();

      saveCurrentNotebookPage();

      notebookWindow.remove();

      notebookWindow =
        null;

    }
  );


  /* ================================================
     PAGE TEXT
  ================================================ */

  textArea.addEventListener(
    "input",
    function() {

      notebookPages[
        notebookPage
      ] =
        textArea.value;

    }
  );


  /* ================================================
     PREVIOUS PAGE
  ================================================ */

  previousButton.addEventListener(
    "click",
    function() {

      saveCurrentNotebookPage();

      notebookPage =
        Math.max(
          0,
          notebookPage - 1
        );

      updateNotebookPage();

    }
  );


  /* ================================================
     NEXT PAGE
  ================================================ */

  nextButton.addEventListener(
    "click",
    function() {

      saveCurrentNotebookPage();

      notebookPage =
        Math.min(
          NOTEBOOK_PAGE_COUNT - 1,
          notebookPage + 1
        );

      updateNotebookPage();

    }
  );


  /* ================================================
     START DRAGGING NOTEBOOK
  ================================================ */

  header.addEventListener(
    "pointerdown",
    function(event) {

      if(
        event.target.closest(
          ".notebookClose"
        )
      ) {
        return;
      }


      if(
        event.pointerType ===
          "mouse" &&
        event.button !== 0
      ) {
        return;
      }


      event.preventDefault();


      const rect =
        notebookWindow
          .getBoundingClientRect();


      /*
        The notebook initially uses
        translate(-50%, -50%).

        Convert it into ordinary pixel
        coordinates before dragging.
      */

      notebookWindow.style.transform =
        "none";

      notebookWindow.style.left =
        rect.left + "px";

      notebookWindow.style.top =
        rect.top + "px";


      notebookDragging =
        true;

      notebookPointerId =
        event.pointerId;

      notebookStartX =
        event.clientX;

      notebookStartY =
        event.clientY;

      notebookStartLeft =
        rect.left;

      notebookStartTop =
        rect.top;


      header.setPointerCapture(
        event.pointerId
      );

    }
  );


  /* ================================================
     MOVE NOTEBOOK
  ================================================ */

  header.addEventListener(
    "pointermove",
    function(event) {

      if(
        !notebookDragging ||
        event.pointerId !==
          notebookPointerId
      ) {
        return;
      }


      let nextLeft =
        notebookStartLeft +
        (
          event.clientX -
          notebookStartX
        );

      let nextTop =
        notebookStartTop +
        (
          event.clientY -
          notebookStartY
        );


      const width =
        notebookWindow.offsetWidth;

      const height =
        notebookWindow.offsetHeight;


      /*
        Keep the complete notebook
        inside the visible browser.
      */

      nextLeft =
        Math.max(
          10,
          Math.min(
            window.innerWidth -
            width -
            10,
            nextLeft
          )
        );


      nextTop =
        Math.max(
          10,
          Math.min(
            window.innerHeight -
            height -
            10,
            nextTop
          )
        );


      notebookWindow.style.left =
        nextLeft + "px";

      notebookWindow.style.top =
        nextTop + "px";

    }
  );


  /* ================================================
     STOP NOTEBOOK DRAG
  ================================================ */

  function stopNotebookDrag(
    event
  ) {

    if(
      !notebookDragging ||
      event.pointerId !==
        notebookPointerId
    ) {
      return;
    }


    notebookDragging =
      false;

    notebookPointerId =
      null;


    try {

      if(
        header.hasPointerCapture(
          event.pointerId
        )
      ) {

        header.releasePointerCapture(
          event.pointerId
        );

      }

    }
    catch(error) {
      /* Nothing needed */
    }

  }


  header.addEventListener(
    "pointerup",
    stopNotebookDrag
  );

  header.addEventListener(
    "pointercancel",
    stopNotebookDrag
  );


  updateNotebookPage();

}


/* ================================================
   SAVE CURRENT PAGE
================================================ */

function saveCurrentNotebookPage() {

  if(!notebookWindow) {
    return;
  }


  const textArea =
    notebookWindow.querySelector(
      ".notebookText"
    );


  if(textArea) {

    notebookPages[

    ] =

}


/* ================================================
   UPDATE NOTEBOOK PAGE
================================================ */

function updateNotebookPage() {

  if(!notebookWindow) {

  }


  const textArea =

      ".notebookText"
    );

  const pageNumber =
    notebookWindow.querySelector(

/* ================================================
   LANGUAGE MENU
================================================ */

function getFriendlyLanguageName(
  languageTag
) {

  try {

    const locale =
      new Intl.Locale(
        languageTag
      );


    const languageNames =
      new Intl.DisplayNames(
        ["en"],
        {
          type: "language"
        }
      );


    const regionNames =
      new Intl.DisplayNames(
        ["en"],
        {
          type: "region"
        }
      );


    const languageName =
      languageNames.of(
        locale.language
      );


    if(locale.region) {

      const regionName =
        regionNames.of(
          locale.region
        );


      return (
        languageName +
        " (" +
        regionName +
        ")"
      );

    }


    return languageName;

  }
  catch(error) {

    /*
      Fall back to the original language
      code if this particular browser
      cannot format it.
    */

    return languageTag;

  }

}


function populateSpeechLanguageMenu() {

  if(!speechWindow) {
    return;
  }


  const languageSelect =
    speechWindow.querySelector(
      "#speechLanguage"
    );


  const languages =
    Array.from(
      new Set(
        speechVoices.map(
          function(voice) {
            return voice.lang;
          }
        )
      )
    ).sort();


  languageSelect.innerHTML =
    "";


  languages.forEach(
    function(language) {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        language;

option.textContent =
  getFriendlyLanguageName(
    language
  );

      languageSelect.appendChild(
        option
      );

    }
  );


  /*
    Prefer an English voice initially
    when one exists.
  */

  const englishLanguage =
    languages.find(
      function(language) {
        return language
          .toLowerCase()
          .startsWith("en");
      }
    );


  if(englishLanguage) {

    languageSelect.value =
      englishLanguage;

  }


  populateSpeechVoiceMenu();

}


/* ================================================
   VOICE MENU
================================================ */

function populateSpeechVoiceMenu() {

  if(!speechWindow) {
    return;
  }


  const languageSelect =
    speechWindow.querySelector(
      "#speechLanguage"
    );

  const voiceSelect =
    speechWindow.querySelector(
      "#speechVoice"
    );


  const selectedLanguage =
    languageSelect.value;


  const matchingVoices =
    speechVoices.filter(
      function(voice) {

        return (
          voice.lang ===
          selectedLanguage
        );

      }
    );


  voiceSelect.innerHTML =
    "";


  matchingVoices.forEach(
    function(voice) {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        voice.voiceURI;

      option.textContent =
        voice.name +
        (
          voice.default
            ? " — Default"
            : ""
        );

      voiceSelect.appendChild(
        option
      );

    }
  );


  updateSpeechStatus(
    matchingVoices.length
      ? matchingVoices.length +
        " voice" +
        (
          matchingVoices.length === 1
            ? ""
            : "s"
        ) +
        " available"
      : "No voice available for this language"
  );

}


/* ================================================
   SPEAK TEXT
================================================ */

function speakTypedText() {

  if(!speechWindow) {
    return;
  }


  const textArea =
    speechWindow.querySelector(
      "#speechText"
    );

  const languageSelect =
    speechWindow.querySelector(
      "#speechLanguage"
    );

  const voiceSelect =
    speechWindow.querySelector(
      "#speechVoice"
    );


  const text =
    textArea.value.trim();


  if(!text) {

    updateSpeechStatus(
      "Type something for Smiley to say."
    );

    textArea.focus();

    return;

  }


  const selectedVoice =
    speechVoices.find(
      function(voice) {

        return (
          voice.voiceURI ===
          voiceSelect.value
        );

      }
    );


  speechSynth.cancel();


  const utterance =
    new SpeechSynthesisUtterance(
      text
    );


  if(selectedVoice) {

    utterance.voice =
      selectedVoice;

  }


  utterance.lang =
    selectedVoice
      ? selectedVoice.lang
      : languageSelect.value;


  utterance.rate = 1;
  utterance.pitch = 1;
  utterance.volume = 1;


  utterance.onstart =
    function() {

      setSpeechFaceTalking(
        true
      );

      updateSpeechStatus(
        "Smiley is speaking..."
      );

    };


  utterance.onend =
    function() {

      setSpeechFaceTalking(
        false
      );

      updateSpeechStatus(
        "Finished speaking."
      );

    };


  utterance.onerror =
    function() {

      setSpeechFaceTalking(
        false
      );

      updateSpeechStatus(
        "Speech could not be completed."
      );

    };

utterance.onboundary =
  function(event) {

    pulseSpeechMouth();

  };

  speechSynth.speak(
    utterance
  );

}


/* ================================================
   STOP SPEECH
================================================ */

function stopSpeaking() {

  speechSynth.cancel();

  setSpeechFaceTalking(
    false
  );


  if(speechWindow) {

    updateSpeechStatus(
      "Speech stopped."
    );

  }

}


/* ================================================
   TALKING FACE
================================================ */

function setSpeechFaceTalking(
  talking
) {

  if(!speechWindow) {
    return;
  }


  const face =
    speechWindow.querySelector(
      ".speechFace"
    );


  face.classList.toggle(
    "talking",
    talking
  );

}


function pulseSpeechMouth() {

  if(!speechWindow) {
    return;
  }

  const mouth =
    speechWindow.querySelector(
      ".speechMouth"
    );

  if(!mouth) {
    return;
  }

  /*
    Removing/re-adding the class restarts
    the animation for each speech boundary.
  */

  mouth.classList.remove(
    "syllable"
  );

  void mouth.offsetWidth;

  mouth.classList.add(
    "syllable"
  );
}

   STATUS MESSAGE
================================================ */

function updateSpeechStatus(
  message
) {

  if(!speechWindow) {
    return;
  }


  const status =
    speechWindow.querySelector(
      ".speechStatus"
    );


  status.textContent =
    message;

}


/* ================================================
   SPEECH WINDOW DRAGGING
================================================ */

function setupSpeechWindowDragging(
  header
) {

  header.addEventListener(
    "pointerdown",
    function(event) {

      if(
        event.target.closest(
          ".speechClose"
        )
      ) {
        return;
      }


      if(
        event.pointerType === "mouse" &&
        event.button !== 0
      ) {
        return;
      }


      event.preventDefault();


      const rect =
        speechWindow
          .getBoundingClientRect();


      speechWindow.style.transform =
        "none";

      speechWindow.style.left =
        rect.left + "px";

      speechWindow.style.top =
        rect.top + "px";


      speechDragging =
        true;

      speechPointerId =
        event.pointerId;

      speechStartX =
        event.clientX;

      speechStartY =
        event.clientY;

      speechStartLeft =
        rect.left;

      speechStartTop =
        rect.top;


      header.setPointerCapture(
        event.pointerId
      );

    }
  );


  header.addEventListener(
    "pointermove",
    function(event) {

      if(
        !speechDragging ||
        event.pointerId !==
          speechPointerId
      ) {
        return;
      }


      let nextLeft =
        speechStartLeft +
        (
          event.clientX -
          speechStartX
        );

      let nextTop =
        speechStartTop +
        (
          event.clientY -
          speechStartY
        );


      const width =
        speechWindow.offsetWidth;

      const height =
        speechWindow.offsetHeight;


      const maximumLeft =
        Math.max(
          10,
          window.innerWidth -
          width -
          10
        );

      const maximumTop =
        Math.max(
          10,
          window.innerHeight -
          height -
          10
        );


      nextLeft =
        Math.max(
          10,
          Math.min(
            maximumLeft,
            nextLeft
          )
        );


      nextTop =
        Math.max(
          10,
          Math.min(
            maximumTop,
            nextTop
          )
        );


      speechWindow.style.left =
        nextLeft + "px";

      speechWindow.style.top =
        nextTop + "px";

    }
  );


  function stopSpeechDrag(
    event
  ) {

    if(
      !speechDragging ||
      event.pointerId !==
        speechPointerId
    ) {
      return;
    }


    speechDragging =
      false;

    speechPointerId =
      null;


    try {

      if(
        header.hasPointerCapture(
          event.pointerId
        )
      ) {

        header.releasePointerCapture(
          event.pointerId
        );

      }

    }
    catch(error) {
      /* Nothing needed */
    }

  }


  header.addEventListener(
    "pointerup",
    stopSpeechDrag
  );

  header.addEventListener(
    "pointercancel",
    stopSpeechDrag
  );

}


/* ================================================
   SPEECH BUTTON
================================================ */

speechButton.addEventListener(
  "click",
  openSpeechWindow
);


/* ================================================
   VOICE LIST CHANGES
================================================ */

if(
  "speechSynthesis" in window
) {

  speechSynth.addEventListener(
    "voiceschanged",
    loadSpeechVoices
  );

}

positionAllIcons();

</script>
