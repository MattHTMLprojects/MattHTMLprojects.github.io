<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Parts Book, Cars & Trucks 2018-Present</title>

<style>
  :root {
    --ink: #20201d;
    --muted-ink: #5d5b53;
    --paper: #f2eddf;
    --paper-dark: #d9d0bc;
    --cover: #202428;
    --cover-edge: #101214;
    --steel-light: #d8dde0;
    --steel-mid: #717980;
    --steel-dark: #32383d;
    --warning: #f0c62d;
    --warning-dark: #24231d;
    --green: #526f4c;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    min-height: 100%;
    margin: 0;
    font-family: Arial, "Times New Roman", serif;
    color: var(--ink);
    background:
      radial-gradient(
        circle at 20% 15%,
        rgba(255, 255, 255, .06),
        transparent 22%
      ),
      repeating-linear-gradient(
        90deg,
        rgba(255, 255, 255, .018) 0 1px,
        transparent 1px 4px
      ),
      linear-gradient(
        135deg,
        #363b3e,
        #171a1c 70%
      );
  }

  button,
  select,
  input {
    font: inherit;
  }

  button:focus-visible,
  select:focus-visible,
  input:focus-visible {
    outline: 3px solid #e0af19;
    outline-offset: 3px;
  }

  .app {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    overflow-x: hidden;
  }

  .book-stage {
    width: min(1180px, 96vw);
    min-height: 710px;
    position: relative;
    perspective: 2200px;
  }

  .book-shadow {
    position: absolute;
    inset: auto 4% -28px;
    height: 70px;
    background:
      radial-gradient(
        ellipse,
        rgba(0, 0, 0, .68),
        transparent 68%
      );
    filter: blur(10px);
    pointer-events: none;
  }

  /* ==========================================================
     CLOSED BOOK COVER
     ========================================================== */

  .cover {
    width: min(670px, 92vw);
    min-height: 680px;
    margin: 0 auto;
    position: relative;

    border-radius: 7px 18px 18px 7px;

    cursor: pointer;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    padding: 56px 44px;

    color: #f0f2f2;
    text-align: center;

    transform-origin: left center;

    background:
      linear-gradient(
        100deg,
        rgba(255, 255, 255, .06),
        transparent 13%
      ),
      repeating-linear-gradient(
        0deg,
        rgba(255, 255, 255, .018) 0 1px,
        transparent 1px 5px
      ),
      linear-gradient(
        135deg,
        #343a3f,
        var(--cover) 58%,
        #15181a
      );

    border: 2px solid #080a0b;

    box-shadow:
      0 3px 0 #697076 inset,
      -11px 0 0 #121416,
      -15px 0 0 #3d4245,
      0 26px 46px rgba(0, 0, 0, .65);

    transition:
      transform .35s ease,
      box-shadow .35s ease;

    overflow: hidden;
  }

  .cover::before {
    content: "";
    position: absolute;
    inset: 13px;

    border: 1px solid rgba(220, 225, 226, .19);
    border-radius: 4px 13px 13px 4px;

    pointer-events: none;
  }

  .cover::after {
    content: "";
    position: absolute;
    inset: 0;

    background:
      linear-gradient(
        115deg,
        transparent 32%,
        rgba(255, 255, 255, .05) 41%,
        transparent 50%
      ),
      repeating-linear-gradient(
        167deg,
        transparent 0 17px,
        rgba(255, 255, 255, .025) 18px,
        transparent 19px 44px
      );

    mix-blend-mode: screen;
    pointer-events: none;
  }

  .cover:hover {
    transform:
      translateY(-8px)
      rotateX(1.5deg);
  }

  /* Binding rivets */

  .rivet {
    position: absolute;
    left: 18px;

    width: 14px;
    height: 14px;

    border-radius: 50%;

    background:
      radial-gradient(
        circle at 35% 30%,
        #e2e5e5,
        #6e767b 45%,
        #252a2d 76%
      );

    box-shadow:
      0 1px 3px #000;
  }

  .rivet.one {
    top: 15%;
  }

  .rivet.two {
    top: calc(50% - 7px);
  }

  .rivet.three {
    bottom: 15%;
  }

  .cover-kicker {
    font:
      700
      14px / 1.3
      Arial,
      sans-serif;

    letter-spacing: .34em;
    color: #bcc2c5;

    margin-bottom: 22px;
  }

  .cover h1 {
    margin: 22px 0 5px;

    font:
      800
      clamp(34px, 6vw, 58px) / .98
      Arial,
      sans-serif;

    letter-spacing: .06em;

    text-shadow:
      0 2px 2px #000;
  }

  .cover .edition {
    margin: 13px 0 0;

    font:
      800
      25px / 1.25
      Arial,
      sans-serif;

    letter-spacing: .2em;
    color: #e5e7e7;
  }

  .cover .years {
    margin-top: 7px;

    font:
      700
      16px / 1.2
      Arial,
      sans-serif;

    letter-spacing: .25em;
    color: #b5bbc0;
  }

  .cover .strapline {
    margin-top: 38px;
    padding-top: 18px;

    width: 78%;

    border-top:
      1px solid
      rgba(255, 255, 255, .25);

    font:
      700
      12px / 1.6
      Arial,
      sans-serif;

    letter-spacing: .18em;
    color: #aeb4b7;
  }

  .open-prompt {
    position: absolute;

    bottom: 18px;
    left: 50%;

    transform:
      translateX(-50%);

    font:
      700
      12px
      Arial,
      sans-serif;

    letter-spacing: .18em;

    color: #d4d7d8;

    opacity: .75;
  }

   ========================================================== */
/* ==========================================================

   ========================================================== */

  height: 245px;
  position: relative;

}

    radial-gradient(circle at 30.9% 3.8%, transparent 0 7.2px, #000 8.2px);
  -webkit-mask-composite: destination-in;

  mask-image:
    radial-gradient(circle, transparent 0 18px, #000 19px),
    radial-gradient(circle at 50% 23.2%, transparent 0 9.5px, #000 10.5px),
    radial-gradient(circle at 73.2% 36.6%, transparent 0 9.5px, #000 10.5px),
    radial-gradient(circle at 73.2% 63.4%, transparent 0 9.5px, #000 10.5px),
    radial-gradient(circle at 50% 76.8%, transparent 0 9.5px, #000 10.5px),
    radial-gradient(circle at 26.8% 63.4%, transparent 0 9.5px, #000 10.5px),
    radial-gradient(circle at 26.8% 36.6%, transparent 0 9.5px, #000 10.5px),
    radial-gradient(circle at 50.0% 0.0%, transparent 0 7.2px, #000 8.2px),
    radial-gradient(circle at 69.1% 3.8%, transparent 0 7.2px, #000 8.2px),
    radial-gradient(circle at 85.4% 14.6%, transparent 0 7.2px, #000 8.2px),
    radial-gradient(circle at 96.2% 30.9%, transparent 0 7.2px, #000 8.2px),
    radial-gradient(circle at 100.0% 50.0%, transparent 0 7.2px, #000 8.2px),
    radial-gradient(circle at 96.2% 69.1%, transparent 0 7.2px, #000 8.2px),

/* ==========================================================
   CROSSED ADJUSTABLE WRENCHES (FOREGROUND X)
   ========================================================== */
.adj-wrench {
  position: absolute;
  width: 68px;
  height: 238px;
  left: 50%;
  top: 50%;
  filter: drop-shadow(0 6px 5px rgba(0, 0, 0, 0.85));
}

.wrench-left {
  transform: translate(-50%, -50%) rotate(-38deg);
  z-index: 2;
}

/* Mirrored horizontally so both adjustable heads point symmetrically */
.wrench-right {
  transform: translate(-50%, -50%) rotate(38deg) scaleX(-1);
  z-index: 3;
}

/* True Angled Crescent Wrench Head Silhouette */
.wrench-head {
  position: absolute;
  top: 2px;
  left: 50%;
  transform: translateX(-50%);
  width: 64px;
  height: 66px;
  background: linear-gradient(135deg, #e5e8ea 0%, #9ba1a4 45%, #484d50 100%);

  /* Sculpted fixed jaw (left), angled hex throat, and stepped movable jaw (right) */
  clip-path: polygon(
    28% 2%,    /* Fixed jaw tip */
    40% 2%,    /* Inner fixed jaw tip */
    44% 38%,   /* Inner throat corner */
    62% 38%,   /* Movable jaw inner base */
    58% 12%,   /* Movable jaw inner tip */
    72% 12%,   /* Movable jaw outer tip */
    92% 36%,   /* Movable jaw shoulder */
    92% 56%,   /* Thumbwheel housing outer edge */
    76% 68%,   /* Thumbwheel housing lower curve */
    64% 98%,   /* Neck right */
    34% 98%,   /* Neck left */
    12% 72%,   /* Outer curved cheek lower */
    6% 45%,    /* Outer curved cheek mid */
    14% 18%    /* Outer curved cheek upper */
  );
}

/* Subtle machined edge bevel inside the wrench head */
.wrench-head::after {
  content: "";
  position: absolute;
  inset: 2px;
  background: linear-gradient(160deg, rgba(255,255,255,0.35) 0%, transparent 45%, rgba(0,0,0,0.45) 100%);
  clip-path: inherit;
}

/* Knurled Thumb-Wheel Adjuster Screw inside the Jaw Housing */
.wrench-thumbwheel {
  position: absolute;
  top: 33px;
  left: 33px;
  width: 15px;
  height: 11px;
  border-radius: 2px;
  z-index: 2;
  background: repeating-linear-gradient(
    90deg,
    #232729 0px,
    #232729 1.5px,
    #c6cacc 1.5px,
    #c6cacc 3px
  );
  box-shadow:
    0 0 0 1.5px #1c2022,
    inset 0 2px 2px rgba(255, 255, 255, 0.4),
    inset 0 -2px 2px rgba(0, 0, 0, 0.65);
}

/* Forged Tapered Handle with Hanging Eye Hole */
.wrench-handle {
  position: absolute;
  top: 63px;
  left: 50%;
  transform: translateX(-50%);
  width: 22px;
  height: 170px;
  border-radius: 3px 3px 11px 11px;
  background: linear-gradient(90deg, #4b5053 0%, #d4d8da 35%, #8b9194 70%, #3a3f42 100%);
  box-shadow:
    inset 0 0 0 1.5px #222628,
    inset 4px 0 3px rgba(0, 0, 0, 0.35),
    inset -4px 0 3px rgba(0, 0, 0, 0.35);

  -webkit-mask-image: radial-gradient(circle at 50% calc(100% - 14px), transparent 0 5px, #000 6px);
  mask-image: radial-gradient(circle at 50% calc(100% - 14px), transparent 0 5px, #000 6px);
}

/* Recessed Forged Grip Panel on Handle */
.wrench-handle::after {
  content: "";
  position: absolute;
  top: 12px;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  width: 9px;
  border-radius: 4.5px;
  background: linear-gradient(90deg, #52585b, #7d8386);
  box-shadow:
    inset 0 1px 3px rgba(0, 0, 0, 0.7),
    0 1px 1px rgba(255, 255, 255, 0.35);
}

  /* ==========================================================
     OPEN BOOK
     ========================================================== */

  .open-book {
    display: none;

    width: 100%;
    min-height: 710px;

    position: relative;

    grid-template-columns:
      1fr 1fr;

    border-radius: 13px;

    box-shadow:
      0 28px 50px
      rgba(0, 0, 0, .62);

    animation:
      bookArrive .7s ease both;
  }

  .open-book.visible {
    display: grid;
  }

  @keyframes bookArrive {
    from {
      opacity: 0;

      transform:
        scale(.84)
        rotateX(7deg);
    }

    to {
      opacity: 1;

      transform:
        scale(1)
        rotateX(0);
    }
  }

  .page {
    min-width: 0;
    min-height: 710px;

    position: relative;

    padding:
      39px 42px 45px;

    overflow: hidden;

    background:
      radial-gradient(
        circle at 20% 15%,
        rgba(255, 255, 255, .82),
        transparent 30%
      ),
      repeating-linear-gradient(
        0deg,
        rgba(60, 48, 25, .018) 0 1px,
        transparent 1px 4px
      ),
      var(--paper);

    border:
      1px solid #b5aa94;
  }

  .page.left {
    border-radius:
      12px 0 0 12px;

    box-shadow:
      inset -20px 0 32px -27px
      #332f28;
  }

  .page.right {
    border-radius:
      0 12px 12px 0;

    box-shadow:
      inset 20px 0 32px -27px
      #332f28;
  }

  .page.left::after,
  .page.right::before {
    content: "";

    position: absolute;

    top: 0;
    bottom: 0;

    width: 18px;

    pointer-events: none;
  }

  .page.left::after {
    right: 0;

    background:
      linear-gradient(
        to left,
        rgba(56, 49, 38, .2),
        transparent
      );
  }

  .page.right::before {
    left: 0;

    background:
      linear-gradient(
        to right,
        rgba(56, 49, 38, .2),
        transparent
      );
  }

  .binding {
    position: absolute;

    z-index: 8;

    width: 10px;

    top: 5px;
    bottom: 5px;

    left: 50%;

    transform:
      translateX(-50%);

    background:
      linear-gradient(
        90deg,
        #756b59,
        #2c2923 45%,
        #b5a98d 60%,
        #665d4e
      );

    box-shadow:
      0 0 13px
      rgba(0, 0, 0, .55);

    pointer-events: none;
  }

  .page-turn {
    animation:
      pageTurn .48s ease both;
  }

  @keyframes pageTurn {
    0% {
      opacity: .25;

      transform:
        rotateY(-8deg)
        scale(.985);

      filter:
        brightness(.7);
    }

    100% {
      opacity: 1;

      transform:
        rotateY(0)
        scale(1);

      filter:
        brightness(1);
    }
  }

  .section-label {

      800

      var(--muted-ink);

  .page h2 {

  .category-grid {

  .blueprint-wrap {
    height: 100%;

    display: flex;
    flex-direction: column;

/* ======================================================================
   THE PARTS BOOK - VEHICLE DATA

   FORMAT:
   addData(YEAR, "MAKE", "MODEL", "ENGINE", {
     oil: { filters: ["FILTER"], quarts: 0, weight: "OIL WEIGHT", standard: "OIL SPEC" },
     lights: { result: "" },
     battery: { result: "" },
     wipers: { result: "" }
   });

   Add only the categories with known information.

====================================================================== */

const PARTS_BOOK = [];

function addDataForYears(years, make, model, engine, data = {}) {
  years.forEach(year => addData(year, make, model, engine, data));
}

function addData(year, make, model, engine, data = {}) {
  PARTS_BOOK.push({
    year: Number(year),
    make: String(make).trim(),
    model: String(model).trim(),
    engine: String(engine).trim(),
    ...data
  });
}

/* ======================================================================
   VEHICLE DATA CATEGORIES

   Add only known/verified categories to each addData() vehicle record.

   oil:      filters, quarts, weight, standard
   lights:   lowBeam, highBeam, fog
   battery:  size
   filters:  engineAir, cabinAir
   brakes:   frontPads, rearPads, frontRotors, rearRotors
   fluids:   coolant, brakeFluid, transmissionFluid
   wipers:   driver, passenger, rear
   ignition: sparkPlug

   Unknown categories can be omitted until information is available.
   ====================================================================== */


/* ======================================================================
   BOOK CATEGORY INFORMATION
   ====================================================================== */

const CATEGORY_INFO = {
  oil: {
    title: "Oil & Lubrication",
    icon: "◉",
    caption: "Oil, filters and engine lubrication",
    reminderTitle: "GOOD TO KNOW",
    reminder: "Used motor oil and oil filters should be taken to an appropriate collection or recycling facility. A small extra step helps keep automotive waste out of drains, soil and ordinary trash."
  },
  lights: { title: "Lights", icon: "☀", caption: "Headlights, signals and exterior bulbs" },
  battery: { title: "Battery", icon: "▣", caption: "Battery fitment and replacement notes" },
  filters: { title: "Filters", icon: "▤", caption: "Engine and cabin air filters" },
  brakes: { title: "Brakes", icon: "◌", caption: "Pads, rotors and brake notes" },
  fluids: { title: "Fluids", icon: "◆", caption: "Coolant, brake and transmission fluids" },
  wipers: { title: "Wipers", icon: "⌁", caption: "Driver, passenger and rear sizes" },
  ignition: { title: "Ignition", icon: "ϟ", caption: "Spark plugs and ignition maintenance" }
};


/* ======================================================================
   CURRENT BOOK STATE
   ====================================================================== */

const state = {
  selectedVehicle: null,
  currentView: "toc",
  previousView: "toc"
};


/* ======================================================================
   MAIN PAGE ELEMENTS
   ====================================================================== */

const cover = document.getElementById("cover");
const openBook = document.getElementById("openBook");
const leftPage = document.getElementById("leftPage");
const rightPage = document.getElementById("rightPage");
const homeButton = document.getElementById("homeButton");
const closeButton = document.getElementById("closeButton");

/* ======================================================================
   BOOK CONTROLS
   ====================================================================== */

cover.addEventListener("click", () => {
  cover.style.display = "none";
  openBook.classList.add("visible");
  renderTableOfContents();
});

closeButton.addEventListener("click", () => {
  openBook.classList.remove("visible");
  cover.style.display = "flex";
  state.currentView = "toc";
});

homeButton.addEventListener("click", renderTableOfContents);


/* ======================================================================
   PAGE TURN ANIMATION
   ====================================================================== */

function animatePages() {
  leftPage.classList.remove("page-turn");
  rightPage.classList.remove("page-turn");

  // Forces the browser to recognize the removed animation class.
  void leftPage.offsetWidth;

  leftPage.classList.add("page-turn");
  rightPage.classList.add("page-turn");
}


/* ======================================================================
   PAGE CONTENT
   ====================================================================== */

function setPages(leftHTML, rightHTML) {
  leftPage.innerHTML = leftHTML;
  rightPage.innerHTML = rightHTML;
  animatePages();
}


/* ======================================================================
   PAGE FOOTER
   ====================================================================== */

function footer(page, section) {
  return `
    <div class="page-footer">
      <span>PAGE ${page} • ${escapeHTML(section).toUpperCase()}</span>
      <span>REFERENCE EDITION</span>
    </div>
  `;
}

/* ======================================================================
   TABLE OF CONTENTS
   ====================================================================== */

function renderTableOfContents() {
  state.currentView = "toc";

  const categoryButtons = Object.entries(CATEGORY_INFO).map(([key, item]) => `
    <button class="category-card" type="button" data-category="${key}">
      <span class="icon" aria-hidden="true">${item.icon}</span>
      <span>
        <strong>${escapeHTML(item.title)}</strong>
        <small>${escapeHTML(item.caption)}</small>
      </span>
    </button>
  `).join("");

  const leftHTML = `
    <div class="toc-heading">
      <div class="section-label">Main Index</div>
      <h2>What are we getting into today?</h2>
      <div class="rule"></div>
      <p class="toc-subtitle">
        (Tip: Vehicle must be selected first) Choose a section and the book will turn to the appropriate shop notes.
      </p>
    </div>

    <div class="category-grid">${categoryButtons}</div>
    ${footer("1", "Table of Contents")}
  `;

  const rightHTML = `
    <div class="vehicle-panel">
      <div class="section-label">Vehicle Application</div>
      <h2>Vehicle Selection Page</h2>
      <div class="rule"></div>

      <p class="lead">
        Select a vehicle before opening a parts section.
      </p>

      <div class="field">
        <label for="yearSelect">MODEL YEAR</label>
        <select id="yearSelect"></select>
      </div>

      <div class="field">
        <label for="modelSelect">MODEL</label>
        <select id="modelSelect"></select>
      </div>

  <div class="field">
        <label for="engineSelect">ENGINE</label>
        <select id="engineSelect"></select>
      </div>

      <button class="primary-btn" id="setVehicleButton" type="button">
        SET THIS VEHICLE
      </button>

      <p style="max-width: 480px; margin: 16px auto 8px; font-size: 0.85rem; line-height: 1.4; color: #555; text-align: left;">
        <strong>Disclaimer:</strong> The information in <em>The Parts Book</em> is compiled for general reference purposes only. Because vehicle specifications, mid-year production changes, and manufacturer part numbers frequently update, you should independently verify fitment and compatibility using your Vehicle Identification Number (VIN) before purchasing any parts.
      </p>

      <p id="vehicleMessage" role="status"
         style="min-height:22px;font-weight:700;color:#4d5846"></p>

      ${footer("2", "Vehicle Selection")}
    </div>
  `;


  setPages(leftHTML, rightHTML);
  bindTableOfContents();
}


/* ======================================================================
   TABLE OF CONTENTS CONTROLS
   ====================================================================== */

function bindTableOfContents() {
  const yearSelect = document.getElementById("yearSelect");
  const modelSelect = document.getElementById("modelSelect");
  const engineSelect = document.getElementById("engineSelect");
  const message = document.getElementById("vehicleMessage");


  const years = unique(PARTS_BOOK.map(vehicle => vehicle.year))
    .sort((a, b) => b - a);

  fillSelect(yearSelect, years, "_ Select year _");
  refreshModels();

  yearSelect.addEventListener("change", refreshModels);
  modelSelect.addEventListener("change", refreshEngines);

  function refreshModels() {
    const models = unique(
      PARTS_BOOK
        .filter(vehicle => String(vehicle.year) === yearSelect.value)
        .map(vehicle => vehicle.model)
    ).sort();

    fillSelect(modelSelect, models, "_ Select model _");
    refreshEngines();
  }

  function refreshEngines() {
    const engines = unique(
      PARTS_BOOK
        .filter(vehicle =>
          String(vehicle.year) === yearSelect.value &&
          vehicle.model === modelSelect.value
        )
        .map(vehicle => vehicle.engine)
    ).sort();

    fillSelect(engineSelect, engines, "_ Select engine _");
  }

  if (state.selectedVehicle) {
    yearSelect.value = String(state.selectedVehicle.year);
    refreshModels();

    modelSelect.value = state.selectedVehicle.model;
    refreshEngines();

    engineSelect.value = state.selectedVehicle.engine;
    message.textContent = `Current vehicle: ${vehicleName(state.selectedVehicle)}`;
  }

  document.querySelectorAll("[data-category]").forEach(button => {
    button.addEventListener("click", () => {
      openCategory(button.dataset.category);
    });
  });

  document.getElementById("setVehicleButton").addEventListener("click", () => {
    const vehicle = PARTS_BOOK.find(vehicle =>
      String(vehicle.year) === yearSelect.value &&
      vehicle.model === modelSelect.value &&
      vehicle.engine === engineSelect.value
    );

    if (!vehicle) {
      message.textContent = "Choose a year, model and engine first.";
      return;
    }

    state.selectedVehicle = vehicle;
    message.textContent = `Vehicle set: ${vehicleName(vehicle)}`;
  });
}

/* ============================================================
   OPEN A CATEGORY
   ============================================================ */

function openCategory(category) {
  if (!state.selectedVehicle) {
    renderChooseVehicle(category);
    return;
  }

  const categoryRenderers = {
    oil: renderOilPage,
    lights: renderLightsPage,
    battery: renderBatteryPage,
    filters: renderFiltersPage,
    brakes: renderBrakesPage,
    fluids: renderFluidsPage,
    wipers: renderWipersPage,
    ignition: renderIgnitionPage
  };

  const vehicleData = state.selectedVehicle[category];
  const renderPage = categoryRenderers[category];
  const hasRealData = vehicleData && !vehicleData.result;

  if (renderPage && hasRealData) {
    renderPage(state.selectedVehicle);
  } else {
    renderMissingCategory(category, state.selectedVehicle);
  }
}



/* ============================================================
   USER CLICKED A CATEGORY WITHOUT SELECTING A VEHICLE
   ============================================================ */

/* ============================================================
   VEHICLE / SELECT HELPERS
   ============================================================ */

function fillSelect(select, values, placeholder) {
  select.innerHTML =
    `<option value="">${escapeHTML(placeholder)}</option>` +
    values.map(value =>
      `<option value="${escapeAttribute(value)}">${escapeHTML(String(value))}</option>`
    ).join("");
}

function unique(values) {
  return [...new Set(values)];
}

function vehicleName(vehicle) {
  return `${vehicle.year} ${vehicle.make} ${vehicle.model} ${vehicle.engine}`;
}

/* ============================================================
   FILTER / HTML HELPERS
   ============================================================ */

function normalizeFilter(value) {
  return String(value || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>'"]/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    "'": "&#39;",
    "\"": "&quot;"
  })[char]);
}

function escapeAttribute(value) {
  return escapeHTML(value);
}
