<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Retro Twitch Projection TV</title>

  <style>
    :root {
      --twitch-purple: #9147ff;
      --display-green: #6dffae;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      color: #eee;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        radial-gradient(
          circle at 50% 20%,
          #756650 0%,
          #554837 27%,
          #30281f 57%,
          #17130f 100%
        );
    }


    /* =========================================================
       ROOM
       ========================================================= */

    .room {
      position: relative;

      min-height: 100vh;

      display: flex;

      justify-content: center;
      align-items: center;

      padding:
        55px
        25px
        80px;

      overflow-x: auto;
    }


    .wall-texture {
      position: absolute;

      inset: 0;

      pointer-events: none;

      background:
        repeating-linear-gradient(
          90deg,
          rgba(255,255,255,.012) 0,
          rgba(255,255,255,.012) 2px,
          transparent 2px,
          transparent 115px
        );
    }


    /* =========================================================
       TV
       ========================================================= */

    .tv {
      position: relative;

      z-index: 5;

      width:
        min(1520px, 96vw);

      padding:
        25px
        34px
        29px;

      border:
        4px solid #050505;

      border-radius:
        19px 19px 8px 8px;

      background:
        linear-gradient(
          145deg,
          #454545 0%,
          #181818 17%,
          #303030 52%,
          #141414 82%,
          #080808 100%
        );

      box-shadow:
        0 42px 55px rgba(0,0,0,.72),
        inset 3px 3px 4px rgba(255,255,255,.12),
        inset -5px -5px 15px rgba(0,0,0,.85);
    }


    /*
      Deep bottom edge gives the cabinet
      some old rear-projection TV bulk.
    */

    .tv::after {
      content: "";

      position: absolute;

      z-index: -1;

      left: 55px;
      right: 55px;

      bottom: -32px;

      height: 35px;

      border-radius:
        0 0 9px 9px;

      background:
        linear-gradient(
          #171717,
          #050505
        );

      box-shadow:
        0 14px 19px rgba(0,0,0,.55);
    }


    /* =========================================================
       TV HEADER
       ========================================================= */

    .tv-header {
      height: 55px;

      display: flex;

      justify-content:
        space-between;

      align-items:
        center;

      padding:
        0 18px;

      border:
        1px solid #030303;

      border-radius:
        7px;

      background:
        linear-gradient(
          #303030,
          #0f0f0f
        );

      box-shadow:
        inset 0 1px rgba(255,255,255,.10);
    }


    .brand {
      color:
        var(--twitch-purple);

      font-size:
        clamp(24px, 3vw, 34px);

      font-weight:
        900;

      letter-spacing:
        5px;

      text-shadow:
        0 0 9px rgba(145,71,255,.55);
    }


    .model {
      color:
        #9c9c9c;

      font-size:
        10px;

      letter-spacing:
        2px;
    }


    /* =========================================================
       SCREEN CABINET
       ========================================================= */

    .screen-bezel {
      margin-top:
        20px;

      padding:
        28px 30px 16px;

      border:
        4px solid #030303;

      border-radius:
        24px 24px 16px 16px;

      background:
        linear-gradient(
          145deg,
          #030303,
          #262626 48%,
          #070707
        );

      box-shadow:
        inset 0 0 22px #000,
        inset 3px 3px 5px rgba(255,255,255,.07),
        0 7px 16px rgba(0,0,0,.80);
    }


    /*
      1280 × 720 TARGET.

      The player can shrink responsively,
      but always remains 16:9.
    */

    .screen {
      position: relative;

      width:
        1280px;

      max-width:
        100%;

      aspect-ratio:
        16 / 9;

      margin:
        0 auto;

      overflow:
        hidden;

      border:
        4px solid #020202;

      border-radius:
        9px;

      background:
        #000;

      box-shadow:
        0 0 30px rgba(100,60,150,.18),
        inset 0 0 22px #000;
    }


    /*
      Twitch inserts its own iframe
      inside this element.
    */

    #twitch-embed {
      width:
        100%;

      height:
        100%;

      background:
        #000;
    }


    /*
      Force Twitch-generated iframe to
      exactly fill our 16:9 projection screen.
    */

    #twitch-embed iframe {
      display:
        block;

      width:
        100% !important;

      height:
        100% !important;

      border:
        0;
    }


    /* =========================================================
       STANDBY
       ========================================================= */

    .standby {
      position:
        absolute;

      inset:
        0;

      z-index:
        10;

      display:
        none;

      justify-content:
        center;

      align-items:
        center;

      color:
        #535353;

      font-family:
        "Courier New",
        monospace;

      font-size:
        clamp(16px, 2vw, 27px);

      letter-spacing:
        7px;

      background:
        radial-gradient(
          ellipse at center,
          #1c1c1c,
          #030303 72%,
          #000
        );

      user-select:
        none;
    }


    .standby.visible {
      display:
        flex;
    }


    .screen-label {
      margin-top:
        11px;

      text-align:
        center;

      color:
        #747474;

      font-size:
        9px;

      letter-spacing:
        4px;
    }


    /* =========================================================
       LOWER TV
       ========================================================= */

    .lower-tv {
      display:
        grid;

      grid-template-columns:
        1fr
        minmax(290px, 355px)
        1fr;

      gap:
        20px;

      margin-top:
        21px;
    }


    /* =========================================================
       SPEAKERS
       ========================================================= */

    .speaker {
      position:
        relative;

      min-height:
        245px;

      border:
        4px solid #070707;

      border-radius:
        7px;

      overflow:
        hidden;

      background-color:
        #111;

      background-image:
        radial-gradient(
          #050505 1.5px,
          transparent 1.5px
        );

      background-size:
        6px 6px;

      box-shadow:
        inset 0 0 26px #000,
        0 4px 7px rgba(0,0,0,.75);
    }


    .speaker::before {
      content: "";

      position:
        absolute;

      width:
        175px;

      height:
        175px;

      left:
        50%;

      top:
        50%;

      transform:
        translate(-50%, -50%);

      border:
        3px solid rgba(100,100,100,.20);

      border-radius:
        50%;

      box-shadow:
        inset 0 0 35px rgba(0,0,0,.90),
        0 0 12px rgba(150,150,150,.08);
    }


    .speaker::after {
      content: "";

      position:
        absolute;

      width:
        54px;

      height:
        54px;

      left:
        50%;

      top:
        50%;

      transform:
        translate(-50%, -50%);

      border-radius:
        50%;

      background:
        rgba(0,0,0,.82);

      box-shadow:
        0 0 7px rgba(90,90,90,.4);
    }


    /* =========================================================
       DIGITAL CONTROL
       ========================================================= */

    .controls {
      min-height:
        245px;

      padding:
        17px;

      border:
        3px solid #050505;

      border-radius:
        7px;

      background:
        linear-gradient(
          #202020,
          #080808
        );

      box-shadow:
        inset 0 1px rgba(255,255,255,.06);
    }


    .controls-title {
      margin-bottom:
        12px;

      text-align:
        center;

      color:
        #909090;

      font-size:
        9px;

      letter-spacing:
        3px;
    }


    /* Current channel display */

    .channel-display {
      height:
        42px;

      display:
        flex;

      justify-content:
        center;

      align-items:
        center;

      margin-bottom:
        10px;

      overflow:
        hidden;

      border:
        3px inset #111;

      color:
        var(--display-green);

      background:
        #07110d;

      font-family:
        "Courier New",
        monospace;

      font-size:
        11px;

      white-space:
        nowrap;

      text-shadow:
        0 0 8px rgba(80,255,150,.78);
    }


    /*
      Channel tuner field.
    */

    .channel-search {
      width:
        100%;

      height:
        40px;

      margin-bottom:
        15px;

      padding:
        0 10px;

      outline:
        none;

      border:
        2px inset #111;

      border-radius:
        2px;

      color:
        var(--display-green);

      background:
        #07110d;

      font-family:
        "Courier New",
        monospace;

      font-size:
        11px;

      text-align:
        center;

      box-shadow:
        inset 0 0 7px rgba(0,0,0,.9);

      text-shadow:
        0 0 6px rgba(80,255,150,.5);
    }


    .channel-search::placeholder {
      color:
        #40745a;

      opacity:
        1;
    }


    .channel-search:focus {
      border-color:
        #34634b;

      box-shadow:
        inset 0 0 7px rgba(0,0,0,.9),
        0 0 7px rgba(80,255,150,.25);
    }


    /* =========================================================
       BUTTONS
       ========================================================= */

    .button-row {
      display:
        flex;

      justify-content:
        center;

      gap:
        13px;
    }


    button {
      min-width:
        110px;

      height:
        44px;

      cursor:
        pointer;

      border:
        1px solid #030303;

      border-top:
        1px solid #6a6a6a;

      border-radius:
        4px;

      color:
        #ddd;

      background:
        linear-gradient(
          #474747,
          #171717
        );

      box-shadow:
        0 4px 0 #030303,
        inset 0 1px rgba(255,255,255,.14);

      font-size:
        10px;

      font-weight:
        bold;

      letter-spacing:
        1px;
    }


    button:hover {
      background:
        linear-gradient(
          #5b5b5b,
          #262626
        );
    }


    button:active {
      transform:
        translateY(3px);

      box-shadow:
        0 1px 0 #030303;
    }


    .power-button {
      background:
        linear-gradient(
          #783838,
          #301010
        );
    }


    .power-button:hover {
      background:
        linear-gradient(
          #974545,
          #421313
        );
    }


    /* =========================================================
       LED
       ========================================================= */

    .status {
      display:
        flex;

      justify-content:
        center;

      align-items:
        center;

      gap:
        10px;

      margin-top:
        23px;
    }


    .led {
      width:
        11px;

      height:
        11px;

      border:
        1px solid #050505;

      border-radius:
        50%;

      background:
        #572222;
    }


    .led.on {
      background:
        #ff4141;

      box-shadow:
        0 0 10px rgba(255,55,55,.85);
    }


    .status-text {
      color:
        #777;

      font-size:
        8px;

      letter-spacing:
        2px;
    }


    /* =========================================================
       BOTTOM STRIP
       ========================================================= */

    .bottom-strip {
      display:
        flex;

      justify-content:
        space-between;

      align-items:
        center;

      margin-top:
        18px;

      padding:
        12px 7px 3px;

      border-top:
        1px solid #414141;

      color:
        #707070;

      font-size:
        9px;

      letter-spacing:
        2px;
    }


    .twitch-badge {
      padding:
        6px 14px;

      border-radius:
        3px;

      color:
        #fff;

      background:
        #6441a5;

      font-size:
        12px;

      font-weight:
        bold;
    }


    /* =========================================================
       RESPONSIVE
       ========================================================= */

    @media (max-width: 1050px) {

      .model {
        display:
          none;
      }


      .lower-tv {
        grid-template-columns:
          1fr
          260px
          1fr;
      }


      .speaker::before {
        width:
          135px;

        height:
          135px;
      }

    }


    @media (max-width: 720px) {

      .room {
        justify-content:
          flex-start;

        min-width:
          700px;
      }


      .tv {
        width:
          700px;
      }

    }

  </style>
</head>


<body>

  <main class="room">


    <div class="wall-texture"></div>


    <!-- =====================================================
         55-INCH-STYLE PROJECTION TELEVISION
         ===================================================== -->

    <section class="tv">


      <!-- HEADER -->

      <div class="tv-header">


        <div class="model">
          RP-720 WIDESCREEN DIGITAL PROJECTION RECEIVER
        </div>

      </div>


      <!-- ===================================================
           SCREEN
           =================================================== -->

      <div class="screen-bezel">


        <div class="screen">


          <!--
            Twitch's JavaScript SDK will place
            the player inside this element.
          -->

          <div id="twitch-embed"></div>


          <!-- TV OFF overlay -->

          <div
            id="standby-screen"
            class="standby">

            STANDBY

          </div>

        </div>


        <div class="screen-label">
          1280 × 720 WIDESCREEN DIGITAL PROJECTION DISPLAY
        </div>

      </div>


      <!-- ===================================================
           SPEAKERS + DIGITAL CONTROLS
           =================================================== -->

      <div class="lower-tv">


        <!-- LEFT SPEAKER -->

        <div class="speaker"></div>


        <!-- DIGITAL CONTROL -->

        <div class="controls">


          <div class="controls-title">
            DIGITAL CONTROL
          </div>


          <!--
            Shows currently tuned station.
          -->

          <div
            id="channel-display"
            class="channel-display">

            THEBURNTPEANUT_247

          </div>


          <!--
            Channel search/tuner.

            Examples:

            lofigirl

            OR

            https://www.twitch.tv/lofigirl
          -->

          <input
            id="channel-search"
            class="channel-search"
            type="text"
            placeholder="ENTER TWITCH CHANNEL"
            autocomplete="off"
            spellcheck="false"
          >


          <!-- BUTTONS -->

          <div class="button-row">


            <button
              id="power-button"
              class="power-button"
              type="button">

              POWER

            </button>


            <button
              id="tune-button"
              type="button">

              TUNE

            </button>


          </div>


          <!-- POWER LED -->

          <div class="status">


            <div
              id="power-led"
              class="led on">

            </div>


            <span class="status-text">
              POWER
            </span>


          </div>


        </div>


        <!-- RIGHT SPEAKER -->

        <div class="speaker"></div>


      </div>


      <!-- ===================================================
           FOOTER
           =================================================== -->

      <div class="bottom-strip">


        <span>
          55-INCH-STYLE PROJECTION SYSTEM
        </span>


        <span>
          DIGITAL STEREO
        </span>


      </div>


    </section>


  </main>


  <!-- =======================================================
       OFFICIAL TWITCH EMBED JAVASCRIPT
       ======================================================= -->

  <script src="https://embed.twitch.tv/embed/v1.js"></script>


  <script>

    /* =======================================================
       CONFIGURATION
       ======================================================= */

    const TWITCH_PARENT =
      "matthtmlprojects.github.io";


    let currentChannel =
      "theburntpeanut_247";


    let televisionOn =
      true;


    let twitchEmbed =
      null;


    /* =======================================================
       UI ELEMENTS
       ======================================================= */

    const channelSearch =
      document.getElementById(
        "channel-search"
      );


    const channelDisplay =
      document.getElementById(
        "channel-display"
      );


    const tuneButton =
      document.getElementById(
        "tune-button"
      );


    const powerButton =
      document.getElementById(
        "power-button"
      );


    const standbyScreen =
      document.getElementById(
        "standby-screen"
      );


    const powerLED =
      document.getElementById(
        "power-led"
      );


    /* =======================================================
       CLEAN CHANNEL NAME
       ======================================================= */

    function cleanChannelName(value) {


      let channel =
        value.trim();


      /*
        Allow somebody to paste:

        https://www.twitch.tv/lofigirl

        instead of only:

        lofigirl
      */

      channel =
        channel.replace(
          /^https?:\/\/(www\.)?twitch\.tv\//i,
          ""
        );


      /*
        Remove extra path/query/hash information.
      */

      channel =
        channel.split(/[/?#]/)[0];


      return channel.trim();

    }


    /* =======================================================
       CREATE TWITCH PLAYER
       ======================================================= */

    function createPlayer(channel) {


      /*
        Remove an old embed first.
      */

      const embedContainer =
        document.getElementById(
          "twitch-embed"
        );


      embedContainer.innerHTML =
        "";


      /*
        Create Twitch's official embed.
      */

      twitchEmbed =
        new Twitch.Embed(
          "twitch-embed",
          {

            width:
              "100%",

            height:
              "100%",

            channel:
              channel,

            layout:
              "video",

            autoplay:
              false,

            allowfullscreen:
              true,

            parent: [
              TWITCH_PARENT
            ]

          }
        );

    }


    /* =======================================================
       TUNE TO CHANNEL
       ======================================================= */

    function tuneChannel() {


      if (!televisionOn) {

        return;

      }


      const requestedChannel =
        cleanChannelName(
          channelSearch.value
        );


      /*
        Nothing entered.
      */

      if (!requestedChannel) {

        channelDisplay.textContent =
          "ENTER CHANNEL";

        channelSearch.focus();

        return;

      }


      /*
      omes current station.
      */

      currentChannel =
        requestedChannel;


      channelDisplay.textContent =
        "TUNING...";


      /*
        Recreate the official Twitch player
        using the newly selected channel.
      */

      createPlayer(
        currentChannel
      );


      /*
        Clear input.
      */

      channelSearch.value =
        "";


      /*
        Update front-panel display.
      */

      window.setTimeout(

        function () {


          if (televisionOn) {

            channelDisplay.textContent =
              currentChannel.toUpperCase();

          }


        },

        800

      );

    }


    /* =======================================================
       TUNE BUTTON
       ======================================================= */

    tuneButton.addEventListener(

      "click",

      tuneChannel

    );


    /* =======================================================
       PRESS ENTER TO TUNE
       ======================================================= */

    channelSearch.addEventListener(

      "keydown",

      function (event) {


        if (event.key === "Enter") {

          tuneChannel();

        }


      }

    );


    /* =======================================================
       POWER BUTTON
       ======================================================= */

    powerButton.addEventListener(

      "click",

      function () {


        televisionOn =
          !televisionOn;


        /* ---------------------
           POWER ON
           --------------------- */

        if (televisionOn) {


          standbyScreen.classList.remove(
            "visible"
          );


          powerLED.classList.add(
            "on"
          );


          channelDisplay.textContent =
            currentChannel.toUpperCase();


          /*
            Rebuild current Twitch station.
          */

          createPlayer(
            currentChannel
          );


        }


        /* ---------------------
           POWER OFF
           --------------------- */

        else {


          /*
            Remove Twitch completely so audio
            does not keep playing behind the
            standby screen.
          */

          document.getElementById(
            "twitch-embed"
          ).innerHTML = "";


          standbyScreen.classList.add(
            "visible"
          );


          powerLED.classList.remove(
            "on"
          );


          channelDisplay.textContent =
            "STANDBY";


        }


      }

    );


    /* =======================================================
       INITIAL STARTUP
       ======================================================= */

    createPlayer(
      currentChannel
    );


  </script>


</body>
</html>
