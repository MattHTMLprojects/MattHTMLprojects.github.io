<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Retro Twitch Projection TV</title>

<style>
:root {
    --twitch-purple: #9147ff;
    --display-green: #6dffae;
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {
    min-height: 100vh;
    color: #eee;
    font-family: Arial, Helvetica, sans-serif;

    background:
        radial-gradient(
            circle at 50% 20%,
            #756650 0%,
            #554837 27%,
            #30281f 57%,
            #17130f 100%
        );
}

/* =========================================================
   ROOM
========================================================= */

.room {
    position: relative;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 55px 25px 80px;

    overflow-x: auto;
}

.wall-texture {
    position: absolute;
    inset: 0;

    pointer-events: none;

    background:
        repeating-linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.012) 0,
            rgba(255, 255, 255, 0.012) 2px,
            transparent 2px,
            transparent 115px
        );
}

/* =========================================================
   TV
========================================================= */

.tv {
    position: relative;
    z-index: 5;

    width: min(1520px, 96vw);

    padding: 25px 34px 29px;

    border: 4px solid #050505;
    border-radius: 19px 19px 8px 8px;

    background:
        linear-gradient(
            145deg,
            #454545 0%,
            #181818 17%,
            #303030 52%,
            #141414 82%,
            #080808 100%
        );

    box-shadow:
        0 42px 55px rgba(0, 0, 0, 0.72),
        inset 3px 3px 4px rgba(255, 255, 255, 0.12),
        inset -5px -5px 15px rgba(0, 0, 0, 0.85);
}

.tv::after {
    content: "";

    position: absolute;
    z-index: -1;

    left: 55px;
    right: 55px;
    bottom: -32px;

    height: 35px;

    border-radius: 0 0 9px 9px;

    background:
        linear-gradient(
            #171717,
            #050505
        );

    box-shadow:
        0 14px 19px rgba(0, 0, 0, 0.55);
}

/* =========================================================
   TV HEADER
========================================================= */

.tv-header {
    height: 55px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 0 18px;

    border: 1px solid #030303;
    border-radius: 7px;

    background:
        linear-gradient(
            #303030,
            #0f0f0f
        );

    box-shadow:
        inset 0 1px rgba(255, 255, 255, 0.10);
}

.brand {
    color: var(--twitch-purple);

    font-size: clamp(24px, 3vw, 34px);
    font-weight: 900;

    letter-spacing: 5px;

    text-shadow:
        0 0 9px rgba(145, 71, 255, 0.55);
}

.model {
    color: #9c9c9c;

    font-size: 10px;

    letter-spacing: 2px;
}



/* =========================================================
   SCREEN CABINET
========================================================= */

.screen-bezel {
    margin-top: 20px;

    padding: 28px 30px 13px;

    border: 4px solid #030303;
    border-radius: 24px 24px 16px 16px;

    background:
        linear-gradient(
            145deg,
            #030303,
            #262626 48%,
            #070707
        );

    box-shadow:
        inset 0 0 22px #000,
        inset 3px 3px 5px rgba(255, 255, 255, 0.07),
        0 7px 16px rgba(0, 0, 0, 0.80);
}

.screen {
    position: relative;

    width: 1280px;
    max-width: 100%;

    aspect-ratio: 16 / 9;

    margin: 0 auto;

    overflow: hidden;

    border: 4px solid #020202;
    border-radius: 9px;

    background: #000;

    box-shadow:
        0 0 30px rgba(100, 60, 150, 0.18),
        inset 0 0 22px #000;
}

#twitch-embed {
    width: 100%;
    height: 100%;

    background: #000;
}

#twitch-embed iframe {
    display: block;

    width: 100% !important;
    height: 100% !important;

    border: 0;
}

/* =========================================================
   STANDBY
========================================================= */

.standby {
    position: absolute;
    inset: 0;
    z-index: 30;

    display: none;
    justify-content: center;
    align-items: center;

    color: #535353;

    font-family: "Courier New", monospace;
    font-size: clamp(16px, 2vw, 27px);

    letter-spacing: 7px;

    background:
        radial-gradient(
            ellipse at center,
            #1c1c1c,
            #030303 72%,
            #000
        );

    user-select: none;
}

.standby.visible {
    display: flex;
}

/* =========================================================
   DVD SCREENSAVER OVERLAY
========================================================= */

.dvd-screen {
    position: absolute;
    inset: 0;
    z-index: 20;

    display: none;

    overflow: hidden;

    background:
        radial-gradient(
            ellipse at center,
            #090909 0%,
            #030303 62%,
            #000 100%
        );

    box-shadow:
        inset 0 0 38px rgba(0, 0, 0, 0.95);

    cursor: none;
    user-select: none;
}

.dvd-screen.visible {
    display: block;
}

.dvd-screen::after {
    content: "";

    position: absolute;
    z-index: 5;
    inset: 0;

    pointer-events: none;

    opacity: 0.19;

    background:
        repeating-linear-gradient(
            0deg,
            transparent 0,
            transparent 2px,
            rgba(255, 255, 255, 0.035) 2px,
            rgba(255, 255, 255, 0.035) 3px
        );
}

.dvd-logo {
    position: absolute;
    z-index: 3;

    left: 0;
    top: 0;

    width: clamp(78px, 12vw, 156px);
    height: clamp(48px, 7.5vw, 96px);

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    color: rgb(0, 255, 255);

    filter:
        drop-shadow(0 0 5px currentColor)
        drop-shadow(0 0 12px currentColor);

    will-change: transform;
}

.dvd-word {
    position: relative;

    line-height: 0.72;

    font-family: Arial Black, Impact, Arial, sans-serif;
    font-size: clamp(35px, 6vw, 74px);
    font-weight: 900;
    font-style: italic;

    letter-spacing: -6px;

    transform: scaleX(1.18);
}

.dvd-word::after {
    content: "";

    position: absolute;

    left: 50%;
    bottom: -11px;

    width: 92%;
    height: 9px;

    border: 4px solid currentColor;
    border-top-width: 2px;
    border-radius: 50%;

    transform:
        translateX(-50%)
        skewX(-13deg);
}

.dvd-video {
    margin-top: 14px;
    padding-left: 4px;

    font-family: Arial, Helvetica, sans-serif;
    font-size: clamp(8px, 1.1vw, 14px);
    font-weight: 900;

    letter-spacing: clamp(4px, 0.7vw, 9px);
}

.dvd-logo.corner-hit {
    animation: cornerFlash 0.65s ease-out;
}

@keyframes cornerFlash {
    0% {
        color: #fff;

        filter:
            drop-shadow(0 0 8px #fff)
            drop-shadow(0 0 20px #fff)
            drop-shadow(0 0 38px #fff);

        transform: scale(1);
    }

    35% {
        color: #fff;

        filter:
            drop-shadow(0 0 14px #fff)
            drop-shadow(0 0 30px #fff)
            drop-shadow(0 0 55px #fff);

        transform: scale(1.12);
    }

    100% {
        transform: scale(1);
    }
}

/* =========================================================
   AUX MUSIC VISUALIZER
========================================================= */

.aux-screen {
    position: absolute;
    inset: 0;
    z-index: 21;

    display: none;

    overflow: hidden;

    background:
        radial-gradient(
            ellipse at center bottom,
            #10261c 0%,
            #07110d 28%,
            #030806 58%,
            #000 100%
        );

    box-shadow:
        inset 0 0 55px rgba(0, 0, 0, 0.95);

    user-select: none;
}

.aux-screen.visible {
    display: block;
}

/*
CRT horizontal lines.
*/
.aux-screen::after {
    content: "";

    position: absolute;
    z-index: 8;

    inset: 0;

    pointer-events: none;

    opacity: 0.25;

    background:
        repeating-linear-gradient(
            0deg,
            transparent 0,
            transparent 3px,
            rgba(255, 255, 255, 0.045) 3px,
            rgba(255, 255, 255, 0.045) 4px
        );
}

/*
Faint vertical grid.
*/
.aux-screen::before {
    content: "";

    position: absolute;
    z-index: 1;

    inset: 0;

    pointer-events: none;

    background:
        repeating-linear-gradient(
            90deg,
            transparent 0,
            transparent 59px,
            rgba(109, 255, 174, 0.035) 60px
        );
}

.aux-title {
    position: absolute;
    z-index: 4;

    top: 7%;
    left: 50%;

    transform: translateX(-50%);

    color: rgba(109, 255, 174, 0.70);

    font-family: "Courier New", monospace;
    font-size: clamp(10px, 1.2vw, 16px);
    font-weight: bold;

    letter-spacing: clamp(4px, 0.7vw, 9px);

    white-space: nowrap;

    text-shadow:
        0 0 8px rgba(109, 255, 174, 0.75);
}

.aux-spectrum {
    position: absolute;
    z-index: 3;

    left: 6%;
    right: 6%;

    bottom: 10%;

    height: 72%;

    display: flex;
    align-items: flex-end;
    justify-content: center;

    gap: clamp(4px, 0.65vw, 10px);

    padding:
        0
        clamp(8px, 2vw, 30px);

    border-bottom:
        2px solid rgba(109, 255, 174, 0.40);
}

/*
Individual spectrum bars.
JavaScript constantly changes their height.
*/
.aux-bar {
    flex: 1;

    min-width: 4px;
    max-width: 34px;

    height: 15%;

    border-radius:
        2px 2px 0 0;

    background:
        linear-gradient(
            to top,
            #25ff7a 0%,
            #60ff9d 38%,
            #e8ff54 72%,
            #ff7b32 89%,
            #ff394f 100%
        );

    box-shadow:
        0 0 7px rgba(83, 255, 145, 0.55);

    transform-origin: center bottom;

    transition:
        height 95ms linear,
        opacity 95ms linear;
}

.aux-status {
    position: absolute;
    z-index: 4;

    left: 0;
    right: 0;

    bottom: 3%;

    text-align: center;

    color: rgba(109, 255, 174, 0.56);

    font-family: "Courier New", monospace;
    font-size: clamp(8px, 0.85vw, 12px);

    letter-spacing: 3px;

    text-shadow:
        0 0 7px rgba(109, 255, 174, 0.45);
}

/* =========================================================
COZY CHRISTMAS FIREPLACE OVERLAY
========================================================= */
.cozy-screen {
position: absolute;
inset: 0;
z-index: 22;
display: none;
overflow: hidden;
background:
radial-gradient(
circle at 49% 65%,
rgba(255, 157, 55, 0.30) 0%,
rgba(82, 31, 15, 0.12) 23%,
transparent 48%
),
linear-gradient(
to bottom,
#221711 0%,
#3e281c 56%,
#1a100b 57%,
#090604 100%
);
box-shadow:
inset 0 0 75px rgba(0, 0, 0, 0.86);
user-select: none;
}

.cozy-screen.visible {
display: block;
}

/*
Warm flickering light over the whole scene.
*/
.cozy-glow {
position: absolute;
z-index: 20;
inset: 0;
pointer-events: none;
background:
radial-gradient(
ellipse at 49% 74%,
rgba(255, 177, 65, 0.19),
transparent 46%
);
mix-blend-mode: screen;
animation:
cozyRoomGlow 2.2s ease-in-out infinite alternate;
}

/*
Subtle CRT scan lines.
*/
.cozy-screen::after {
content: "";
position: absolute;
z-index: 30;
inset: 0;
pointer-events: none;
opacity: 0.18;
background:
repeating-linear-gradient(
0deg,
transparent 0,
transparent 3px,
rgba(255, 255, 255, 0.04) 3px,
rgba(255, 255, 255, 0.04) 4px
);
}

/* =========================================================
COZY ROOM WALL DETAILS
========================================================= */
.cozy-wall-pattern {
position: absolute;
z-index: 1;
inset: 0 0 42% 0;
opacity: 0.32;
background:
repeating-linear-gradient(
90deg,
transparent 0,
transparent 79px,
rgba(255, 215, 165, 0.08) 80px
),
repeating-linear-gradient(
0deg,
transparent 0,
transparent 69px,
rgba(255, 215, 165, 0.04) 70px
);
}

.cozy-floor {
position: absolute;
z-index: 2;
left: 0;
right: 0;
bottom: 0;
height: 24%;
background:
repeating-linear-gradient(
90deg,
#1e1009 0,
#1e1009 88px,
#120905 90px,
#120905 94px
);
box-shadow:
inset 0 15px 25px rgba(0, 0, 0, 0.55);
}

/* =========================================================
FIREPLACE
========================================================= */
.fireplace {
position: absolute;
z-index: 8;
left: 50%;
bottom: 12%;
width: 42%;
height: 59%;
transform: translateX(-50%);
}

.fireplace-chimney {
position: absolute;
left: 10%;
right: 10%;
top: 0;
bottom: 13%;
border:
clamp(7px, 1vw, 14px)
solid #4b2c1d;
background:
repeating-linear-gradient(
0deg,
transparent 0,
transparent 29px,
rgba(25, 10, 5, 0.52) 30px,
rgba(25, 10, 5, 0.52) 33px
),
repeating-linear-gradient(
90deg,
#74482e 0,
#74482e 60px,
#5e3723 61px,
#5e3723 64px
);
box-shadow:
inset 0 0 30px rgba(0, 0, 0, 0.36),
0 11px 24px rgba(0, 0, 0, 0.55);
}

.fireplace-mantel {
position: absolute;
z-index: 12;
left: 0;
right: 0;
top: 16%;
height: 12%;
border-radius: 4px;
background:
linear-gradient(
to bottom,
#9a6942 0%,
#5c3823 45%,
#342015 100%
);
box-shadow:
0 9px 13px rgba(0, 0, 0, 0.54),
inset 0 2px rgba(255, 225, 179, 0.23);
}

.fireplace-hearth {
position: absolute;
z-index: 11;
left: 5%;
right: 5%;
bottom: 0;
height: 16%;
border-radius: 5px 5px 2px 2px;
background:
linear-gradient(
to bottom,
#70452c,
#372116
);
box-shadow:
0 10px 20px rgba(0, 0, 0, 0.72),
inset 0 2px rgba(255, 220, 170, 0.12);
}

.fireplace-opening {
position: absolute;
z-index: 10;
left: 20%;
right: 20%;
bottom: 13%;
height: 57%;
overflow: hidden;
border:
clamp(6px, 0.8vw, 11px)
solid #27140c;
border-radius:
44% 44% 5px 5px /
30% 30% 5px 5px;
background:
radial-gradient(
ellipse at center bottom,
#4b1008 0%,
#1a0503 47%,
#030101 100%
);
box-shadow:
inset 0 0 32px #000,
0 0 15px rgba(255, 92, 19, 0.25);
}

/* =========================================================
FIRE LOGS
========================================================= */
.fire-logs {
position: absolute;
z-index: 3;
left: 17%;
right: 17%;
bottom: 7%;
height: 21%;
}

.fire-log {
position: absolute;
left: 8%;
bottom: 9%;
width: 84%;
height: 31%;
border-radius: 50px;
background:
linear-gradient(
90deg,
#2b1008,
#70321a 18%,
#35150a 53%,
#7e381c 83%,
#260d07
);
box-shadow:
0 0 9px rgba(255, 81, 20, 0.5);
}

.fire-log:first-child {
transform: rotate(10deg);
}

.fire-log:last-child {
transform: rotate(-10deg);
}

/* =========================================================
ANIMATED FIRE
========================================================= */
.flames {
position: absolute;
z-index: 5;
left: 13%;
right: 13%;
bottom: 13%;
height: 72%;
filter:
drop-shadow(0 0 9px #ff8b13)
drop-shadow(0 0 20px rgba(255, 49, 0, 0.75));
}

.flame {
position: absolute;
bottom: 0;
border-radius:
52% 48% 48% 52% /
72% 72% 28% 28%;
transform-origin: center bottom;
mix-blend-mode: screen;
}

.flame-one {
left: 28%;
width: 42%;
height: 88%;
background:
linear-gradient(
to top,
#fff4a3 0%,
#ffbc24 27%,
#ff5a0b 65%,
rgba(255, 28, 0, 0.20) 100%
);
animation:
fireDanceOne 0.72s ease-in-out infinite alternate;
}

.flame-two {
left: 6%;
width: 34%;
height: 57%;
background:
linear-gradient(
to top,
#ffe266,
#ff780f 48%,
rgba(255, 30, 0, 0.18)
);
animation:
fireDanceTwo 0.55s ease-in-out infinite alternate;
}

.flame-three {
right: 6%;
width: 35%;
height: 67%;
background:
linear-gradient(
to top,
#fff18e,
#ff9418 42%,
rgba(255, 24, 0, 0.18)
);
animation:
fireDanceThree 0.64s ease-in-out infinite alternate;
}

.flame-four {
left: 40%;
width: 24%;
height: 52%;
background:
linear-gradient(
to top,
#fffbd0,
#ffcf35 45%,
rgba(255, 92, 5, 0.15)
);
animation:
fireDanceFour 0.43s ease-in-out infinite alternate;
}

/* =========================================================
STOCKINGS
========================================================= */
.stockings {
position: absolute;
z-index: 16;
left: 24%;
right: 24%;
top: 24%;
height: 37%;
display: flex;
justify-content: space-around;
pointer-events: none;
}

.stocking {
position: relative;
width: clamp(28px, 3.5vw, 50px);
height: clamp(67px, 8vw, 110px);

border-radius:
8px 8px
15px 18px;

background:
linear-gradient(
105deg,
#7f1018 0%,
#c92530 28%,
#b51d27 59%,
#741018 100%
);

box-shadow:
4px 7px 9px rgba(0, 0, 0, 0.45),
inset 5px 0 7px rgba(255, 255, 255, 0.08),
inset -5px 0 7px rgba(66, 0, 0, 0.20);

transform-origin:
center top;

animation:
stockingSway
3.5s
ease-in-out
infinite alternate;
}

/*
Green center stocking.
*/
.stocking:nth-child(2) {
background:
linear-gradient(
105deg,
#083d20 0%,
#16834a 30%,
#126c3e 59%,
#07381f 100%
);

animation-delay:
-1.3s;
}

.stocking:nth-child(3) {
animation-delay:
-2.2s;
}

/*
Soft white cuff.
*/
.stocking::before {
content: "";

position: absolute;

z-index: 3;

left: -6%;
top: -5%;

width: 112%;
height: 20%;

border-radius:
6px 6px 8px 8px;

background:
linear-gradient(
to bottom,
#fffdf3 0%,
#eee7d7 48%,
#c9bda9 100%
);

box-shadow:
0 3px 5px rgba(0, 0, 0, 0.35),
inset 0 1px rgba(255, 255, 255, 0.8);
}

/*
Foot.

The important change is that the foot now
overlaps deeply into the stocking body,
making the two pieces visually merge.
*/
.stocking::after {
content: "";

position: absolute;

z-index: 1;

right: -42%;
bottom: -2%;

width: 92%;
height: 43%;

border-radius:
15% 62% 58% 42% /
30% 58% 55% 50%;

background:
inherit;

box-shadow:
4px 5px 7px rgba(0, 0, 0, 0.32);

transform:
rotate(4deg);
}

/* =========================================================
CHRISTMAS TREE
========================================================= */
.christmas-tree {
    position: absolute;
    z-index: 9;

    /*
    Place the tree on the RIGHT side of the room.
    Adjust right to move the whole tree left/right.
    */
    right: 3%;

    /*
    Keep the tree sitting on the floor.
    Fireplace uses bottom: 12%, so start around there.
    */
    bottom: 10%;

    /*
    Responsive tree size.
    It grows/shrinks with the browser but has limits.
    */
    width: clamp(220px, 27vw, 480px);

    /*
    Maintains the tree proportions.
    */
    aspect-ratio: 1 / 1.25;

    margin: 0;

    /*
    Lets the children use cqw units.
    1cqw equals 1% of this tree's width.
    */
    container-type: inline-size;
}

.tree-star {
position: absolute;
z-index: 9;
left: 50%;
top: 0;
width: clamp(20px, 3.1vw, 43px);
height: clamp(20px, 3.1vw, 43px);
transform:
translateX(-50%)
rotate(45deg);
background: #ffd84e;
box-shadow:
0 0 9px #ffe26f,
0 0 23px rgba(255, 204, 55, 0.85);
animation:
starGlow 1.6s ease-in-out infinite alternate;
}

.tree-star::before,
.tree-star::after {
content: "";
position: absolute;
inset: 0;
background: inherit;
}

.tree-star::before {
transform: rotate(30deg);
}

.tree-star::after {
transform: rotate(60deg);
}

.tree-layer {
    position: absolute;
    left: 50%;

    width: 0;
    height: 0;

    transform: translateX(-50%);

    border-left-style: solid;
    border-right-style: solid;
    border-bottom-style: solid;

    border-left-color: transparent;
    border-right-color: transparent;
}

.tree-layer-one {
    z-index: 5;
    top: 8%;

    border-left-width: 25cqw;
    border-right-width: 25cqw;
    border-bottom-width: 48cqw;

    border-bottom-color: #165832;
}

.tree-layer-two {
    z-index: 4;
    top: 27%;

    border-left-width: 36cqw;
    border-right-width: 36cqw;
    border-bottom-width: 56cqw;

    border-bottom-color: #0e4628;
}

.tree-layer-three {
    z-index: 3;
    top: 47%;

    border-left-width: 48cqw;
    border-right-width: 48cqw;
    border-bottom-width: 62cqw;

    border-bottom-color: #0a3721;
}

.tree-trunk {
position: absolute;
z-index: 2;
left: 50%;
bottom: 0;
width: 15%;
height: 20%;
transform: translateX(-50%);
background:
linear-gradient(
90deg,
#3b1c0d,
#73401e,
#321508
);
}

/* =========================================================
TREE LIGHTS AND ORNAMENTS
========================================================= */
.tree-decorations {
    position: absolute;
    z-index: 8;

    /*
    Decoration area begins near the top branch
    and ends before the trunk.
    */
    left: 4%;
    top: 8%;

    width: 92%;
    height: 77%;

    overflow: hidden;
    pointer-events: none;

    /*
    Optional debugging background.
    Uncomment temporarily to see the decoration area.
    */

const powerLED =
    document.getElementById(
        "power-led"
    );

const tvScreen =
    document.getElementById(
        "tv-screen"
    );

const dvdScreen =
    document.getElementById(
        "dvd-screen"
    );

const dvdLogo =
    document.getElementById(
        "dvd-logo"
    );

const dvdButton =
    document.getElementById(
        "dvd-button"
    );

const auxScreen =
    document.getElementById(
        "aux-screen"
    );

const auxSpectrum =
    document.getElementById(
        "aux-spectrum"
    );

const auxButton =
    document.getElementById(
        "aux-button"
    );

const cozyScreen =
document.getElementById(
"cozy-screen"
);

const cozyButton =
document.getElementById(
"cozy-button"
);

/* =======================================================
   CLEAN CHANNEL NAME
======================================================= */

function cleanChannelName(value) {

    let channel =
        value.trim();

    channel =
        channel.replace(
            /^https?:\/\/(www\.)?twitch\.tv\//i,
            ""
        );

    channel =
        channel.split(/[/?#]/)[0];

    return channel.trim();
}

/* =======================================================
   CREATE TWITCH PLAYER
======================================================= */

function createPlayer(channel) {

    const embedContainer =
        document.getElementById(
            "twitch-embed"
        );

    embedContainer.innerHTML =
        "";

    twitchEmbed =
        new Twitch.Embed(
            "twitch-embed",
            {
                width:
                    "100%",

                height:
                    "100%",

                channel:
                    channel,

                layout:
                    "video",

                autoplay:
                    false,

                allowfullscreen:
                    true,

                parent: [
                    TWITCH_PARENT
                ]
            }
        );
}

/* =======================================================
   TUNE TO CHANNEL
======================================================= */

function tuneChannel() {

    if (!televisionOn) {
        return;
    }

    const requestedChannel =
        cleanChannelName(
            channelSearch.value
        );

    if (!requestedChannel) {

        channelDisplay.textContent =
            "ENTER CHANNEL";

        channelSearch.focus();

        return;
    }

    currentChannel =
        requestedChannel;

    channelDisplay.textContent =
        "TUNING...";

    createPlayer(
        currentChannel
    );

    channelSearch.value =
        "";

    window.setTimeout(
        function () {

            if (televisionOn) {

                channelDisplay.textContent =
                    currentChannel.toUpperCase();
            }

        },
        800
    );
}

/* =======================================================
   TUNE BUTTON
======================================================= */

tuneButton.addEventListener(
    "click",
    tuneChannel
);

/* =======================================================
   ENTER TO TUNE
======================================================= */

channelSearch.addEventListener(
    "keydown",
    function (event) {

        if (event.key === "Enter") {
            tuneChannel();
        }

    }
);

/* =======================================================
   AUX VISUALIZER
======================================================= */

let auxModeOn =
    false;

let auxTimer =
    null;

const auxBarCount =
    32;

const auxBars =
    [];

/*
Create the spectrum bars once when the page starts.
*/
function createAuxBars() {

    for (
        let index = 0;
        index < auxBarCount;
        index++
    ) {

        const bar =
            document.createElement(
                "div"
            );

        bar.className =
            "aux-bar";

        auxSpectrum.appendChild(
            bar
        );

        auxBars.push(
            bar
        );
    }
}

createAuxBars();

/*
Fake spectrum movement.

Each bar is given a semi-random height.
Bars in nearby areas also receive a small
wave influence so the entire display feels
more like music instead of pure static noise.
*/
function animateAuxBars() {

    const now =
        performance.now() / 1000;

    auxBars.forEach(
        function (bar, index) {

            const wave1 =
                Math.sin(
                    now * 4.5 +
                    index * 0.55
                );

            const wave2 =
                Math.sin(
                    now * 7.2 -
                    index * 0.31
                );

            const randomAmount =
                Math.random();

            let height =
                18 +
                randomAmount * 45 +
                wave1 * 14 +
                wave2 * 8;

            /*
            Give the center frequencies a little
            more energy.
            */

            const centerDistance =
                Math.abs(
                    index -
                    (auxBarCount - 1) / 2
                );

            const centerBoost =
                Math.max(
                    0,
                    15 -
                    centerDistance
                );

            height +=
                centerBoost * 1.2;

            height =
                Math.max(
                    8,
                    Math.min(
                        96,
                        height
                    )
                );

            bar.style.height =
                height + "%";

            bar.style.opacity =
                0.72 +
                Math.random() * 0.28;
        }
    );
}



/* -------------------------------------------------------
   START AUX
------------------------------------------------------- */

function startAuxVisualizer() {

    if (
        !televisionOn ||
        auxModeOn
    ) {
        return;
    }

    /*
    DVD and AUX cannot occupy the screen
    at the same time.
    */

    if (dvdModeOn) {
        stopDVDScreensaver();
    }

if (cozyModeOn) {
stopCozyMode();
}

    auxModeOn =
        true;

    auxScreen.classList.add(
        "visible"
    );

    auxScreen.setAttribute(
        "aria-hidden",
        "false"
    );

    auxButton.classList.add(
        "active"
    );

    auxButton.setAttribute(
        "aria-pressed",
        "true"
    );

    animateAuxBars();

    auxTimer =
        window.setInterval(
            animateAuxBars,
            110
        );
}

/* -------------------------------------------------------
   STOP AUX
------------------------------------------------------- */

function stopAuxVisualizer() {

    auxModeOn =
        false;

    if (auxTimer !== null) {

        window.clearInterval(
            auxTimer
        );

        auxTimer =
            null;
    }

    auxScreen.classList.remove(
        "visible"
    );

    auxScreen.setAttribute(
        "aria-hidden",
        "true"
    );

    auxButton.classList.remove(
        "active"
    );

    auxButton.setAttribute(
        "aria-pressed",
        "false"
    );
}

/* -------------------------------------------------------
   AUX BUTTON
------------------------------------------------------- */

auxButton.addEventListener(
    "click",
    function () {

        if (!televisionOn) {
            return;
        }

        if (auxModeOn) {

            stopAuxVisualizer();

        }
        else {

            startAuxVisualizer();
        }

    }
);

/* =======================================================
COZY CHRISTMAS FIREPLACE
======================================================= */
let cozyModeOn =
false;

/* -------------------------------------------------------
START COZY MODE
------------------------------------------------------- */
function startCozyMode() {
if (
!televisionOn ||
cozyModeOn
) {
return;
}

/*
Only one special screen mode can be active.
*/
if (auxModeOn) {
stopAuxVisualizer();
}

if (dvdModeOn) {
stopDVDScreensaver();
}

cozyModeOn =
true;

cozyScreen.classList.add(
"visible"
);

cozyScreen.setAttribute(
"aria-hidden",
"false"
);

cozyButton.classList.add(
"active"
);

cozyButton.setAttribute(
"aria-pressed",
"true"
);
}

/* -------------------------------------------------------
STOP COZY MODE
------------------------------------------------------- */
function stopCozyMode() {
cozyModeOn =
false;

cozyScreen.classList.remove(
"visible"
);

cozyScreen.setAttribute(
"aria-hidden",
"true"
);

cozyButton.classList.remove(
"active"
);

cozyButton.setAttribute(
"aria-pressed",
"false"
);
}

/* -------------------------------------------------------
COZY BUTTON
------------------------------------------------------- */
cozyButton.addEventListener(
"click",
function () {
if (!televisionOn) {
return;
}

if (cozyModeOn) {
stopCozyMode();
}
else {
startCozyMode();
}
}
);

/* =======================================================
   DVD SCREENSAVER
======================================================= */

let dvdModeOn =
    false;

let dvdAnimationFrame =
    null;

let dvdLastFrameTime =
    0;

let dvdX =
    0;

let dvdY =
    0;

let dvdVelocityX =
    175;

let dvdVelocityY =
    145;

let lastHorizontalBounce =
    -1000;

let lastVerticalBounce =
    -1000;

const cornerHitWindow =
    45;

const dvdColors = [
    "rgb(0, 255, 255)",
    "rgb(255, 45, 45)",
    "rgb(77, 255, 77)",
    "rgb(255, 68, 255)",
    "rgb(255, 225, 0)",
    "rgb(57, 120, 255)",
    "rgb(255, 128, 0)",
    "rgb(170, 75, 255)"
];

let currentDVDColorIndex =
    0;

const reducedMotion =
    window.matchMedia(
        "(prefers-reduced-motion: reduce)"
    ).matches;

if (reducedMotion) {

    dvdVelocityX =
        85;

    dvdVelocityY =
        70;
}

/* -------------------------------------------------------
   CHANGE DVD COLOR
------------------------------------------------------- */

function changeDVDColor() {

    let nextIndex =
        currentDVDColorIndex;

    while (
        nextIndex ===
        currentDVDColorIndex
    ) {

        nextIndex =
            Math.floor(
                Math.random() *
                dvdColors.length
            );
    }

    currentDVDColorIndex =
        nextIndex;

    dvdLogo.style.color =
        dvdColors[
            currentDVDColorIndex
        ];
}

/* -------------------------------------------------------
   CORNER HIT
------------------------------------------------------- */

function showCornerHit() {

    dvdLogo.classList.remove(
        "corner-hit"
    );

    void dvdLogo.offsetWidth;

    dvdLogo.classList.add(
        "corner-hit"
    );

    window.setTimeout(
        function () {

            dvdLogo.classList.remove(
                "corner-hit"
            );

        },
        700
    );
}

/* -------------------------------------------------------
   KEEP DVD LOGO INSIDE SCREEN
------------------------------------------------------- */

function constrainDVDLogoToScreen() {

    const screenWidth =
        dvdScreen.clientWidth;

    const screenHeight =
        dvdScreen.clientHeight;

    const logoWidth =
        dvdLogo.offsetWidth;

    const logoHeight =
        dvdLogo.offsetHeight;

    const maximumX =
        Math.max(
            0,
            screenWidth - logoWidth
        );

    const maximumY =
        Math.max(
            0,
            screenHeight - logoHeight
        );

    dvdX =
        Math.min(
            Math.max(
                dvdX,
                0
            ),
            maximumX
        );

    dvdY =
        Math.min(
            Math.max(
                dvdY,
                0
            ),
            maximumY
        );

    dvdLogo.style.transform =
        `translate3d(${dvdX}px, ${dvdY}px, 0)`;
}

/* -------------------------------------------------------
   START DVD
------------------------------------------------------- */

function startDVDScreensaver() {

    if (
        !televisionOn ||
        dvdModeOn
    ) {
        return;
    }

    /*
    AUX shuts off automatically.
    */

    if (auxModeOn) {
        stopAuxVisualizer();
    }

if (cozyModeOn) {
stopCozyMode();
}

    dvdModeOn =
        true;

    dvdScreen.classList.add(
        "visible"
    );

    dvdScreen.setAttribute(
        "aria-hidden",
        "false"
    );

    dvdButton.classList.add(
        "active"
    );

    dvdButton.setAttribute(
        "aria-pressed",
        "true"
    );

    window.requestAnimationFrame(
        function () {

            const maximumX =
                Math.max(
                    0,
                    dvdScreen.clientWidth -
                    dvdLogo.offsetWidth
                );

            const maximumY =
                Math.max(
                    0,
                    dvdScreen.clientHeight -
                    dvdLogo.offsetHeight
                );

            dvdX =
                maximumX * 0.27;

            dvdY =
                maximumY * 0.34;

            dvdVelocityX =
                Math.abs(
                    dvdVelocityX
                );

            dvdVelocityY =
                Math.abs(
                    dvdVelocityY
                );

            changeDVDColor();

            dvdLastFrameTime =
                performance.now();

            dvdAnimationFrame =
                window.requestAnimationFrame(
                    animateDVD
                );
        }
    );
}

/* -------------------------------------------------------
   STOP DVD
------------------------------------------------------- */

function stopDVDScreensaver() {

    dvdModeOn =
        false;

    if (
        dvdAnimationFrame !== null
    ) {

        window.cancelAnimationFrame(
            dvdAnimationFrame
        );

        dvdAnimationFrame =
            null;
    }

    dvdScreen.classList.remove(
        "visible"
    );

    dvdScreen.setAttribute(
        "aria-hidden",
        "true"
    );

    dvdButton.classList.remove(
        "active"
    );

    dvdButton.setAttribute(
        "aria-pressed",
        "false"
    );

    dvdLastFrameTime =
        0;
}

/* -------------------------------------------------------
   DVD ANIMATION
------------------------------------------------------- */

function animateDVD(timestamp) {

    if (!dvdModeOn) {
        return;
    }

    const elapsedSeconds =
        Math.min(
            (
                timestamp -
                dvdLastFrameTime
            ) / 1000,
            0.05
        );

    dvdLastFrameTime =
        timestamp;

    const screenWidth =
        dvdScreen.clientWidth;

    const screenHeight =
        dvdScreen.clientHeight;

    const logoWidth =
        dvdLogo.offsetWidth;

    const logoHeight =
        dvdLogo.offsetHeight;

    const maximumX =
        Math.max(
            0,
            screenWidth -
            logoWidth
        );

    const maximumY =
        Math.max(
            0,
            screenHeight -
            logoHeight
        );

    dvdX +=
        dvdVelocityX *
        elapsedSeconds;

    dvdY +=
        dvdVelocityY *
        elapsedSeconds;

    let hitHorizontalEdge =
        false;

    let hitVerticalEdge =
        false;

    if (dvdX <= 0) {

        dvdX =
            0;

        dvdVelocityX =
            Math.abs(
                dvdVelocityX
            );

        hitHorizontalEdge =
            true;
    }
    else if (
        dvdX >= maximumX
    ) {

        dvdX =
            maximumX;

        dvdVelocityX =
            -Math.abs(
                dvdVelocityX
            );

        hitHorizontalEdge =
            true;
    }

    if (dvdY <= 0) {

        dvdY =
            0;

        dvdVelocityY =
            Math.abs(
                dvdVelocityY
            );

        hitVerticalEdge =
            true;
    }
    else if (
        dvdY >= maximumY
    ) {

        dvdY =
            maximumY;

        dvdVelocityY =
            -Math.abs(
                dvdVelocityY
            );

        hitVerticalEdge =
            true;
    }

    if (
        hitHorizontalEdge ||
        hitVerticalEdge
    ) {

        changeDVDColor();
    }

    if (hitHorizontalEdge) {

        lastHorizontalBounce =
            timestamp;
    }

    if (hitVerticalEdge) {

        lastVerticalBounce =
            timestamp;
    }

    if (
        Math.abs(
            lastHorizontalBounce -
            lastVerticalBounce
        ) <= cornerHitWindow &&
        (
            hitHorizontalEdge ||
            hitVerticalEdge
        )
    ) {

        showCornerHit();

        lastHorizontalBounce =
            -1000;

        lastVerticalBounce =
            -1000;
    }

    dvdLogo.style.transform =
        `translate3d(${dvdX}px, ${dvdY}px, 0)`;

    dvdAnimationFrame =
        window.requestAnimationFrame(
            animateDVD
        );
}

/* -------------------------------------------------------
   DVD BUTTON
------------------------------------------------------- */

dvdButton.addEventListener(
    "click",
    function () {

        if (!televisionOn) {
            return;
        }

        if (dvdModeOn) {

            stopDVDScreensaver();

        }
        else {

            startDVDScreensaver();
        }

    }
);

/* -------------------------------------------------------
   RESIZE
------------------------------------------------------- */

window.addEventListener(
    "resize",
    function () {

        if (dvdModeOn) {
            constrainDVDLogoToScreen();
        }

    }
);

/* =======================================================
   POWER BUTTON
======================================================= */

powerButton.addEventListener(
    "click",
    function () {

        televisionOn =
            !televisionOn;

        /* ---------------------
           POWER ON
        --------------------- */

        if (televisionOn) {

            standbyScreen.classList.remove(
                "visible"
            );

            powerLED.classList.add(
                "on"
            );

            channelDisplay.textContent =
                currentChannel.toUpperCase();

            createPlayer(
                currentChannel
            );
        }

        /* ---------------------
           POWER OFF
        --------------------- */

        else {

            /*
            Shut off both special display modes.
            */

            stopDVDScreensaver();

            stopAuxVisualizer();

stopCozyMode();

            /*
            Remove Twitch so sound cannot continue
            behind the standby screen.
            */

            document.getElementById(
                "twitch-embed"
            ).innerHTML =
                "";

            standbyScreen.classList.add(
                "visible"
            );

            powerLED.classList.remove(
                "on"
            );

            channelDisplay.textContent =
                "STANDBY";
        }

    }
);

/* =======================================================
   INITIAL STARTUP
======================================================= */

createPlayer(
    currentChannel
);

</script>
