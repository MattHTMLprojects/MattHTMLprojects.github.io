<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Classic Painting [by Matt]</title>
  <style>
    :root {
      --bg-face: #c0c0c0;
      --bg-dark: #808080;
      --bg-darker: #404040;
      --bg-light: #ffffff;
      --bg-hilight: #dfdfdf;
      --navy: #000080;
      --canvas-area: #808080;
      --text: #000000;
      --font-ui: "Tahoma", "MS Sans Serif", Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #2b2b2b;
      font-family: var(--font-ui);
      font-size: 12px;
      color: var(--text);
      overflow: hidden;
    }

    .window {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      background: var(--bg-face);
      border-top: 2px solid var(--bg-light);
      border-left: 2px solid var(--bg-light);
      border-right: 2px solid var(--bg-darker);
      border-bottom: 2px solid var(--bg-darker);
    }

    /* Title Bar */
    .title-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 22px;
      padding: 2px 4px;
      background: linear-gradient(90deg, #000080, #C0C0C0);
      color: #ffffff;
      font-weight: bold;
      letter-spacing: 0.2px;
      flex-shrink: 0;
    }

    .title-left {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .mini-icon {
      display: inline-grid;
      grid-template-columns: repeat(2, 1fr);
      width: 14px;
      height: 14px;
      padding: 1px;
      background: #fff;
      border: 1px solid #000;
      gap: 1px;
      flex-shrink: 0;
    }
    .mini-icon span:nth-child(1) { background: #000000; }
    .mini-icon span:nth-child(2) { background: #808080; }
    .mini-icon span:nth-child(3) { background: #D4D4D4; }
    .mini-icon span:nth-child(4) { background: #C0C0C0; }

    .win-controls {
      display: flex;
      gap: 2px;
      flex-shrink: 0;
    }

    .win-btn {
      width: 16px;
      height: 14px;
      padding: 0;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: bold;
      line-height: 1;
      background: var(--bg-face);
      color: #000;
      border-top: 1px solid var(--bg-light);
      border-left: 1px solid var(--bg-light);
      border-right: 1px solid var(--bg-darker);
      border-bottom: 1px solid var(--bg-darker);
      cursor: pointer;
    }

    .win-btn:active {
      border-top: 1px solid var(--bg-darker);
      border-left: 1px solid var(--bg-darker);
      border-right: 1px solid var(--bg-light);
      border-bottom: 1px solid var(--bg-light);
    }

    /* Menu / QoL Bar */
    .menu-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px;
      padding: 2px 4px;
      background: var(--bg-face);
      border-bottom: 1px solid var(--bg-dark);
      flex-shrink: 0;
    }

    .qol-btn {
      padding: 2px 7px;
      font-family: var(--font-ui);
      font-size: 11px;
      background: var(--bg-face);
      color: var(--text);
      border-top: 1px solid var(--bg-light);
      border-left: 1px solid var(--bg-light);
      border-right: 1px solid var(--bg-darker);
      border-bottom: 1px solid var(--bg-darker);
      cursor: pointer;
    }

    .qol-btn:hover:not(:disabled) {
      background: var(--bg-hilight);
    }

    .qol-btn:active:not(:disabled), .qol-btn.active {
      border-top: 1px solid var(--bg-darker);
      border-left: 1px solid var(--bg-darker);
      border-right: 1px solid var(--bg-light);
      border-bottom: 1px solid var(--bg-light);
      background: #b0b0b0;
    }

    .qol-btn:disabled {
      color: var(--bg-dark);
      cursor: default;
    }

    .qol-sep {
      width: 1px;
      height: 16px;
      background: var(--bg-dark);
      box-shadow: 1px 0 0 var(--bg-light);
      margin: 0 2px;
    }

    .qol-pipe {
      font-weight: bold;
      color: var(--bg-darker);
      padding: 0 4px;
      user-select: none;
    }

    .qol-group {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
    }

    .qol-check {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      cursor: pointer;
      padding: 1px 4px;
    }

    .qol-check input[type="checkbox"] {
      margin: 0;
      cursor: pointer;
    }

    .qol-group select,
    .qol-group input[type="number"] {
      font-family: var(--font-ui);
      font-size: 11px;
      height: 20px;
      background: #fff;
      color: #000;
      border-top: 1px solid var(--bg-darker);
      border-left: 1px solid var(--bg-darker);
      border-right: 1px solid var(--bg-light);
      border-bottom: 1px solid var(--bg-light);
    }

    .qol-group input[type="number"] {
      width: 54px;
      padding: 0 3px;
    }

    /* Main Workspace */
    .workspace {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    /* Left Tool Strip */
    .tool-column {
      width: 65px;
      box-sizing: border-box;
      padding: 4px 3px;
      background: var(--bg-face);
      border-right: 1px solid var(--bg-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      overflow-y: auto;
      overflow-x: hidden;
    }


    .tools-grid {
      display: grid;
      grid-template-columns: repeat(2, 24px);
      gap: 2px;
    }

    .tool-btn {
      width: 24px;
      height: 24px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-face);
      color: #000;
      font-size: 12px;
      border-top: 1px solid var(--bg-light);
      border-left: 1px solid var(--bg-light);
      border-right: 1px solid var(--bg-darker);
      border-bottom: 1px solid var(--bg-darker);
      cursor: pointer;
    }

    .tool-btn.select-icon {
      font-size: 10px;
      font-weight: bold;
      letter-spacing: -1px;
    }

    .tool-btn.text-icon {
      font-family: var(--font-ui);
      font-size: 9px;
      font-weight: bold;
      letter-spacing: -0.5px;
    }

    .tool-btn:hover {
      background: var(--bg-hilight);
    }

    .tool-btn.active {
      background: #d8d8d8;
      border-top: 1px solid var(--bg-darker);
      border-left: 1px solid var(--bg-darker);
      border-right: 1px solid var(--bg-light);
      border-bottom: 1px solid var(--bg-light);
      box-shadow: inset 1px 1px 0 var(--bg-dark);
    }

    .size-box {
      width: 56px;
      padding: 4px 2px;
      background: var(--bg-face);
      border-top: 1px solid var(--bg-dark);
      border-left: 1px solid var(--bg-dark);
      border-right: 1px solid var(--bg-light);
      border-bottom: 1px solid var(--bg-light);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .size-option {
      width: 48px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: 1px solid transparent;
    }

    .size-option.active {
      background: var(--navy);
      border-color: #fff;
    }

    .size-line {
      width: 36px;
      background: #000;
      border-radius: 1px;
    }

    .size-option.active .size-line {
      background: #fff;
    }

    /* Selected Tool Name Readout in Left Strip */
    .tool-readout {
      width: 66px;
      padding: 4px 3px;
      background: var(--bg-face);
      border-top: 1px solid var(--bg-dark);
      border-left: 1px solid var(--bg-dark);
      border-right: 1px solid var(--bg-light);
      border-bottom: 1px solid var(--bg-light);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 2px;
    }

    .tool-readout-caption {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      color: var(--bg-darker);
      font-weight: bold;
    }

    .tool-readout-value {
      width: 100%;
      padding: 2px 2px;
      background: #fff;
      color: var(--navy);
      font-size: 10px;
      font-weight: bold;
      border-top: 1px solid var(--bg-darker);
      border-left: 1px solid var(--bg-darker);
      border-right: 1px solid var(--bg-light);
      border-bottom: 1px solid var(--bg-light);
      word-break: break-word;
      line-height: 1.15;
    }

    /* Canvas Viewport */
    .canvas-viewport {
      flex: 1;
      overflow: auto;
      background: var(--canvas-area);
      padding: 12px;
      position: relative;
      border-top: 2px solid var(--bg-darker);
      border-left: 2px solid var(--bg-darker);
      border-right: 2px solid var(--bg-light);
      border-bottom: 2px solid var(--bg-light);
    }

    .canvas-viewport.pan-ready,
    .canvas-viewport.pan-ready canvas#paintCanvas {
      cursor: grab;
    }

    .canvas-viewport.panning,
    .canvas-viewport.panning * {
      cursor: grabbing !important;
      user-select: none;
    }

    .canvas-stage {
      position: relative;
      display: inline-block;
      box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.35);
      border: 1px solid #000;
      background-color: #ffffff;
      background-image:
        linear-gradient(45deg, #d8d8d8 25%, transparent 25%),
        linear-gradient(-45deg, #d8d8d8 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #d8d8d8 75%),
        linear-gradient(-45deg, transparent 75%, #d8d8d8 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0;
    }

    canvas#paintCanvas {
      display: block;
      touch-action: none;
      cursor: crosshair;
      image-rendering: pixelated;
    }

    canvas#previewCanvas {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
      touch-action: none;
      image-rendering: pixelated;
    }

    .grid-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: none;
      background-image:
        linear-gradient(to right, rgba(0, 0, 0, 0.16) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 0, 0, 0.16) 1px, transparent 1px);
    }

    .grid-overlay.visible {
      display: block;
    }

    .text-entry-box {
      position: absolute;
      z-index: 10;
      min-width: 140px;
      min-height: 44px;
      width: 200px;
      height: 64px;
      padding: 3px 5px;
      border: 1px dashed #000080;
      background: rgba(255, 255, 255, 0.92);
      outline: none;
      resize: both;
      overflow: auto;
      white-space: pre-wrap;
      overflow-wrap: break-word;
      word-break: break-word;
      font-family: var(--font-ui);
      line-height: 1.25;
      user-select: text;
      -webkit-user-select: text;
    }

     /* Right Dock: Stackable Layers & Color/Tone Adjustments */
    .side-dock {
      width: 215px;
      box-sizing: border-box;
      background: var(--bg-face);
      border-left: 1px solid var(--bg-light);
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 4px;
      flex-shrink: 0;
      overflow-y: auto;
      overflow-x: hidden;
      transition: width 0.15s ease;
    }

    .side-dock.collapsed {
      width: 34px;
      padding: 4px 3px;
      overflow-y: hidden;
    }

    .side-dock.collapsed > *:not(#toggleSideDockBtn) {
      display: none;
    }

    .side-dock.collapsed #toggleSideDockBtn {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      height: 115px;
      width: 26px;
      padding: 4px 0;
      margin: 0 auto;
    }

#toggleSideDockBtn {
  font-weight: bold;
}

    .adj-row {
      display: grid;
      grid-template-columns: 56px 1fr 32px;
      align-items: center;
      gap: 4px;
      font-size: 10px;
    }


    .dock-panel {
      background: var(--bg-face);
      border-top: 1px solid var(--bg-light);
      border-left: 1px solid var(--bg-light);
      border-right: 1px solid var(--bg-darker);
      border-bottom: 1px solid var(--bg-darker);
      padding: 4px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .dock-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--navy);
      color: #ffffff;
      padding: 2px 5px;
      font-size: 11px;
      font-weight: bold;
    }

    .layer-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
    }

    .layer-toolbar .qol-btn {
      padding: 2px 5px;
      font-size: 10px;
    }

    .layer-opacity-row {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
    }

    .layer-opacity-row input[type="range"] {
      flex: 1;
      min-width: 0;
      width: 100%;
      height: 14px;
      margin: 0;
      cursor: pointer;
    }

    .layers-list {
      display: flex;
      flex-direction: column-reverse;
      gap: 2px;
      max-height: 150px;
      overflow-y: auto;
      background: #ffffff;
      padding: 2px;
      border-top: 1px solid var(--bg-darker);
      border-left: 1px solid var(--bg-darker);
      border-right: 1px solid var(--bg-light);
      border-bottom: 1px solid var(--bg-light);
    }

    .layer-item {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 2px 4px;
      font-size: 11px;
      cursor: pointer;
      border: 1px solid transparent;
    }

    .layer-item.active {
      background: var(--navy);
      color: #ffffff;
    }

    .layer-item input[type="checkbox"] {
      margin: 0;
      cursor: pointer;
    }

    .layer-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .layer-alpha-tag {
      font-size: 10px;
      opacity: 0.85;
    }

    .adj-row input[type="range"] {
      min-width: 0;
      width: 100%;
      height: 14px;
      margin: 0;
      cursor: pointer;
    }

    .adj-val {
      text-align: right;
      font-family: var(--font-mono);
      font-size: 10px;
    }

    .adj-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
    }

    .adj-actions .qol-btn {
      padding: 2px 5px;
      font-size: 10px;
    }

    /* Bottom Color Palette + Hex Input */
    .color-panel {
      display: flex;
      flex-direction: column;
      background: var(--bg-face);
      border-top: 1px solid var(--bg-light);
      flex-shrink: 0;
    }

    .palette-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 5px 6px;
    }

    .active-colors {
      position: relative;
      width: 34px;
      height: 34px;
      border-top: 1px solid var(--bg-dark);
      border-left: 1px solid var(--bg-dark);
      border-right: 1px solid var(--bg-light);
      border-bottom: 1px solid var(--bg-light);
      background: var(--bg-face);
      flex-shrink: 0;
    }

    .secondary-color {
      position: absolute;
      right: 3px;
      bottom: 3px;
      width: 16px;
      height: 16px;
      border-top: 1px solid var(--bg-light);
      border-left: 1px solid var(--bg-light);
      border-right: 1px solid var(--bg-darker);
      border-bottom: 1px solid var(--bg-darker);
      cursor: pointer;
    }

    .primary-color {
      position: absolute;
      left: 4px;
      top: 4px;
      width: 17px;
      height: 17px;
      border-top: 1px solid var(--bg-light);
      border-left: 1px solid var(--bg-light);
      border-right: 1px solid var(--bg-darker);
      border-bottom: 1px solid var(--bg-darker);
      z-index: 2;
      cursor: pointer;
    }

    .swatches {
      display: grid;
      grid-template-columns: repeat(14, 18px);
      grid-template-rows: repeat(2, 16px);
      gap: 1px;
      background: var(--bg-dark);
      padding: 1px;
      border-top: 1px solid var(--bg-dark);
      border-left: 1px solid var(--bg-dark);
      border-right: 1px solid var(--bg-light);
      border-bottom: 1px solid var(--bg-light);
    }

    .swatch {
      width: 18px;
      height: 16px;
      padding: 0;
      border: 1px solid #404040;
      cursor: pointer;
    }

    .swatch:hover {
      outline: 1px solid #fff;
      z-index: 1;
    }

    .rgb-picker-popover {
      position: fixed;
      z-index: 9999;
      display: none;
      flex-direction: column;
      gap: 6px;
      width: 190px;
      padding: 8px;
      background: var(--bg-face, #c0c0c0);
      border-top: 1px solid var(--bg-light, #ffffff);
      border-left: 1px solid var(--bg-light, #ffffff);
      border-right: 1px solid var(--bg-darker, #404040);
      border-bottom: 1px solid var(--bg-darker, #404040);
      box-shadow: 2px 2px 6px rgba(0, 0, 0, 0.45);
      font-size: 11px;
      color: #000;
    }

    .rgb-picker-popover.open {
      display: flex;
    }

.rgb-picker-row {
  display: grid;
  grid-template-columns: 16px 1fr 48px;
  align-items: center;
  gap: 5px;
}

.rgb-picker-row input[type="range"] {
  width: 100%;
  margin: 0;
  cursor: pointer;
}

.rgb-picker-row input[type="number"] {
  width: 48px;
  box-sizing: border-box;
  padding: 1px 2px;
  font-size: 11px;
  font-family: var(--font-mono, monospace);
}


    .rgb-picker-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-top: 2px;
    }

    .rgb-picker-preview {
      width: 24px;
      height: 18px;
      border: 1px solid #404040;
      background: #000000;
    }

    .custom-swatch-wrap {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      flex-shrink: 0;
    }

    .custom-swatch-label {
      font-size: 10px;
      line-height: 1;
      font-weight: bold;
      color: #000;
      user-select: none;
    }

    .custom-swatch {
      width: 24px;
      height: 20px;
      padding: 0;
      border-top: 1px solid var(--bg-darker);
      border-left: 1px solid var(--bg-darker);
      border-right: 1px solid var(--bg-light);
      border-bottom: 1px solid var(--bg-light);
      background: #dcdcdc;
      cursor: pointer;
    }

    .custom-swatch:hover {
      outline: 1px solid #fff;
    }

    .custom-swatch:not([data-has-color="true"]) {
      background:
        linear-gradient(45deg, transparent 46%, #FFFFFF 47%, #FFFFFF 53%, transparent 54%),
        #FFFFFF;
    }

    /* Bottom Hex Bar */
    .hex-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 4px 6px 6px;
      border-top: 1px solid #a0a0a0;
      background: #c6c6c6;
    }

    .hex-label {
      font-weight: bold;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hex-preview {
      width: 22px;
      height: 20px;
      border-top: 1px solid var(--bg-darker);
      border-left: 1px solid var(--bg-darker);
      border-right: 1px solid var(--bg-light);
      border-bottom: 1px solid var(--bg-light);
      background: #000000;
      flex-shrink: 0;
    }

    .hex-input-wrap {
      display: inline-flex;
      align-items: center;
      background: #ffffff;
      border-top: 1px solid var(--bg-darker);
      border-left: 1px solid var(--bg-darker);
      border-right: 1px solid var(--bg-light);
      border-bottom: 1px solid var(--bg-light);
      padding: 0 4px;
      height: 22px;
    }

    .hex-prefix {
      font-family: var(--font-mono);
      font-size: 12px;
      color: #404040;
      margin-right: 1px;
    }

    input#hexInput {
      width: 82px;
      border: none;
      outline: none;
      background: transparent;
      font-family: var(--font-mono);
      font-size: 12px;
      color: #000;
      text-transform: lowercase;
      user-select: text;
      -webkit-user-select: text;
    }

    input#hexInput.invalid {
      background: #ffe0e0;
      color: #900;
    }

    .hex-hint {
      font-size: 11px;
      color: #333;
    }

    /* Status Bar */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 2px 6px;
      font-size: 11px;
      background: var(--bg-face);
      border-top: 1px solid var(--bg-light);
      flex-shrink: 0;
    }

    .status-cell {
      padding: 1px 6px;
      border-top: 1px solid var(--bg-dark);
      border-left: 1px solid var(--bg-dark);
      border-right: 1px solid var(--bg-light);
      border-bottom: 1px solid var(--bg-light);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-main {
      flex: 1;
    }

    @media (max-width: 860px) {
      .side-dock:not(.collapsed) {
        width: 195px;
      }
    }

    @media (max-width: 640px) {
      .side-dock {
        display: none;
      }
      .swatches {
        grid-template-columns: repeat(14, 15px);
        grid-template-rows: repeat(2, 14px);
      }
      .swatch {
        width: 15px;
        height: 14px;
      }
    }

  </style>

<body>

  <script>
    (() => {
      const CLASSIC_PALETTE = [

      ];

      const TOOL_NAMES = {
        select: "Select",

        text: "Text",
        pencil: "Pencil",
        brush: "Paintbrush",

      const canvas = document.getElementById("paintCanvas");

      const viewport = document.getElementById("viewport");

      const toolsGrid = document.getElementById("toolsGrid");

      const copyBtn = document.getElementById("copyBtn");

      const deleteSelBtn = document.getElementById("deleteSelBtn");
      const invertSelectionBtn = document.getElementById("invertSelectionBtn");
      const unselectAllBtn = document.getElementById("unselectAllBtn");
      const undoBtn = document.getElementById("undoBtn");
      const redoBtn = document.getElementById("redoBtn");
      const newBtn = document.getElementById("newBtn");
      const saveBtn = document.getElementById("saveBtn");
      const transparentPngToggle = document.getElementById("transparentPngToggle");

      const canvasHInput = document.getElementById("canvasH");

      const gridBtn = document.getElementById("gridBtn");
      const fillToleranceInput = document.getElementById("fillTolerance");

      const textSizeInput = document.getElementById("textSizeInput");
      const gridOverlay = document.getElementById("gridOverlay");
      const canvasStage = document.getElementById("canvasStage");

      // Layers UI
      const layersListEl = document.getElementById("layersList");
      const layerCountLabel = document.getElementById("layerCountLabel");
      const addLayerBtn = document.getElementById("addLayerBtn");
      const dupLayerBtn = document.getElementById("dupLayerBtn");
      const delLayerBtn = document.getElementById("delLayerBtn");
      const moveLayerUpBtn = document.getElementById("moveLayerUpBtn");
      const moveLayerDownBtn = document.getElementById("moveLayerDownBtn");

      if (sideDock && toggleSideDockBtn) {

      // Adjustments UI
      const adjBrightness = document.getElementById("adjBrightness");

      const adjContrastVal = document.getElementById("adjContrastVal");

      const applyAdjBtn = document.getElementById("applyAdjBtn");

      const dimText = document.getElementById("dimText");

      let currentTool = "pencil";

      let drawing = false;
      let startPt = { x: 0, y: 0 };
      let lastPt = { x: 0, y: 0 };

      // Stackable layers (index 0 = bottom, last index = top)
      let layers = [];
      let activeLayerIndex = 0;

      // Rectangular selection & floating movable/pasted region state
      let selectionRect = null;
      let clipboardCanvas = null;
      let floatingPaste = null;
      let draggingFloating = false;
      let dragOffset = { x: 0, y: 0 };
      let hasUsedSelectionToolInCanvas = false;

      // Pixel-mask selection state (used by Magic Wand & Invert Selection)
      const maskSelection = {
        active: false,
        width: 0,
        height: 0,
        mask: null,
        bounds: null,
        dashOffset: 0
      };

      // Pan / Hand tool state
      const panState = {
        isPanning: false,
        spaceHeld: false,
        lastClientX: 0,
        lastClientY: 0
      };

      // Active text box overlay
      let activeTextInput = null;
      let activeTextPt = null;

      const history = [];
      let historyIndex = -1;
      const MAX_HISTORY = 25;

      function createLayer(name, w, h, fillColor = null) {
        const lCanvas = document.createElement("canvas");
        lCanvas.width = w;
        lCanvas.height = h;
        const lCtx = lCanvas.getContext("2d", { willReadFrequently: true });
        if (fillColor) {
          lCtx.save();
          lCtx.fillStyle = fillColor;
          lCtx.fillRect(0, 0, w, h);
          lCtx.restore();
        }
        return {
          id: `layer_${layerCounter++}`,
          name: name || `Layer ${layerCounter}`,
          visible: true,
          opacity: 1,
          canvas: lCanvas,
          ctx: lCtx
        };
      }

      let customColorValue = null;

      function rgbToHex(r, g, b) {
        const clamp = n => Math.max(0, Math.min(255, Number.parseInt(n, 10) || 0));
        const toHex = n => clamp(n).toString(16).padStart(2, "0");
        return `#${toHex(r)}${toHex(g)}${toHex(b)}`.toLowerCase();
      }

      function hexToRgbParts(hex) {
        const clean = (hex || "#000000").replace(/^#/, "");
        const full = clean.length === 3
          ? clean.split("").map(c => c + c).join("")
          : clean.padEnd(6, "0").slice(0, 6);
        return {
          r: Number.parseInt(full.slice(0, 2), 16) || 0,
          g: Number.parseInt(full.slice(2, 4), 16) || 0,
          b: Number.parseInt(full.slice(4, 6), 16) || 0
        };
      }

      const rgbPopover = (() => {
        const pop = document.createElement("div");
        pop.className = "rgb-picker-popover";
        pop.setAttribute("role", "dialog");
        pop.setAttribute("aria-label", "Custom RGB Color Picker");

        pop.innerHTML = `
          <div style="font-weight:bold;">Custom RGB Color</div>
          <div class="rgb-picker-row">
            <label for="rgbRRange">R</label>
            <input type="range" id="rgbRRange" min="0" max="255" value="0" />

          </div>
          <div class="rgb-picker-row">
            <label for="rgbGRange">G</label>
            <input type="range" id="rgbGRange" min="0" max="255" value="0" />
            <input type="number" id="rgbGNum" min="0" max="255" value="0" />
          </div>
          <div class="rgb-picker-row">
            <label for="rgbBRange">B</label>
            <input type="range" id="rgbBRange" min="0" max="255" value="0" />
            <input type="number" id="rgbBNum" min="0" max="255" value="0" />
          </div>
<div class="rgb-picker-footer">
  <span class="rgb-picker-preview" id="rgbPopPreview"></span>
  <input
    type="text"
    id="rgbPopHex"
    maxlength="7"
    value="#000000"
    aria-label="Hex color code"
    style="width: 68px; font-family: var(--font-mono, monospace); font-size: 11px; padding: 2px 4px; box-sizing: border-box;"
  />
  <button type="button" id="rgbPopClose">Done</button>
</div>

        `;
        document.body.appendChild(pop);

        document.addEventListener("pointerdown", e => {
          const customBtn = document.getElementById("customSwatchBtn");
          if (!pop.classList.contains("open")) return;
          if (pop.contains(e.target) || customBtn?.contains(e.target)) return;
          pop.classList.remove("open");
        });

        return pop;
      })();

      function syncCustomPopover(hex) {
        if (typeof rgbPopover === "undefined" || !hex) return;
        const fullHex = hex.startsWith("#") ? hex.toLowerCase() : `#${hex.toLowerCase()}`;
        const { r, g, b } = hexToRgbParts(fullHex);

        rgbPopover.querySelector("#rgbRRange").value = r;
        rgbPopover.querySelector("#rgbRNum").value = r;
        rgbPopover.querySelector("#rgbGRange").value = g;
        rgbPopover.querySelector("#rgbGNum").value = g;
        rgbPopover.querySelector("#rgbBRange").value = b;
        rgbPopover.querySelector("#rgbBNum").value = b;
        rgbPopover.querySelector("#rgbPopPreview").style.backgroundColor = fullHex;
        rgbPopover.querySelector("#rgbPopHex").value = fullHex.toUpperCase();

        customColorValue = fullHex;
        const customBtn = document.getElementById("customSwatchBtn");
        if (customBtn) {
          customBtn.dataset.hasColor = "true";
          customBtn.style.setProperty("background", fullHex, "important");
          customBtn.title = `${fullHex.toUpperCase()} Custom RGB (Left: Choose/Primary, Right: Secondary)`;
        }
      }


      function openRgbPopoverForButton(customBtn) {
        const rawHex = (hexInput?.value || "").trim().replace(/^#/, "");
        const startHex = customColorValue ||
          (/^[0-9a-f]{3}$/i.test(rawHex)
            ? "#" + rawHex.split("").map(ch => ch + ch).join("")
            : /^[0-9a-f]{6}$/i.test(rawHex)
              ? "#" + rawHex
              : "#000000");

        const { r, g, b } = hexToRgbParts(startHex);

        const rRange = rgbPopover.querySelector("#rgbRRange");
        const gRange = rgbPopover.querySelector("#rgbGRange");
        const bRange = rgbPopover.querySelector("#rgbBRange");
        const rNum = rgbPopover.querySelector("#rgbRNum");
        const gNum = rgbPopover.querySelector("#rgbGNum");
        const bNum = rgbPopover.querySelector("#rgbBNum");
        const popPreview = rgbPopover.querySelector("#rgbPopPreview");
        const popHex = rgbPopover.querySelector("#rgbPopHex");
        const closeBtn = rgbPopover.querySelector("#rgbPopClose");

        rRange.value = rNum.value = r;
        gRange.value = gNum.value = g;
        bRange.value = bNum.value = b;

const applyCurrentRgb = (skipPopHex = false) => {
  const chosen = rgbToHex(rRange.value, gRange.value, bRange.value);
  customColorValue = chosen;
  customBtn.dataset.hasColor = "true";
customBtn.style.setProperty("background", chosen, "important");
  customBtn.title = `${chosen.toUpperCase()} Custom RGB (Left: Choose/Primary, Right: Secondary)`;

  popPreview.style.background = chosen;
  if (!skipPopHex) {
    popHex.value = chosen.toUpperCase();
  }

      function getActiveLayer() {
        return layers[activeLayerIndex] || null;
      }

      function getActiveCtx() {
        const layer = getActiveLayer();
        return layer ? layer.ctx : ctx;
      }

      function renderCompositeCanvas(targetCanvas = canvas, includeWhiteBackdrop = false) {
        const tCtx = targetCanvas.getContext("2d", { willReadFrequently: true });
        tCtx.clearRect(0, 0, targetCanvas.width, targetCanvas.height);

        if (includeWhiteBackdrop) {
          tCtx.save();
          tCtx.fillStyle = "#ffffff";
          tCtx.fillRect(0, 0, targetCanvas.width, targetCanvas.height);
          tCtx.restore();
        }

        for (let i = 0; i < layers.length; i++) {
          const layer = layers[i];
          if (!layer.visible || layer.opacity <= 0) continue;
          tCtx.save();
          tCtx.globalAlpha = Math.max(0, Math.min(1, layer.opacity));
          tCtx.drawImage(layer.canvas, 0, 0);
          tCtx.restore();
        }
      }

      function syncLayersUI() {
        layerCountLabel.textContent = String(layers.length);
        layersListEl.innerHTML = "";

        layers.forEach((layer, idx) => {
          const item = document.createElement("div");
          item.className = `layer-item${idx === activeLayerIndex ? " active" : ""}`;
          item.addEventListener("click", () => {
            commitTextInput(false);
            if (floatingPaste) commitFloatingPaste();
            activeLayerIndex = idx;
            syncLayersUI();
            setStatus(`Active layer: ${layer.name}`);
          });

          const visBox = document.createElement("input");
          visBox.type = "checkbox";
          visBox.checked = layer.visible;
          visBox.title = "Toggle layer visibility";
          visBox.addEventListener("click", e => e.stopPropagation());
          visBox.addEventListener("change", () => {
            layer.visible = visBox.checked;
            renderCompositeCanvas();
            pushHistory();
          });

          const nameSpan = document.createElement("span");
          nameSpan.className = "layer-name";
          nameSpan.textContent = layer.name;

          const alphaSpan = document.createElement("span");
          alphaSpan.className = "layer-alpha-tag";
          alphaSpan.textContent = `${Math.round(layer.opacity * 100)}%`;

          item.appendChild(visBox);
          item.appendChild(nameSpan);
          item.appendChild(alphaSpan);
          layersListEl.appendChild(item);
        });

        const active = getActiveLayer();
        if (active) {
          const pct = Math.round(active.opacity * 100);
          layerOpacityRange.value = String(pct);
          layerOpacityVal.textContent = `${pct}%`;
        }

        moveLayerUpBtn.disabled = activeLayerIndex >= layers.length - 1;
        moveLayerDownBtn.disabled = activeLayerIndex <= 0;
      }

      function resetLayersToSingleWhite(w, h) {
        layerCounter = 1;
        const base = createLayer("Background", w, h, "#ffffff");
        layers = [base];
        activeLayerIndex = 0;
        syncLayersUI();
        renderCompositeCanvas();
      }

      function addNewLayer() {
        commitTextInput(false);
        if (floatingPaste) commitFloatingPaste();
        const newLayer = createLayer(`Layer ${layers.length + 1}`, canvas.width, canvas.height, null);
        const insertAt = Math.min(layers.length, activeLayerIndex + 1);
        layers.splice(insertAt, 0, newLayer);
        activeLayerIndex = insertAt;
        syncLayersUI();
        renderCompositeCanvas();
        pushHistory();
        setStatus(`Added ${newLayer.name} (transparent)`);
      }

      function duplicateActiveLayer() {
        const src = getActiveLayer();
        if (!src) return;
        commitTextInput(false);
        if (floatingPaste) commitFloatingPaste();
        const copy = createLayer(`${src.name} Copy`, canvas.width, canvas.height, null);
        copy.visible = src.visible;
        copy.opacity = src.opacity;
        copy.ctx.drawImage(src.canvas, 0, 0);
        const insertAt = Math.min(layers.length, activeLayerIndex + 1);
        layers.splice(insertAt, 0, copy);
        activeLayerIndex = insertAt;
        syncLayersUI();
        renderCompositeCanvas();
        pushHistory();
        setStatus(`Duplicated ${src.name}`);
      }

      function deleteActiveLayer() {
        if (layers.length <= 1) return;
        commitTextInput(false);
        clearSelectionState(false);
        const removed = layers.splice(activeLayerIndex, 1)[0];
        activeLayerIndex = Math.max(0, Math.min(layers.length - 1, activeLayerIndex));
        syncLayersUI();
        renderCompositeCanvas();
        pushHistory();
        setStatus(`Deleted ${removed.name}`);
      }

      function moveActiveLayer(delta) {
        const nextIdx = activeLayerIndex + delta;
        if (nextIdx < 0 || nextIdx >= layers.length) return;
        commitTextInput(false);
        const [moved] = layers.splice(activeLayerIndex, 1);
        layers.splice(nextIdx, 0, moved);
        activeLayerIndex = nextIdx;
        syncLayersUI();
        renderCompositeCanvas();
        pushHistory();
        setStatus(`Moved ${moved.name}`);
      }

      function getTolerance() {
        if (!fillToleranceInput) return 32;
        const val = parseInt(fillToleranceInput.value, 10);
        if (Number.isNaN(val)) return 0;
        return Math.max(0, Math.min(255, val));
      }

      function hasAnySelection() {
        return Boolean(selectionRect || floatingPaste || maskSelection.active);
      }

      function markSelectionToolUsedInCanvas() {
        if (!hasUsedSelectionToolInCanvas) {
          hasUsedSelectionToolInCanvas = true;
          updateSelectionButtons();
        }
      }

      function isPointInCurrentSelection(x, y) {
        if (floatingPaste) {
          return (
            x >= floatingPaste.x &&
            x <= floatingPaste.x + floatingPaste.w &&
            y >= floatingPaste.y &&
            y <= floatingPaste.y + floatingPaste.h
          );
        }
        if (maskSelection.active && maskSelection.mask && maskSelection.bounds) {
          const { minX, minY, maxX, maxY } = maskSelection.bounds;
          if (x < minX || x > maxX || y < minY || y > maxY) return false;
          const px = Math.min(maskSelection.width - 1, Math.max(0, Math.floor(x)));
          const py = Math.min(maskSelection.height - 1, Math.max(0, Math.floor(y)));
          return maskSelection.mask[py * maskSelection.width + px] > 0;
        }
        if (selectionRect && selectionRect.w > 0 && selectionRect.h > 0) {
          return (
            x >= selectionRect.x &&
            x <= selectionRect.x + selectionRect.w &&
            y >= selectionRect.y &&
            y <= selectionRect.y + selectionRect.h
          );
        }
        return false;
      }

      function liftCurrentSelectionToFloating() {
        if (floatingPaste) return true;
        const activeLayer = getActiveLayer();
        if (!activeLayer) return false;
        const lCtx = activeLayer.ctx;

        if (maskSelection.active && maskSelection.mask && maskSelection.bounds) {
          const { minX, minY, maxX, maxY } = maskSelection.bounds;
          const bw = maxX - minX + 1;
          const bh = maxY - minY + 1;
          if (bw <= 0 || bh <= 0) return false;

          const floatCanvas = document.createElement("canvas");
          floatCanvas.width = bw;
          floatCanvas.height = bh;
          const floatCtx = floatCanvas.getContext("2d");

          const layerImg = lCtx.getImageData(minX, minY, bw, bh);
          const floatImg = floatCtx.createImageData(bw, bh);

          for (let y = 0; y < bh; y++) {
            const maskRow = (minY + y) * maskSelection.width;
            for (let x = 0; x < bw; x++) {
              if (maskSelection.mask[maskRow + (minX + x)] > 0) {
                const idx = (y * bw + x) * 4;
                floatImg.data[idx] = layerImg.data[idx];
                floatImg.data[idx + 1] = layerImg.data[idx + 1];
                floatImg.data[idx + 2] = layerImg.data[idx + 2];
                floatImg.data[idx + 3] = layerImg.data[idx + 3];

                // Clear lifted pixels from active layer so moving leaves clean background
                layerImg.data[idx] = 0;
                layerImg.data[idx + 1] = 0;
                layerImg.data[idx + 2] = 0;
                layerImg.data[idx + 3] = 0;
              }
            }
          }

          floatCtx.putImageData(floatImg, 0, 0);
          lCtx.putImageData(layerImg, minX, minY);

          // Shift mask along with the lifted selection
          const nextMask = createMask(maskSelection.width, maskSelection.height, 0);
          for (let y = 0; y < bh; y++) {
            const srcRow = (minY + y) * maskSelection.width;
            for (let x = 0; x < bw; x++) {
              if (maskSelection.mask[srcRow + (minX + x)] > 0) {
                const nx = minX + x;
                const ny = minY + y;
                if (nx >= 0 && nx < maskSelection.width && ny >= 0 && ny < maskSelection.height) {
                  nextMask[ny * maskSelection.width + nx] = 255;
                }
              }
            }
          }
          maskSelection.mask = nextMask;

          floatingPaste = {
            canvas: floatCanvas,
            x: minX,
            y: minY,
            w: bw,
            h: bh,
            fromMask: true
          };
          selectionRect = { x: minX, y: minY, w: bw, h: bh };
          renderCompositeCanvas();
          return true;
        }

        if (selectionRect && selectionRect.w > 0 && selectionRect.h > 0) {
          const sx = Math.max(0, Math.floor(selectionRect.x));
          const sy = Math.max(0, Math.floor(selectionRect.y));
          const sw = Math.min(canvas.width - sx, Math.ceil(selectionRect.w));
          const sh = Math.min(canvas.height - sy, Math.ceil(selectionRect.h));
          if (sw <= 0 || sh <= 0) return false;

          const floatCanvas = document.createElement("canvas");
          floatCanvas.width = sw;
          floatCanvas.height = sh;
          floatCanvas.getContext("2d").drawImage(lCtx.canvas, sx, sy, sw, sh, 0, 0, sw, sh);

          lCtx.clearRect(sx, sy, sw, sh);
          renderCompositeCanvas();

          floatingPaste = {
            canvas: floatCanvas,
            x: sx,
            y: sy,
            w: sw,
            h: sh,
            fromMask: false
          };
          selectionRect = { x: sx, y: sy, w: sw, h: sh };
          return true;
        }

        return false;
      }

      function shiftMaskBy(dx, dy) {
        if (!maskSelection.mask || !maskSelection.active) return;
        const { width, height, mask } = maskSelection;
        const shifted = createMask(width, height, 0);
        for (let y = 0; y < height; y++) {
          const ny = y + dy;
          if (ny < 0 || ny >= height) continue;
          const srcRow = y * width;
          const dstRow = ny * width;
          for (let x = 0; x < width; x++) {
            if (mask[srcRow + x] === 0) continue;
            const nx = x + dx;
            if (nx >= 0 && nx < width) {
              shifted[dstRow + nx] = 255;
            }
          }
        }
        maskSelection.mask = shifted;
        recomputeMaskBounds();
      }

      function nudgeSelection(dx, dy) {
        if (currentTool !== "select" || !hasAnySelection()) return;

        if (!floatingPaste) {
          liftCurrentSelectionToFloating();
        }
        if (!floatingPaste) return;

        const prevX = floatingPaste.x;
        const prevY = floatingPaste.y;
        floatingPaste.x += dx;
        floatingPaste.y += dy;
        selectionRect = {
          x: floatingPaste.x,
          y: floatingPaste.y,
          w: floatingPaste.w,
          h: floatingPaste.h
        };

        if (floatingPaste.fromMask && maskSelection.mask) {
          shiftMaskBy(floatingPaste.x - prevX, floatingPaste.y - prevY);

        renderSelectionOverlay();
        updateSelectionButtons();
        setStatus(`Moved selection to (${floatingPaste.x}, ${floatingPaste.y}) — press Enter or click outside to stamp`);

      function deleteSelectedArea() {
        // Only allowed when the Select Tool is equipped
        if (currentTool !== "select") {
          setStatus("Equip the Select Tool to delete a selected area");
          return;

        if (!hasAnySelection()) return;

        if (floatingPaste) {
          floatingPaste = null;
          draggingFloating = false;
