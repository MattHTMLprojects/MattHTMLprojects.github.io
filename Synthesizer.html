        let audioCtx = null;

            if (!audioCtx) {

        // Dynamically build the DOM structure for the 37 keys
        notes.forEach((note, index) => {
            const keyDiv = document.createElement('div');

            keyDiv.dataset.freq = note.freq;

            // Mouse and Touch Event Listeners

            keyDiv.addEventListener('mouseup', () => stopNote(note.name, keyDiv));

        // Trigger Audio Synthesis
        function startNote(freq, noteName, element) {
            const ctx = getAudioContext();
            if (ctx.state === 'suspended') {
                ctx.resume();
            }

            // If the note is already playing, stop it first to prevent overlapping duplicates
            if (activeOscillators[noteName]) {
                stopNote(noteName, element);
            }

// Create Oscillators and Gain node
const osc = ctx.createOscillator();
const osc2 = ctx.createOscillator();
 
const gainNode = ctx.createGain();

osc.type = waveformSelect.value;
osc2.type = waveformSelect.value;
 
osc.frequency.setValueAtTime(
freq,
ctx.currentTime
);
 
const detunePercent =
parseFloat(detuneSlider.value);
 
osc2.frequency.setValueAtTime(
freq * (1 + detunePercent / 100),
ctx.currentTime
);
 
            // Envelope configuration to reduce sharp clicking sound artifacts
            gainNode.gain.setValueAtTime(0, ctx.currentTime);
            gainNode.gain.linearRampToValueAtTime(5.8, ctx.currentTime + 0.01); // 0.2 maximum volume

osc.connect(gainNode);
osc2.connect(gainNode);
 
gainNode.connect(ctx.destination);
 
osc.start();
osc2.start();

            // Store nodes references to close later
activeOscillators[noteName] = {
osc,
osc2,
gainNode
};
            element.classList.add('active');
        }

        // Gracefully fade out and tear down nodes
        function stopNote(noteName, element) {
            const active = activeOscillators[noteName];
            if (active) {
                const ctx = getAudioContext();
              const {
osc,
osc2,
gainNode
} = active;

                // Audio fade-out (Release envelope stage)
                gainNode.gain.setValueAtTime(gainNode.gain.value, ctx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.05);

                // Stop node cleanup
osc.stop(ctx.currentTime + 0.06);
osc2.stop(ctx.currentTime + 0.06);
                delete activeOscillators[noteName];
            }
            element.classList.remove('active');
        }

//----------------------------------------
// KICK (below)
//----------------------------------------
function playKick() {
const ctx = getAudioContext();
const now = ctx.currentTime;
 
const osc = ctx.createOscillator();
const gain = ctx.createGain();
 
osc.type = 'triangle';
 
osc.frequency.setValueAtTime(
120,
now
);
 
osc.frequency.exponentialRampToValueAtTime(
30,
now + 0.15
);
 
gain.gain.setValueAtTime(
3.0,
now
);
 
gain.gain.exponentialRampToValueAtTime(
0.001,
now + 0.15
);
 
osc.connect(gain);
gain.connect(ctx.destination);
 
osc.start(now);
osc.stop(now + 0.16);
}

//----------------------------------------
// SNARE (below)
//----------------------------------------
function playSnare() {
const ctx = getAudioContext();
const now = ctx.currentTime;
 
const noiseBuffer = ctx.createBuffer(
1,
ctx.sampleRate * 0.2,
ctx.sampleRate
);
 
const output =
noiseBuffer.getChannelData(0);
 
for (let i = 0; i < output.length; i++) {
output[i] =
Math.random() * 2 - 1;
}
 
const noise =
ctx.createBufferSource();
 
noise.buffer = noiseBuffer;
 
const filter =
ctx.createBiquadFilter();
 
filter.type = 'highpass';
filter.frequency.value = 1000;
 
const gain = ctx.createGain();
 
gain.gain.setValueAtTime(
3.0,
now
);
 
gain.gain.exponentialRampToValueAtTime(
0.001,
now + 0.18
);
 
noise.connect(filter);
filter.connect(gain);
gain.connect(ctx.destination);
 
noise.start(now);
noise.stop(now + 0.2);
}

buffer.getChannelData(0);

data[i] =
Math.random() * 2 - 1;
}
 
const noise =
ctx.createBufferSource();
 
noise.buffer = buffer;
 
const filter =
ctx.createBiquadFilter();
 
filter.type = 'highpass';
filter.frequency.value = 10000;
 
const gain = ctx.createGain();
 
gain.gain.setValueAtTime(
3.0,
now
);
 
gain.gain.exponentialRampToValueAtTime(
0.001,
now + 0.25
);
 
noise.connect(filter);
filter.connect(gain);
gain.connect(ctx.destination);
 
noise.start(now);
noise.stop(now + 0.26);
}

//----------------------------------------
// CLAP (below)
//----------------------------------------
function playClap() {
const ctx = getAudioContext();
const now = ctx.currentTime;
 
for (let hit = 0; hit < 3; hit++) {
const hitTime =
now + hit * 0.025;
 
const buffer = ctx.createBuffer(
1,
ctx.sampleRate * 0.08,
ctx.sampleRate
);
 
const data =
buffer.getChannelData(0);
 
for (let i = 0; i < data.length; i++) {
data[i] =
Math.random() * 2 - 1;
}
 
const noise =
ctx.createBufferSource();
 
noise.buffer = buffer;
 
const filter =
ctx.createBiquadFilter();
 
filter.type = 'bandpass';
filter.frequency.value = 1400;
 
const gain = ctx.createGain();
 
gain.gain.setValueAtTime(
3.0,
hitTime
);
 
gain.gain.exponentialRampToValueAtTime(
0.001,
hitTime + 0.07
);
 
noise.connect(filter);
filter.connect(gain);
gain.connect(ctx.destination);
 
noise.start(hitTime);
noise.stop(hitTime + 0.08);
}
}

//----------------------------------------
// CRASH (below)
//----------------------------------------
function playCrash() {
const ctx = getAudioContext();
const now = ctx.currentTime;
 
const buffer = ctx.createBuffer(
1,
ctx.sampleRate * 1.2,
ctx.sampleRate
);
 
const data =
buffer.getChannelData(0);
 
for (let i = 0; i < data.length; i++) {
data[i] =
Math.random() * 2 - 1;
}

const noise =
ctx.createBufferSource();
 
noise.buffer = buffer;
 
const filter =
ctx.createBiquadFilter();
 
filter.type = 'highpass';
filter.frequency.value = 4000;
 
const gain = ctx.createGain();
 
gain.gain.setValueAtTime(
3.0,
now
);
 
gain.gain.exponentialRampToValueAtTime(
0.001,
now + 1.1
);
 
noise.connect(filter);
filter.connect(gain);
gain.connect(ctx.destination);
 
noise.start(now);
noise.stop(now + 1.2);
}

//----------------------------------------
// SYNTH FREQUENCY (below)
//----------------------------------------
function playSynthFrequency(freq,waveform) {
 
const ctx = getAudioContext();
 
const osc1 =
ctx.createOscillator();
 
const osc2 =
ctx.createOscillator();
 
const gain =
ctx.createGain();
 
osc1.type =
waveform;
 
osc2.type =
waveform;
 
osc1.frequency.value =
freq;
 
osc2.frequency.value =
freq * 1.01;
 
gain.gain.setValueAtTime(
1.0,
ctx.currentTime
);
 
gain.gain.exponentialRampToValueAtTime(
0.001,
ctx.currentTime + 1.0
);
 
osc1.connect(gain);
osc2.connect(gain);
 
gain.connect(ctx.destination);
 
osc1.start();
osc2.start();
 
osc1.stop(
ctx.currentTime + 1.2
);
 
osc2.stop(
ctx.currentTime + 1.2
);
}

// ==============================
// Sequencer Playback
// ==============================
 
function playCurrentDrumSound(soundNumber) {
switch (soundNumber) {
case 1:
playKick();
break;
 
case 2:
playSnare();
break;
 
case 3:
playKick();
playSnare();
break;
 
case 4:
playHiHat();
break;
 
case 5:
playClap();
break;
 
case 6:
playCrash();
break;
 
case 0:
default:
break;
}
}
 
function runSequenceStep() {
 
const soundNumber =
sequence[currentStep];
 
playCurrentDrumSound(
soundNumber
);
 
const synthStep =
synthSequence[currentStep];
 
if (
synthStep &&
synthStep.freq > 0
) {
 
playSynthFrequency(
synthStep.freq,
synthStep.waveform
);
 
}
 
currentStep++;
 
if (currentStep >= sequence.length) {
currentStep = 0;
}
}
 
function playSequence() {
if (sequenceTimer !== null) {
return;
}
 
const ctx = getAudioContext();
 
if (ctx.state === 'suspended') {
ctx.resume();
}
 
const bpm =
Number(
document.getElementById('bpm').value
);
 
const millisecondsPerStep =
(60000 / bpm) / 4;
 
currentStep = 0;
 
// Start step 1 immediately
runSequenceStep();
 
sequenceTimer =
window.setInterval(
runSequenceStep,
millisecondsPerStep
);
}
 
function stopSequence() {
if (sequenceTimer !== null) {
window.clearInterval(
sequenceTimer
);
 
sequenceTimer = null;
}
 
currentStep = 0;
}
 
// ==============================
// Drum Controls
// ==============================
 
document
.getElementById('playSequence')
.addEventListener(
'click',
playSequence
);
 
document
.getElementById('stopSequence')
.addEventListener(
'click',
stopSequence
);
 
const bpmSlider =
document.getElementById('bpm');
 
const bpmValue =
document.getElementById('bpmValue');
 
bpmSlider.addEventListener('input', () => {
bpmValue.textContent =
bpmSlider.value;
 
if (sequenceTimer !== null) {
stopSequence();
playSequence();
}
});


// ==============================
// Physical keyboard controls
// ==============================
 
window.addEventListener('keydown', (e) => {
 
const key = e.key.toLowerCase();

if (key === '[') {
 
if (octaveShift > -3) {
octaveShift--;
}
 
document.getElementById(
'octaveDisplay'
).textContent =
octaveShift > 0
? '+' + octaveShift
: octaveShift;
 
return;
}
 
if (key === ']') {
 
if (octaveShift < 3) {
octaveShift++;
}
 
document.getElementById(
'octaveDisplay'
).textContent =
octaveShift > 0
? '+' + octaveShift
: octaveShift;
 
return;
}

 
if (!computerKeyMap[key]) return;
if (pressedKeys.has(key)) return;
 
pressedKeys.add(key);
 
const noteName = computerKeyMap[key];
const note = noteLookup[noteName];
 
if (!note) return;
 
const element = document.querySelector(
`[data-note="${noteName}"]`
);
 
startNote(
shiftedFrequency(note.freq),
note.name,
element
);
});
 
window.addEventListener('keyup', (e) => {
 
const key = e.key.toLowerCase();
 
if (!computerKeyMap[key]) return;
 
pressedKeys.delete(key);
 
const noteName = computerKeyMap[key];
 
const element = document.querySelector(
`[data-note="${noteName}"]`
);
 
stopNote(
noteName,
element
);
});
 
// Prevent stuck notes when browser loses focus

const octaveDisplay =
document.getElementById('octaveDisplay');
 
document.getElementById('octaveUp')
.addEventListener('click', () => {
 
if (octaveShift < 3) {
octaveShift++;
}
 
octaveDisplay.textContent =
octaveShift > 0
? '+' + octaveShift
: octaveShift;
});
 
document.getElementById('octaveDown')
.addEventListener('click', () => {
 
if (octaveShift > -3) {
octaveShift--;
}
 
octaveDisplay.textContent =
octaveShift > 0
? '+' + octaveShift
: octaveShift;
});

window.addEventListener('blur', () => {
 
pressedKeys.clear();
 
Object.keys(activeOscillators).forEach(noteName => {
 
const element = document.querySelector(
`[data-note="${noteName}"]`
);
 
stopNote(noteName, element);
});
});

function randomizeMelody() {
 
const style =
document.getElementById(
'melodyStyle'
).value;
 
let scale;
 
switch(style) {
 
case "cyberpunk":
 
scale = [
130.81,
155.56,
196.00,
233.08,

392.00,
466.16
];
 
break;
 
case "grunge":
 
scale = [
50,
100,
220.00,
261.63,
293.66,
329.63,
392.00
];
 
break;
 
case "dark":
 
scale = [
50,
100,
120,
130.81,
146.83,
174.61,
196.00
];
 
break;
 
case "techno":
 
scale = [
60,
293.66,

440.00,
523.25
];
 
break;
 
default:
 
scale = [
200,
300,
500,
600,
800,
2000
];
}
 
const inputs =
document.querySelectorAll(
'#synthSequencer input[type="number"]'
);
 
let noteIndex =
Math.floor(
Math.random() *
scale.length
);
 
for(let i = 0; i < 16; i++) {
 
if(Math.random() < 0.15) {
 
synthSequence[i].freq = 0;
inputs[i].value = 0;
continue;
}
 
noteIndex +=
Math.floor(
Math.random() * 3
) - 1;
 
noteIndex =
Math.max(
0,
Math.min(
scale.length - 1,
noteIndex
)
);
 
const freq =
scale[noteIndex];
 
synthSequence[i].freq =
freq;
 
inputs[i].value =
freq.toFixed(2);
}
}
